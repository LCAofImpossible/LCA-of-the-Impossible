<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1280" viewBox="0 0 1024 1280" role="img" aria-labelledby="title desc">
  <title id="title">LCA of the Impossible — Episode #39 — Atlantis</title>
  <desc id="desc">Canonical catalogue cover for Atlantis: a dark engraved technical plate showing the concentric royal-harbor city, system-boundary diagrams and a materials-driven LCA lens.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="70%">
      <stop offset="0" stop-color="#111b21"/>
      <stop offset=".58" stop-color="#091218"/>
      <stop offset="1" stop-color="#050b10"/>
    </radialGradient>
    <radialGradient id="water" cx="50%" cy="45%" r="65%">
      <stop offset="0" stop-color="#16393b"/>
      <stop offset=".72" stop-color="#0b2327"/>
      <stop offset="1" stop-color="#07161b"/>
    </radialGradient>
    <linearGradient id="stone" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d9c8ab"/>
      <stop offset=".22" stop-color="#8e7a5f"/>
      <stop offset=".52" stop-color="#3f3931"/>
      <stop offset=".78" stop-color="#9b896d"/>
      <stop offset="1" stop-color="#322f2a"/>
    </linearGradient>
    <linearGradient id="bronze" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d0a563"/>
      <stop offset=".45" stop-color="#86683f"/>
      <stop offset="1" stop-color="#4a3824"/>
    </linearGradient>
    <filter id="paper" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency=".58" numOctaves="3" seed="39" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="gray"/>
      <feComponentTransfer in="gray" result="faded"><feFuncA type="table" tableValues="0 .10"/></feComponentTransfer>
      <feBlend in="SourceGraphic" in2="faded" mode="screen"/>
    </filter>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(28)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#d0a563" stroke-opacity=".12" stroke-width="1"/>
    </pattern>
    <pattern id="stoneHatch" width="16" height="12" patternUnits="userSpaceOnUse">
      <path d="M0 6h16M8 0v6M3 6v6M13 6v6" fill="none" stroke="#eadcc4" stroke-opacity=".18" stroke-width=".8"/>
    </pattern>
    <symbol id="building" viewBox="0 0 22 40">
      <path d="M2 38V17h18v21M5 17V9h12v8M8 9V3h6v6" fill="#181816" stroke="#c7b18d" stroke-width="1"/>
      <path d="M6 23h3v5H6zm7 0h3v5h-3zM6 31h3v5H6zm7 0h3v5h-3z" fill="#d0a563" fill-opacity=".28"/>
    </symbol>
    <symbol id="tower" viewBox="0 0 30 64">
      <path d="M5 62V21h20v41M9 21V10h12v11M12 10V2h6v8" fill="#171715" stroke="#d4c3a3" stroke-width="1.2"/>
      <path d="M10 28h4v7h-4zm7 0h4v7h-4zM10 40h4v7h-4zm7 0h4v7h-4z" fill="#d0a563" fill-opacity=".24"/>
    </symbol>
  </defs>

  <rect width="1024" height="1280" fill="url(#bg)"/>
  <rect width="1024" height="1280" fill="url(#hatch)" opacity=".28"/>
  <rect x="18" y="18" width="988" height="1244" fill="none" stroke="#9f7a48" stroke-width="2" opacity=".82"/>
  <rect x="29" y="29" width="966" height="1222" fill="none" stroke="#5f4a31" stroke-width="1" opacity=".75"/>

  <!-- registration corners -->
  <g fill="none" stroke="#a47d49" stroke-width="1.4" opacity=".78">
    <path d="M18 64h42M18 18v42M1006 64h-42M1006 18v42M18 1216h42M18 1262v-42M1006 1216h-42M1006 1262v-42"/>
    <circle cx="32" cy="32" r="13"/><circle cx="992" cy="32" r="13"/><circle cx="32" cy="1248" r="13"/><circle cx="992" cy="1248" r="13"/>
    <path d="M496 18h32M512 2v32M496 1262h32M512 1246v32"/>
    <circle cx="512" cy="18" r="9"/><circle cx="512" cy="1262" r="9"/>
  </g>

  <!-- header -->
  <g text-anchor="middle">
    <text x="512" y="88" fill="#d7c4a5" font-family="Georgia, 'Times New Roman', serif" font-size="27" letter-spacing="8">LCA OF THE IMPOSSIBLE</text>
    <g stroke="#2aa878" stroke-width="1.6" fill="none" opacity=".88">
      <path d="M360 147h83M581 147h83"/><path d="M512 139l8 8-8 8-8-8z"/>
    </g>
    <text x="512" y="132" fill="#39b37f" font-family="Georgia, 'Times New Roman', serif" font-size="18" letter-spacing="6">EPISODE #39</text>
    <text x="512" y="236" fill="#e1d3bc" font-family="Georgia, 'Times New Roman', serif" font-size="92" letter-spacing="14">ATLANTIS</text>
  </g>

  <!-- technical geometry -->
  <g transform="translate(512 662)" fill="none" stroke="#9c7848" opacity=".55">
    <circle r="335" stroke-width="1.1"/><circle r="295" stroke-width=".8" stroke-dasharray="4 7"/>
    <circle r="252" stroke-width="1"/><circle r="208" stroke-width=".7" stroke-dasharray="3 8"/>
    <circle r="165" stroke-width="1"/><circle r="118" stroke-width=".8" stroke-dasharray="2 7"/>
    <line x1="-370" y1="0" x2="370" y2="0" stroke-width=".7"/><line x1="0" y1="-365" x2="0" y2="365" stroke-width=".7"/>
    <line x1="-260" y1="-260" x2="260" y2="260" stroke-width=".5"/><line x1="260" y1="-260" x2="-260" y2="260" stroke-width=".5"/>
  </g>

  <!-- sea and concentric city -->
  <g transform="translate(512 675)">
    <ellipse cx="0" cy="210" rx="350" ry="76" fill="#02070a" opacity=".85"/>
    <circle r="298" fill="url(#water)" stroke="#2aa878" stroke-opacity=".35" stroke-width="2"/>
    <circle r="268" fill="none" stroke="#181713" stroke-width="33"/>
    <circle r="268" fill="none" stroke="url(#stone)" stroke-width="25"/>
    <circle r="268" fill="none" stroke="url(#stoneHatch)" stroke-width="24" opacity=".75"/>
    <circle r="230" fill="none" stroke="#0b2930" stroke-width="42"/>
    <circle r="191" fill="none" stroke="url(#stone)" stroke-width="29"/>
    <circle r="191" fill="none" stroke="url(#stoneHatch)" stroke-width="27"/>
    <circle r="149" fill="none" stroke="#0b2930" stroke-width="38"/>
    <circle r="114" fill="none" stroke="url(#stone)" stroke-width="27"/>
    <circle r="114" fill="none" stroke="url(#stoneHatch)" stroke-width="25"/>
    <circle r="72" fill="#171612" stroke="url(#bronze)" stroke-width="7"/>

    <!-- radial bridges -->
    <g stroke="#b49a73" stroke-width="10" opacity=".92">
      <path d="M0 68V300"/><path d="M0 -68V-294"/><path d="M68 0H294"/><path d="M-68 0H-294"/>
    </g>
    <g stroke="#423725" stroke-width="4" stroke-dasharray="7 6" opacity=".9">
      <path d="M0 68V300"/><path d="M0 -68V-294"/><path d="M68 0H294"/><path d="M-68 0H-294"/>
    </g>

    <!-- southern sea canal -->
    <path d="M-14 286L-22 392L22 392L14 286" fill="#0a3035" stroke="#2aa878" stroke-width="2"/>
    <path d="M-28 286L-37 400M28 286L37 400" stroke="#b79b72" stroke-width="6"/>

    <!-- central temple -->
    <g transform="translate(0 -8)">
      <path d="M-52 53H52L42 24H-42z" fill="#25231e" stroke="#cdb997" stroke-width="2"/>
      <path d="M-40 24h80l-8-58h-64z" fill="#1b1a17" stroke="#d0a563" stroke-width="2"/>
      <path d="M-30 -34h60l-8-23h-44z" fill="#28251f" stroke="#d9c5a3" stroke-width="2"/>
      <path d="M-12 -57h24v-27h-24zM0 -84v-16" fill="#24211c" stroke="#d0a563" stroke-width="2"/>
      <g stroke="#c9b693" stroke-width="3"><path d="M-29 20V-25M-15 20V-25M0 20V-25M15 20V-25M29 20V-25"/></g>
      <path d="M-40 24h80" stroke="#39b37f" stroke-width="1.4"/>
    </g>

    <!-- dense architecture around rings -->
    <g opacity=".92">
      <use href="#tower" x="-15" y="-282" width="30" height="64"/>
      <use href="#tower" x="-15" y="218" width="30" height="64" transform="rotate(180 0 250)"/>
      <use href="#tower" x="218" y="-32" width="30" height="64" transform="rotate(90 233 0)"/>
      <use href="#tower" x="-248" y="-32" width="30" height="64" transform="rotate(-90 -233 0)"/>
      <g>
        <use href="#building" x="-175" y="-242" width="22" height="40"/>
        <use href="#building" x="-123" y="-266" width="22" height="40"/>
        <use href="#building" x="103" y="-266" width="22" height="40"/>
        <use href="#building" x="153" y="-242" width="22" height="40"/>
        <use href="#building" x="-231" y="-174" width="22" height="40"/>
        <use href="#building" x="209" y="-174" width="22" height="40"/>
        <use href="#building" x="-264" y="-92" width="22" height="40"/>
        <use href="#building" x="242" y="-92" width="22" height="40"/>
        <use href="#building" x="-264" y="50" width="22" height="40"/>
        <use href="#building" x="242" y="50" width="22" height="40"/>
        <use href="#building" x="-231" y="134" width="22" height="40"/>
        <use href="#building" x="209" y="134" width="22" height="40"/>
        <use href="#building" x="-175" y="202" width="22" height="40"/>
        <use href="#building" x="153" y="202" width="22" height="40"/>
      </g>
      <g transform="scale(.82)">
        <use href="#building" x="-170" y="-180" width="22" height="40"/>
        <use href="#building" x="-78" y="-214" width="22" height="40"/>
        <use href="#building" x="56" y="-214" width="22" height="40"/>
        <use href="#building" x="148" y="-180" width="22" height="40"/>
        <use href="#building" x="-205" y="-92" width="22" height="40"/>
        <use href="#building" x="183" y="-92" width="22" height="40"/>
        <use href="#building" x="-205" y="58" width="22" height="40"/>
        <use href="#building" x="183" y="58" width="22" height="40"/>
        <use href="#building" x="-158" y="150" width="22" height="40"/>
        <use href="#building" x="136" y="150" width="22" height="40"/>
      </g>
    </g>

    <!-- stone wall contour -->
    <circle r="285" fill="none" stroke="#e0ceb1" stroke-opacity=".45" stroke-width="1"/>
    <circle r="205" fill="none" stroke="#e0ceb1" stroke-opacity=".45" stroke-width="1"/>
    <circle r="128" fill="none" stroke="#e0ceb1" stroke-opacity=".45" stroke-width="1"/>
  </g>

  <!-- storm / wave contour -->
  <g fill="none" stroke="#9ba7a3" opacity=".18">
    <path d="M91 944c95-38 154-21 226 5 86 32 144 33 222-3 88-40 152-33 266 13 53 21 94 25 136 10"/>
    <path d="M73 964c99-35 162-15 232 11 86 32 151 30 224-4 91-42 171-29 267 14 57 25 97 26 147 6"/>
    <path d="M136 325c64-31 114-29 174-4M709 325c76-35 137-27 193 4" stroke-dasharray="4 8"/>
  </g>

  <!-- left recurring cycle panel -->
  <g transform="translate(58 780)" font-family="Georgia, 'Times New Roman', serif">
    <text x="0" y="0" fill="#8f7652" font-size="13" letter-spacing="2">CYCLE</text>
    <rect x="-4" y="12" width="58" height="50" fill="none" stroke="#8e6e43" stroke-width="1"/>
    <text x="25" y="49" text-anchor="middle" fill="#39b37f" font-size="31">∞</text>
    <rect x="-4" y="72" width="58" height="50" fill="none" stroke="#6d5b42" stroke-opacity=".45"/>
    <path d="M7 83l36 28M43 83L7 111" stroke="#6d5b42" opacity=".45"/>
  </g>

  <!-- right system boundary panel -->
  <g transform="translate(790 760)" font-family="Georgia, 'Times New Roman', serif">
    <rect x="0" y="0" width="170" height="220" fill="#071015" fill-opacity=".82" stroke="#9d7b4d" stroke-width="1.2"/>
    <text x="18" y="32" fill="#b99866" font-size="14" letter-spacing="1.6">SYSTEM</text>
    <text x="18" y="51" fill="#b99866" font-size="14" letter-spacing="1.6">BOUNDARY</text>
    <g transform="translate(85 112)" fill="none">
      <circle r="49" stroke="#765f40"/><circle r="34" stroke="#765f40"/><circle r="19" stroke="#765f40"/>
      <path d="M-57 0H57M0-57V57" stroke="#765f40" stroke-opacity=".5"/>
      <path d="M0 0L40-32" stroke="#39b37f" stroke-width="1.8"/>
      <circle cx="40" cy="-32" r="4" fill="#39b37f" stroke="none"/>
    </g>
    <text x="18" y="184" fill="#d0a563" font-size="15">8.41 km² core</text>
    <text x="18" y="205" fill="#7f735f" font-size="12">50-stade enclosure: scenario</text>
  </g>

  <!-- annotations -->
  <g font-family="Georgia, 'Times New Roman', serif" font-size="12" fill="#806d50" letter-spacing="1.2">
    <text x="84" y="335">OUTER RADIUS 2.50 km</text>
    <path d="M83 346h120l56 48" fill="none" stroke="#806d50" stroke-width="1"/>
    <text x="735" y="370">THREE WATER RINGS</text>
    <path d="M735 380h-85l-56 40" fill="none" stroke="#806d50" stroke-width="1"/>
    <text x="89" y="1038">50-STade canal · 26.4 Mm³ excavation disclosed</text>
  </g>

  <!-- bottom series mark -->
  <g transform="translate(512 1111)" fill="none" stroke="#a77f49" stroke-width="2">
    <circle r="25"/><path d="M0-17L18 16H-18z"/><path d="M0-9v18"/>
  </g>
  <path d="M245 1111h225M554 1111h225" stroke="#83663f" stroke-width="1"/>
  <text x="512" y="1172" text-anchor="middle" fill="#b68d59" font-family="Georgia, 'Times New Roman', serif" font-size="20" font-style="italic" letter-spacing="5">Materials-driven</text>
  <text x="512" y="1214" text-anchor="middle" fill="#5f584c" font-family="Georgia, 'Times New Roman', serif" font-size="10" letter-spacing="2.5">ONE ROYAL-HARBOR CORE · 100 YEARS</text>

  <!-- aged paper overlay -->
  <rect x="18" y="18" width="988" height="1244" fill="transparent" filter="url(#paper)" opacity=".42" pointer-events="none"/>
</svg>
