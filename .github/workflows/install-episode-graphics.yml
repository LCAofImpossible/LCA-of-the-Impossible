name: Install episode graphics

on:
  push:
    branches: [episode-graphics-stage]

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: episode-graphics-stage
      - name: Extract episode graphics
        run: |
          set -e
          tar -xzf .deploy/episode_graphics.tar.gz
          rm -rf .deploy
          rm -f .github/workflows/install-episode-graphics.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Install episode editorial graphic assets"
          git push origin HEAD:episode-graphics-stage
