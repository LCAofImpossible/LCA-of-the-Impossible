name: Episode 46 Final Verification

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: ep46-final-verify
  cancel-in-progress: true

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install QA dependencies
        run: python -m pip install --disable-pip-version-check pillow

      - name: Run deterministic synchronization and QA
        id: qa
        continue-on-error: true
        shell: bash
        run: |
          set +e
          LOG="$(mktemp)"
          (
            set -e
            python scripts/apply_seo.py
            python scripts/feature_sync.py
            python scripts/engagement_sync.py
            python scripts/phase5_sync.py
            python scripts/phase6_sync.py
            python scripts/epic_passport_sync.py
            python scripts/telemetry_sync.py
            python scripts/site_qa.py
            python scripts/seo_qa.py
            python scripts/feature_qa.py
            python scripts/engagement_qa.py
            python scripts/phase5_qa.py
            python scripts/phase6_qa.py
            python scripts/telemetry_qa.py
          ) >"$LOG" 2>&1
          STATUS=$?
          if [ "$STATUS" -eq 0 ]; then
            {
              echo "Episode #46 repository QA: PASS"
              echo "Commit: $GITHUB_SHA"
              echo "Deterministic synchronization: PASS"
              echo "Structural site QA: PASS"
              echo "SEO/social QA: PASS"
              echo "Phase 3 feature QA: PASS"
              echo "Phase 4 engagement QA: PASS"
              echo "Phase 5 editorial QA: PASS"
              echo "Phase 6 / Epic Passport QA: PASS"
              echo "Visitor telemetry QA: PASS"
              echo
              cat "$LOG"
            } > ep46-qa-verification.txt
          else
            {
              echo "Episode #46 repository QA: FAIL"
              echo "Commit: $GITHUB_SHA"
              echo
              cat "$LOG"
            } > ep46-qa-verification.txt
          fi
          exit "$STATUS"

      - name: Verify deployed Episode 46
        id: live
        continue-on-error: true
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, io, json, time, traceback, urllib.error, urllib.request
          from datetime import datetime, timezone
          from PIL import Image

          BASE = 'https://lcaofimpossible.github.io/LCA-of-the-Impossible/'
          EXPECTED = '774759c90c73790a3e5a0e21a94110ba22597e3d0e429b230934f3465d69cb0a'
          lines = []

          def get(path):
              req = urllib.request.Request(BASE + path, headers={'Cache-Control':'no-cache','User-Agent':'LCA-Episode-46-Final-QA'})
              with urllib.request.urlopen(req, timeout=30) as r:
                  if r.status != 200:
                      raise RuntimeError(f'{path}: HTTP {r.status}')
                  return r.read()

          failed = False
          try:
              last = None
              for _ in range(48):
                  try:
                      html = get('episodes/nautilus.html').decode('utf-8')
                      reg = json.loads(get('episodes.json').decode('utf-8'))
                      if 'Nautilus' in html and any(e.get('number') == 46 for e in reg.get('episodes', [])):
                          break
                  except Exception as exc:
                      last = exc
                  time.sleep(5)
              else:
                  raise RuntimeError(f'Live deployment not ready: {last}')

              cover = get('assets/images/episodes/ep46-nautilus-cover.png')
              sha = hashlib.sha256(cover).hexdigest()
              assert sha == EXPECTED, (sha, EXPECTED)
              with Image.open(io.BytesIO(cover)) as im:
                  dims = im.size
              assert dims == (1003, 1568), dims

              try:
                  get('assets/images/episodes/file_0000000059bc820a80abb596d84d5a18.png')
              except urllib.error.HTTPError as exc:
                  assert exc.code == 404, exc.code
              else:
                  raise AssertionError('Temporary uploaded cover filename is still public')

              html = get('episodes/nautilus.html').decode('utf-8')
              for needle in [
                  'data-episode="46"','4.69 kt CO₂e','55.5%','91.5%',
                  '4.04 kt CO₂e','5.54 kt CO₂e','2.63 kt CO₂e','5.76 kt CO₂e',
                  '../assets/site.js','../assets/phase6.js','../assets/passport-cleanup.js','../assets/engagement.js'
              ]:
                  assert needle in html, needle
              assert 'Raw text' not in html
              assert '/assets/pdf/' not in html.lower()
              assert 'download episode pdf' not in html.lower()
              assert 'rel="canonical" href="https://lcaofimpossible.github.io/LCA-of-the-Impossible/episodes/nautilus.html"' in html
              assert 'og:image' in html and 'twitter:image' in html and 'application/ld+json' in html

              reg = json.loads(get('episodes.json').decode('utf-8'))
              matches = [e for e in reg['episodes'] if e.get('number') == 46]
              assert len(matches) == 1
              ep = matches[0]
              assert ep['slug'] == 'nautilus'
              assert ep['cover'] == 'assets/images/episodes/ep46-nautilus-cover.png'
              assert ep.get('coverAspectPolicy') == 'approved-native'
              assert ep['result'] == '4.69 kt CO₂e'
              assert ep['functionalUnit'] == 'One launch-ready Nautilus, 70 m long and 8 m wide, at the first ocean-trial condition; cradle-to-launch construction only.'
              assert ep['categoryLabel'] == 'Science Fiction'
              assert ep['lcaLabel'] == 'Materials-driven'
              assert ep['related'] == [49,42,35]
              assert ep['evidence']['confidence'] == 'Medium'
              assert ep['evidence']['proxyDependence'] == 'High'
              assert ep['evidence']['assumptionSensitivity'] == 'High'
              assert 'pdf' not in ep
              assert not any('pdf' in e for e in reg['episodes'])

              sitemap = get('sitemap.xml').decode('utf-8')
              assert sitemap.count('/episodes/nautilus.html') == 1
              cols = json.loads(get('collections.json').decode('utf-8'))
              legendary = next(c for c in cols['collections'] if c['slug'] == 'legendary-engineering')
              assert 46 in legendary['episodes']

              endpoints = [
                  'index.html','archive.html','collections.html','compare.html','explore.html',
                  'assets/site.js','assets/phase6.js','assets/passport-cleanup.js','assets/engagement.js',
                  'assets/style.css','assets/editorial.css','assets/phase6.css',
                  'assets/images/episode-graphics/ep46-inventory-map.svg',
                  'assets/images/episode-graphics/ep46-technical-plate.svg',
                  'assets/images/episode-graphics/ep46-hotspot-breakdown.svg'
              ]
              deployed = {path: get(path) for path in endpoints}

              phase6 = deployed['assets/phase6.js'].decode('utf-8')
              cleanup = deployed['assets/passport-cleanup.js'].decode('utf-8')
              assert 'View epic passport →' in phase6
              assert 'Print / Save as PDF' in phase6
              assert 'allowedPassportActions' in cleanup
              assert "'view epic passport →'" in cleanup.lower()
              assert "'print / save as pdf'" in cleanup.lower()
              assert 'passport-raw' in cleanup and 'raw text' in cleanup.lower()

              css = deployed['assets/style.css'].decode('utf-8') + deployed['assets/phase6.css'].decode('utf-8')
              compact_css = css.replace(' ', '')
              assert '@media' in css and 'overflow-x' in css
              assert 'object-fit:contain' in compact_css

              lines = [
                  'Episode #46 live verification: PASS',
                  f'UTC: {datetime.now(timezone.utc).isoformat()}',
                  f'Cover SHA-256: {sha}',
                  f'Cover dimensions: {dims[0]}x{dims[1]}',
                  'Exact approved cover live at canonical path: PASS',
                  'Temporary upload filename removed: PASS',
                  'Live episode HTML: PASS',
                  'Numerical/source reconciliation: PASS',
                  'Live registry: PASS',
                  'Live sitemap: PASS',
                  'Live collections registry: PASS',
                  'Homepage/archive/collections/compare/explore endpoints: HTTP 200',
                  'Analytical graphics and shared assets: HTTP 200',
                  'Epic Passport labels and Passport-only cleanup deployed: PASS',
                  'Raw text in episode HTML: NO',
                  'Source PDF link in episode HTML/registry: NO',
                  'Responsive/mobile CSS invariants deployed: PASS',
              ]
          except Exception:
              failed = True
              lines = [
                  'Episode #46 live verification: FAIL',
                  f'UTC: {datetime.now(timezone.utc).isoformat()}',
                  traceback.format_exc(),
              ]

          open('ep46-live-verification.txt','w',encoding='utf-8').write('\n'.join(lines) + '\n')
          if failed:
              raise SystemExit(1)
          PY

      - name: Record final verification and remove one-time workflow
        if: always()
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/ep46-final-verify.yml
          git add ep46-qa-verification.txt ep46-live-verification.txt .github/workflows/ep46-final-verify.yml
          git commit -m 'Record Episode 46 final verification'
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Enforce verification result
        if: always()
        shell: bash
        run: |
          grep -q '^Episode #46 repository QA: PASS$' ep46-qa-verification.txt
          grep -q '^Episode #46 live verification: PASS$' ep46-live-verification.txt
