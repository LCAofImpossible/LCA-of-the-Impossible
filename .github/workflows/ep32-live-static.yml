name: Episode 32 Live Static Verify

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ep32-live-static.yml'

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify live GitHub Pages publication
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://lcaofimpossible.github.io/LCA-of-the-Impossible'
          EXPECTED='48ca70217d868843ddf8386155fb59fa4a137c5a603564325085a20548ec92aa'
          ok=0
          for i in $(seq 1 60); do
            if curl -fsSL --connect-timeout 10 "$BASE/episodes.json?live=$GITHUB_SHA" -o /tmp/episodes.json \
              && grep -q '"number": 32' /tmp/episodes.json \
              && curl -fsSL --connect-timeout 10 "$BASE/assets/images/episodes/ep32-pegasus-cover.png?live=$GITHUB_SHA" -o /tmp/cover.png; then
              got=$(sha256sum /tmp/cover.png | awk '{print $1}')
              if [ "$got" = "$EXPECTED" ]; then ok=1; break; fi
            fi
            echo "Waiting for live Pages state ($i/60)"
            sleep 10
          done
          [ "$ok" = 1 ] || { echo 'Live Pages state did not converge' >&2; exit 1; }

          curl -fsSL "$BASE/episodes/pegasus.html?live=$GITHUB_SHA" -o /tmp/pegasus.html
          curl -fsSL "$BASE/collections.json?live=$GITHUB_SHA" -o /tmp/collections.json
          curl -fsSL "$BASE/sitemap.xml?live=$GITHUB_SHA" -o /tmp/sitemap.xml
          curl -fsSL "$BASE/assets/phase6.js?v=20260819-epic-passport3&live=$GITHUB_SHA" -o /tmp/phase6.js
          curl -fsSL "$BASE/assets/passport-cleanup.js?v=20260819-passport-cleanup2&live=$GITHUB_SHA" -o /tmp/cleanup.js

          python - <<'PY'
          import json, re
          from pathlib import Path
          eps=json.loads(Path('/tmp/episodes.json').read_text())
          cs=json.loads(Path('/tmp/collections.json').read_text())
          html=Path('/tmp/pegasus.html').read_text()
          sitemap=Path('/tmp/sitemap.xml').read_text()
          phase6=Path('/tmp/phase6.js').read_text()
          cleanup=Path('/tmp/cleanup.js').read_text()
          m=[e for e in eps['episodes'] if e.get('number')==32]
          assert len(m)==1
          e=m[0]
          assert e['slug']=='pegasus'
          assert e['cover']=='assets/images/episodes/ep32-pegasus-cover.png'
          assert e['result']=='5.51 kg CO₂e'
          assert e['functionalUnit']=='One 300 km courier flight carrying one rider and one sealed message.'
          assert e['hotspot']=='Feed contributes 2.68 kg CO₂e, or 48.6% of the baseline footprint.'
          assert 'pdf' not in e
          assert not any('pdf' in x for x in eps['episodes'])
          assert any(c.get('slug')=='impossible-flight' and 32 in c.get('episodes',[]) for c in cs['collections'])
          for token in ['Pegasus — Episode #32 | LCA of the Impossible','5.51 kg CO₂e','ep32-pegasus-cover.png','og:image','twitter:card','application/ld+json','../assets/site.js','../assets/phase6.js?v=20260819-epic-passport3','../assets/passport-cleanup.js?v=20260819-passport-cleanup2']:
              assert token in html, token
          assert 'assets/pdf/episodes/' not in html
          assert re.search(r'<meta name="robots" content="index,follow,max-image-preview:large">',html)
          assert 'episodes/pegasus.html' in sitemap
          assert 'View epic passport' in phase6
          assert 'Print / Save as PDF' in phase6
          assert 'Raw text' not in phase6
          assert 'raw' in cleanup.lower()
          print('Live static contract PASS')
          PY

          if command -v google-chrome >/dev/null 2>&1; then
            google-chrome --headless=new --no-sandbox --disable-gpu --virtual-time-budget=8000 --dump-dom "$BASE/episodes/pegasus.html?render=$GITHUB_SHA" > /tmp/rendered.html 2>/tmp/chrome.log || { cat /tmp/chrome.log; exit 1; }
            python - <<'PY'
          from pathlib import Path
          dom=Path('/tmp/rendered.html').read_text(encoding='utf-8',errors='ignore')
          for token in ['View epic passport','Print / Save as PDF','Evidence Profile','Related Cases']:
              assert token.lower() in dom.lower(), token
          assert 'Raw text' not in dom
          assert 'assets/pdf/episodes/' not in dom
          print('Rendered live episode DOM PASS')
          PY
          else
            echo 'google-chrome not present; rendered DOM check skipped (static live checks remain mandatory and passed).'
          fi

      - name: Record verification and clean temporary workflows
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p verification
          cat > verification/ep32-live-verification.txt <<'EOF'
          Episode #32 — Pegasus · final live verification
          Date: 2026-08-21
          Approved cover SHA-256: 48ca70217d868843ddf8386155fb59fa4a137c5a603564325085a20548ec92aa
          Verified live: exact cover bytes; Episode #32 registry entry; no public pdf fields; Impossible Flight collection; episode SEO/Open Graph/Twitter/JSON-LD; sitemap; live Phase 6 Passport action contract; no Raw text; no source-PDF link. Rendered DOM check is executed when Chrome is available on the GitHub runner.
          Status: PASS
          EOF
          rm -f .github/workflows/ep32-live-static.yml .github/workflows/ep32-live-verify.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Record Episode 32 final live verification"
          git pull --rebase origin main
          git push origin HEAD:main
