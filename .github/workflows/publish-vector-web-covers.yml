name: Publish redesigned web catalogue covers

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-vector-web-covers.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and publish vector catalogue covers
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json, re, html

          OUT = Path('assets/images/episodes')
          OUT.mkdir(parents=True, exist_ok=True)

          def txt(s):
              return html.escape(s)

          def cover_svg(ep, title_lines, lens, accent, module_lines, subject):
              title_y = 180 if len(title_lines) == 1 else 155
              title_markup = []
              for i, line in enumerate(title_lines):
                  size = 68 if len(line) <= 15 else 54
                  title_markup.append(
                      f'<text x="400" y="{title_y + i*66}" text-anchor="middle" class="title" font-size="{size}">{txt(line)}</text>'
                  )
              modules = ''.join(
                  f'<text x="634" y="{690 + i*28}" class="micro" fill="#c7ad83">{txt(line)}</text>'
                  for i, line in enumerate(module_lines)
              )
              return f'''<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1000" viewBox="0 0 800 1000" role="img" aria-label="LCA of the Impossible Episode {ep} catalogue cover">
          <defs>
            <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
              <path d="M40 0H0V40" fill="none" stroke="#b78b55" stroke-width="0.7" opacity="0.10"/>
            </pattern>
            <filter id="paper" x="-20%" y="-20%" width="140%" height="140%">
              <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" seed="{ep}" result="noise"/>
              <feColorMatrix in="noise" type="saturate" values="0" result="mono"/>
              <feComponentTransfer in="mono"><feFuncA type="table" tableValues="0 0.06"/></feComponentTransfer>
            </filter>
            <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
              <feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
            </filter>
            <style>
              .series{{font-family:Georgia,'Times New Roman',serif;font-size:20px;letter-spacing:5px;fill:#c7ad83}}
              .episode{{font-family:Arial,sans-serif;font-size:15px;font-weight:600;letter-spacing:5px;fill:{accent}}}
              .title{{font-family:Georgia,'Times New Roman',serif;font-weight:400;letter-spacing:5px;fill:#ddd2bf}}
              .micro{{font-family:Arial,sans-serif;font-size:12px;letter-spacing:2px;fill:#9e8665}}
              .lens{{font-family:Georgia,'Times New Roman',serif;font-size:17px;font-style:italic;letter-spacing:4px;fill:#c7ad83}}
              .tech{{fill:none;stroke:#a77c45;stroke-width:1.2;opacity:.62}}
              .tech2{{fill:none;stroke:#c7ad83;stroke-width:1;opacity:.28}}
              .accent{{fill:none;stroke:{accent};stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}}
              .subject{{fill:none;stroke:#d0c1a9;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}}
              .subject2{{fill:none;stroke:#9c8666;stroke-width:1.2;stroke-linecap:round;stroke-linejoin:round}}
            </style>
          </defs>
          <rect width="800" height="1000" fill="#071015"/>
          <rect width="800" height="1000" fill="url(#grid)"/>
          <rect width="800" height="1000" fill="#fff" opacity="0.15" filter="url(#paper)"/>

          <rect x="18" y="18" width="764" height="964" rx="2" fill="none" stroke="#9c7343" stroke-width="1.4"/>
          <path d="M42 42h70M688 42h70M42 958h70M688 958h70" class="tech"/>
          <circle cx="28" cy="28" r="8" class="tech"/><circle cx="772" cy="28" r="8" class="tech"/>
          <circle cx="28" cy="972" r="8" class="tech"/><circle cx="772" cy="972" r="8" class="tech"/>
          <path d="M400 18v24M388 30h24" class="tech"/>

          <text x="400" y="72" text-anchor="middle" class="series">LCA OF THE IMPOSSIBLE</text>
          <line x1="92" y1="66" x2="250" y2="66" class="tech"/><line x1="550" y1="66" x2="708" y2="66" class="tech"/>
          <circle cx="260" cy="66" r="3" class="tech"/><circle cx="540" cy="66" r="3" class="tech"/>
          <text x="400" y="116" text-anchor="middle" class="episode">EPISODE #{ep}</text>
          <line x1="340" y1="132" x2="386" y2="132" stroke="{accent}" opacity=".9"/><line x1="414" y1="132" x2="460" y2="132" stroke="{accent}" opacity=".9"/>
          <rect x="396" y="128" width="8" height="8" transform="rotate(45 400 132)" fill="none" stroke="{accent}"/>
          {''.join(title_markup)}

          <circle cx="390" cy="520" r="235" class="tech2"/><circle cx="390" cy="520" r="180" class="tech2"/>
          <circle cx="390" cy="520" r="125" class="tech2"/>
          <path d="M155 520h470M390 285v470" class="tech2"/>
          <path d="M170 352A235 235 0 0 1 601 420" class="tech" stroke-dasharray="3 9"/>
          <path d="M190 690A235 235 0 0 0 590 670" class="tech" stroke-dasharray="2 7"/>

          {subject}

          <g transform="translate(58 690)">
            <text x="0" y="0" class="micro">CYCLE</text>
            <rect x="0" y="14" width="54" height="46" class="tech"/>
            <text x="27" y="48" text-anchor="middle" font-family="Georgia,serif" font-size="30" fill="{accent}">∞</text>
            <rect x="0" y="74" width="54" height="44" class="tech2"/>
            <path d="M0 74l54 44M54 74L0 118" class="tech2"/>
          </g>

          <g transform="translate(610 650)">
            <rect x="0" y="0" width="142" height="186" fill="#071015" opacity=".78" stroke="#9c7343"/>
            <text x="24" y="28" class="micro" fill="#c7ad83">SYSTEM LENS</text>
            <circle cx="72" cy="72" r="34" class="tech"/><circle cx="72" cy="72" r="20" class="tech2"/>
            <path d="M38 72h68M72 38v68" class="tech2"/>
            <path d="M72 72l25 -22" class="accent"/>
            {modules}
            <text x="24" y="166" class="micro">Σ FLOW × FACTOR</text>
          </g>

          <g transform="translate(400 895)">
            <circle cx="0" cy="0" r="20" fill="none" stroke="#a77c45"/>
            <path d="M0 -13L13 11H-13Z" fill="none" stroke="#c7ad83"/>
          </g>
          <line x1="250" y1="895" x2="365" y2="895" class="tech"/><line x1="435" y1="895" x2="550" y2="895" class="tech"/>
          <text x="400" y="938" text-anchor="middle" class="lens">{txt(lens)}</text>
          </svg>'''

          subjects = {}

          subjects[35] = '''
          <g transform="translate(0 15)">
            <path d="M215 665C275 705 470 720 585 646L555 720C470 773 300 770 232 725Z" class="subject"/>
            <path d="M250 650h290M284 650V395M386 650V330M485 650V390" class="subject2"/>
            <path d="M284 414Q230 470 278 514Q335 480 340 419Z" class="subject"/>
            <path d="M386 354Q315 420 380 487Q452 438 454 359Z" class="subject"/>
            <path d="M486 410Q438 458 480 510Q530 470 542 418Z" class="subject"/>
            <path d="M284 505Q238 552 280 598Q325 568 337 511Z" class="subject2"/>
            <path d="M386 500Q330 555 380 614Q438 575 454 507Z" class="subject2"/>
            <path d="M486 520Q447 558 481 602Q520 575 539 527Z" class="subject2"/>
            <path d="M198 757Q268 721 330 752T463 752T604 748" class="accent" opacity=".85"/>
            <path d="M190 779Q265 748 338 777T470 775T615 773" class="subject2"/>
            <path d="M231 706l325 -36M256 680l295 17" class="subject2" opacity=".5"/>
            <circle cx="500" cy="698" r="4" fill="#67a79c" filter="url(#glow)"/>
            <circle cx="520" cy="690" r="3" fill="#67a79c" filter="url(#glow)"/>
          </g>'''

          subjects[36] = '''
          <g transform="translate(0 18)">
            <path d="M205 735H578L548 665H235Z" class="subject"/>
            <path d="M245 665H540L514 596H270Z" class="subject"/>
            <path d="M280 596H510L488 528H302Z" class="subject"/>
            <path d="M315 528H487L468 464H336Z" class="subject"/>
            <path d="M346 464H466L450 406H362Z" class="subject"/>
            <path d="M371 406H448L435 355H384Z" class="subject"/>
            <path d="M394 355H432L425 320H401Z" class="subject"/>
            <path d="M235 700h314M270 631h244M302 562h186M336 498h132M362 438h88M384 382h51" class="subject2"/>
            <g class="subject2" opacity=".75">
              <path d="M264 735v-40M318 735v-40M372 735v-40M426 735v-40M480 735v-40M534 735v-40"/>
              <path d="M298 665v-34M350 665v-34M402 665v-34M454 665v-34M506 665v-34"/>
              <path d="M330 596v-34M378 596v-34M426 596v-34M474 596v-34"/>
            </g>
            <path d="M175 742L600 742" stroke="#c77a37" stroke-width="2" opacity=".75"/>
            <path d="M612 345v360M625 390h95M625 455h95M625 520h95M625 585h95M625 650h95" class="tech2"/>
          </g>'''

          subjects[40] = '''
          <g>
            <circle cx="390" cy="530" r="210" stroke="#d0c1a9" stroke-width="18" fill="none"/>
            <circle cx="390" cy="530" r="174" stroke="#a9987c" stroke-width="16" fill="none"/>
            <circle cx="390" cy="530" r="140" stroke="#d0c1a9" stroke-width="15" fill="none"/>
            <circle cx="390" cy="530" r="108" stroke="#a9987c" stroke-width="14" fill="none"/>
            <circle cx="390" cy="530" r="76" stroke="#d0c1a9" stroke-width="13" fill="none"/>
            <rect x="382" y="312" width="18" height="60" fill="#071015"/>
            <rect x="478" y="350" width="70" height="20" transform="rotate(32 513 360)" fill="#071015"/>
            <rect x="533" y="462" width="70" height="20" transform="rotate(78 568 472)" fill="#071015"/>
            <rect x="492" y="621" width="72" height="20" transform="rotate(140 528 631)" fill="#071015"/>
            <rect x="338" y="662" width="20" height="70" transform="rotate(10 348 697)" fill="#071015"/>
            <rect x="232" y="565" width="72" height="20" transform="rotate(175 268 575)" fill="#071015"/>
            <rect x="252" y="395" width="72" height="20" transform="rotate(220 288 405)" fill="#071015"/>
            <path d="M390 760C385 714 363 681 390 646C420 607 425 590 398 560C371 529 377 502 410 478C443 454 442 424 405 398C386 385 390 363 390 340" class="accent"/>
            <circle cx="390" cy="530" r="32" fill="#071015" stroke="#c7ad83" stroke-width="1.5"/>
            <path d="M371 535q19-24 38 0M375 523l-13-14M405 523l13-14M378 543q12 10 24 0" class="subject"/>
            <circle cx="381" cy="531" r="2.5" fill="#d0c1a9"/><circle cx="399" cy="531" r="2.5" fill="#d0c1a9"/>
          </g>'''

          subjects[41] = '''
          <g>
            <rect x="300" y="555" width="210" height="122" rx="12" fill="#10191d" stroke="#d0c1a9" stroke-width="3"/>
            <path d="M315 570h180v92H315Z" class="subject2"/>
            <circle cx="405" cy="616" r="38" class="subject"/><path d="M382 628l23-40 23 40-23-14Z" class="subject"/>
            <path d="M385 555V348h42v207" class="subject"/>
            <path d="M383 365l44 34M383 403l44 34M383 441l44 34M383 479l44 34" class="subject2"/>
            <path d="M427 360q42 20 28 62q-8 26-36 34" class="subject2"/>
            <path d="M268 405l46 38-31 34 54 38-37 44" class="accent" filter="url(#glow)"/>
            <path d="M535 390l-38 48 32 27-49 48 41 37" class="accent" filter="url(#glow)"/>
            <path d="M340 690q65 24 130 0" class="tech"/>
          </g>'''

          subjects[42] = '''
          <g transform="translate(0 8)">
            <circle cx="400" cy="365" r="40" fill="#151b1c" stroke="#bc8a55" stroke-width="3"/>
            <path d="M368 355q32-42 64 0M379 372h42M386 386h28" class="subject"/>
            <path d="M350 410Q400 385 450 410L478 555Q400 595 322 555Z" fill="#151b1c" stroke="#bc8a55" stroke-width="3"/>
            <path d="M350 425l50 60 50-60M342 510h116M365 545h70" class="subject2"/>
            <path d="M325 430L275 575L306 590L365 465M475 430L528 575L498 590L438 465" class="subject"/>
            <circle cx="290" cy="590" r="18" class="subject"/><circle cx="513" cy="590" r="18" class="subject"/>
            <path d="M350 563L320 735H365L400 600L435 735H480L450 563" class="subject"/>
            <path d="M318 735h50M432 735h52" class="subject"/>
            <circle cx="400" cy="498" r="28" class="tech"/><circle cx="400" cy="498" r="14" class="tech2"/>
            <path d="M250 753Q400 725 552 753" stroke="#a56b43" stroke-width="2" fill="none"/>
            <path d="M155 765Q240 744 320 765T500 765T650 760" class="tech2"/>
          </g>'''

          subjects[43] = '''
          <g>
            <path d="M175 770L600 370" stroke="#9b8d79" stroke-width="14" opacity=".85"/>
            <path d="M190 758L590 382" class="accent" opacity=".85"/>
            <circle cx="470" cy="505" r="93" fill="#11191b" stroke="#d0c1a9" stroke-width="3"/>
            <path d="M410 610l-48 42-35 70M360 650l42 54M359 655l-45-4" class="subject"/>
            <circle cx="384" cy="592" r="16" class="subject"/>
            <path d="M375 610l28 60 41-78M398 626l55-38M404 670l-8 68M402 702l-35 48" class="subject"/>
            <path d="M408 610l47-42" class="subject"/>
            <path d="M205 743l22-22M265 686l22-22M325 630l22-22M535 432l22-22" class="tech2"/>
            <circle cx="230" cy="720" r="4" fill="#c7463c"/><circle cx="335" cy="622" r="4" fill="#c7463c"/><circle cx="560" cy="405" r="4" fill="#c7463c"/>
          </g>'''

          specs = {
              35: (['THE FLYING','DUTCHMAN'], 'Materials-driven', '#66a99b', ['HULL + RIG', 'ARMAMENT', '1 YEAR'], subjects[35]),
              36: (['THE TOWER','OF BABEL'], 'Materials-driven', '#c77a37', ['MASS', 'BRICK FIRING', 'CONSTRUCTION'], subjects[36]),
              40: (["THE MINOTAUR'S",'LABYRINTH'], 'Materials-driven', '#c7463c', ['STONE', 'NETWORK', 'THREAD'], subjects[40]),
              41: (['MJÖLNIR'], 'Energy-driven', '#53b9cf', ['MASS', 'RETURN', 'DISCHARGE'], subjects[41]),
              42: (['TALOS'], 'Operation-driven', '#b76843', ['BRONZE', 'PATROL', 'SERVICE'], subjects[42]),
              43: (['SISYPHUS'], 'Operation-driven', '#c7463c', ['BOULDER', 'SLOPE', 'CYCLES'], subjects[43]),
          }

          cover_paths = {}
          for ep, (title, lens, accent, modules, subject) in specs.items():
              path = OUT / f'ep{ep}-web-cover.svg'
              path.write_text(cover_svg(ep, title, lens, accent, modules, subject), encoding='utf-8')
              cover_paths[ep] = f'assets/images/episodes/ep{ep}-web-cover.svg'

          # Canonical registry paths
          registry_path = Path('episodes.json')
          registry = json.loads(registry_path.read_text(encoding='utf-8'))
          for episode in registry['episodes']:
              if episode['number'] in cover_paths:
                  episode['cover'] = cover_paths[episode['number']]
          registry_path.write_text(json.dumps(registry, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          # Do not allow a stale registry on homepage/archive.
          site_path = Path('assets/site.js')
          site = site_path.read_text(encoding='utf-8')
          site = site.replace('fetch(registryPath)', "fetch(registryPath, { cache: 'no-store' })")
          site_path.write_text(site, encoding='utf-8')

          # Force catalogue pages to request this JS revision.
          for page_name in ['index.html', 'archive.html']:
              p = Path(page_name)
              text = p.read_text(encoding='utf-8')
              text = re.sub(r'assets/site\\.js(?:\\?v=[^"\\\']+)?', 'assets/site.js?v=20260816-vectorcovers', text)
              p.write_text(text, encoding='utf-8')

          # Editorial Bible: website cover is independent from the approved PDF cover.
          readme_path = Path('README.md')
          readme = readme_path.read_text(encoding='utf-8')
          readme = readme.replace(
              '- `cover` — relative canonical catalogue-cover path from repository root;',
              '- `cover` — relative path to the approved purpose-built website catalogue cover from repository root; this asset is independent from the PDF/carousel cover.'
          )
          readme = readme.replace(
              '- `epNN-short-slug.ext` — canonical catalogue cover, homepage/Archive only;',
              '- `epNN-web-cover.svg` — canonical purpose-built vector website catalogue cover, homepage/Archive only;'
          )

          block = re.compile(r'### 4\\.1 Canonical-cover lock\\n.*?(?=### 4\\.2 Where covers are allowed)', re.S)
          new_block = '''### 4.1 Website catalogue-cover system\n\nThe website catalogue cover is a **purpose-built web asset** and is independent from page 1 of the approved PDF/carousel. The approved carousel remains unchanged; the website cover exists only to make Homepage and Archive visually coherent, sharp and readable at card scale.\n\nCanonical naming:\n\n`assets/images/episodes/epNN-web-cover.svg`\n\nRequired visual system:\n\n- portrait **4:5** composition;\n- vector-first SVG output for maximum sharpness and reliable browser rendering;\n- dark charcoal / deep navy foundation consistent with the website;\n- restrained technical/blueprint linework, thin geometric framing and analytical annotations;\n- one clearly readable central subject rather than a busy collage;\n- off-white and muted gold/bronze core palette with one restrained episode-specific accent;\n- consistent hierarchy for `LCA OF THE IMPOSSIBLE`, episode number, title and principal LCA lens;\n- typography and subject must remain clear at mobile card size;\n- no intentional blur, soft focus or low-resolution rasterization.\n\nWhen the user explicitly approves a redesigned website cover, that design becomes the canonical catalogue asset even if it differs from the PDF cover. Do **not** replace or redesign the cover inside the approved PDF unless separately requested.\n\nWhen replacing a published catalogue cover, use a cache-safe new filename or revision, update `episodes.json`, and verify the rendered Homepage and Archive after deployment.\n\n'''
          if block.search(readme):
              readme = block.sub(new_block, readme)
          elif '### 4.2 Where covers are allowed' in readme and '### 4.1 Website catalogue-cover system' not in readme:
              readme = readme.replace('### 4.2 Where covers are allowed', new_block + '### 4.2 Where covers are allowed', 1)

          old_policy = re.compile(
              r'1\\. If page 1 of the approved PDF contains the final cover, use that exact cover for homepage/archive\\.\\n'
              r'2\\. If the user explicitly approves a replacement, use that exact replacement\\.\\n'
              r'3\\. Only when no approved cover exists may a new cover be created\\.\\n\\n'
              r'Before publication, visually compare the catalogue cover with the approved source\\. Any mismatch is a homepage/archive publication blocker\\.',
              re.S
          )
          readme = old_policy.sub(
              'For Homepage/Archive publication, use the purpose-built web-cover asset declared by the episode `cover` field. The web cover does not need to reproduce page 1 of the PDF; it must comply with §4.1 and with any explicitly approved website-cover design.\n\nBefore publication, inspect every catalogue cover at desktop and mobile card size. Blur, unreadable typography, broken images, inconsistent crops or a stale cached cover are publication blockers.',
              readme
          )

          # Ensure the QA rule exists even if legacy wording had already changed.
          if 'stale cached cover are publication blockers' not in readme:
              readme += '''\n\n### Catalogue-cover QA\n\n- Verify the `cover` path in `episodes.json`.\n- Verify the SVG exists and renders without external dependencies.\n- Inspect Latest Case, Recent Cases and Archive on desktop and mobile.\n- Reject blurred, soft, broken or visibly inconsistent cover assets.\n- When replacing a live cover, use a cache-safe publication path and confirm the new asset is what GitHub Pages serves.\n'''

          readme_path.write_text(readme, encoding='utf-8')
          PY

          rm -f .github/workflows/publish-vector-web-covers.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish redesigned vector catalogue covers"
          git push
