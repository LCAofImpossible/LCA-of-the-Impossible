name: Episode 63 Live Verification

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: ep63-live-verification
  cancel-in-progress: true

jobs:
  verify-live:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Wait for GitHub Pages to serve Episode 63
        shell: bash
        env:
          BASE: https://lcaofimpossible.github.io/LCA-of-the-Impossible
        run: |
          set -euo pipefail
          ready=0
          for attempt in $(seq 1 36); do
            echo "Live probe $attempt/36"
            if curl -fLsS -H 'Cache-Control: no-cache' "$BASE/episodes/gungnir.html?verify=${GITHUB_SHA}-${attempt}" -o /tmp/gungnir.html \
              && curl -fLsS -H 'Cache-Control: no-cache' "$BASE/episodes.json?verify=${GITHUB_SHA}-${attempt}" -o /tmp/episodes.json; then
              if python - <<'PY'
          import json
          from pathlib import Path
          html = Path('/tmp/gungnir.html').read_text(encoding='utf-8')
          data = json.loads(Path('/tmp/episodes.json').read_text(encoding='utf-8'))
          ep = next((e for e in data.get('episodes', []) if e.get('number') == 63), None)
          assert ep is not None
          assert ep.get('slug') == 'gungnir'
          assert ep.get('result') == '3.01 kg CO₂e'
          assert ep.get('cover') == 'assets/images/episodes/ep63-gungnir-cover.png'
          assert 'pdf' not in ep
          assert 'data-episode="63"' in html
          assert '3.01 kg CO₂e' in html
          assert 'noindex,nofollow' not in html
          PY
              then
                ready=1
                break
              fi
            fi
            sleep 10
          done
          if [ "$ready" -ne 1 ]; then
            echo 'GitHub Pages did not expose the synchronized Episode #63 within the verification window.' >&2
            exit 1
          fi

      - name: Verify exact live cover identity
        shell: bash
        env:
          BASE: https://lcaofimpossible.github.io/LCA-of-the-Impossible
          EXPECTED: 6c0b37dfb93204ab4cbc37971207d89b15e67b67bca824bf55b4beef9c74b648
        run: |
          set -euo pipefail
          curl -fLsS -H 'Cache-Control: no-cache' "$BASE/assets/images/episodes/ep63-gungnir-cover.png?verify=${GITHUB_SHA}" -o /tmp/ep63-cover.png
          ACTUAL="$(sha256sum /tmp/ep63-cover.png | awk '{print $1}')"
          echo "Expected SHA-256: $EXPECTED"
          echo "Live SHA-256:     $ACTUAL"
          test "$ACTUAL" = "$EXPECTED"

      - name: Verify live metadata, sitemap and Passport-only contract
        shell: bash
        env:
          BASE: https://lcaofimpossible.github.io/LCA-of-the-Impossible
        run: |
          set -euo pipefail
          curl -fLsS -H 'Cache-Control: no-cache' "$BASE/episodes/gungnir.html?verify=${GITHUB_SHA}" -o /tmp/gungnir.html
          curl -fLsS -H 'Cache-Control: no-cache' "$BASE/sitemap.xml?verify=${GITHUB_SHA}" -o /tmp/sitemap.xml
          curl -fLsS -H 'Cache-Control: no-cache' "$BASE/assets/phase6.js?verify=${GITHUB_SHA}" -o /tmp/phase6.js
          curl -fLsS -H 'Cache-Control: no-cache' "$BASE/assets/passport-cleanup.js?verify=${GITHUB_SHA}" -o /tmp/passport-cleanup.js
          python - <<'PY'
          from pathlib import Path
          html = Path('/tmp/gungnir.html').read_text(encoding='utf-8')
          sitemap = Path('/tmp/sitemap.xml').read_text(encoding='utf-8')
          phase6 = Path('/tmp/phase6.js').read_text(encoding='utf-8')
          cleanup = Path('/tmp/passport-cleanup.js').read_text(encoding='utf-8')
          assert '<link rel="canonical" href="https://lcaofimpossible.github.io/LCA-of-the-Impossible/episodes/gungnir.html">' in html
          assert 'og:title" content="Gungnir — Episode #63 | LCA of the Impossible"' in html
          assert 'og:image" content="https://lcaofimpossible.github.io/LCA-of-the-Impossible/assets/images/episodes/ep63-gungnir-cover.png"' in html
          assert 'twitter:image" content="https://lcaofimpossible.github.io/LCA-of-the-Impossible/assets/images/episodes/ep63-gungnir-cover.png"' in html
          assert '"identifier": "Episode #63"' in html
          assert 'episodes/gungnir.html' in sitemap
          assert 'View epic passport →' in phase6
          assert 'Print / Save as PDF' in phase6
          assert 'Raw text' not in phase6
          assert 'download episode pdf' in cleanup.lower()
          assert 'raw text' in cleanup.lower()
          assert 'assets/pdf/episodes/' not in html
          assert 'Raw text' not in html
          assert 'Download episode PDF' not in html
          PY

      - name: Verify rendered live site with headless browser
        shell: bash
        env:
          BASE: https://lcaofimpossible.github.io/LCA-of-the-Impossible
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME" ]; then
            echo 'No headless Chromium/Chrome available on runner.' >&2
            exit 1
          fi
          echo "Using browser: $CHROME"
          dump() {
            local url="$1" out="$2"
            "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=6000 --dump-dom "$url?verify=${GITHUB_SHA}" > "$out"
          }
          dump "$BASE/episodes/gungnir.html" /tmp/episode-dom.html
          dump "$BASE/" /tmp/home-dom.html
          dump "$BASE/archive.html" /tmp/archive-dom.html
          dump "$BASE/collections.html" /tmp/collections-dom.html
          dump "$BASE/compare.html" /tmp/compare-dom.html
          dump "$BASE/explore.html" /tmp/explore-dom.html

          python - <<'PY'
          from pathlib import Path
          episode = Path('/tmp/episode-dom.html').read_text(encoding='utf-8')
          home = Path('/tmp/home-dom.html').read_text(encoding='utf-8')
          archive = Path('/tmp/archive-dom.html').read_text(encoding='utf-8')
          collections = Path('/tmp/collections-dom.html').read_text(encoding='utf-8')
          compare = Path('/tmp/compare-dom.html').read_text(encoding='utf-8')
          explore = Path('/tmp/explore-dom.html').read_text(encoding='utf-8')
          assert 'model-passport' in episode
          assert 'View epic passport →' in episode
          assert 'Print / Save as PDF' in episode
          assert 'Raw text' not in episode
          assert 'Download episode PDF' not in episode
          assert 'Gungnir' in home
          assert 'Gungnir' in archive
          assert 'Gungnir' in collections
          assert 'Gungnir' in compare
          assert 'Gungnir' in explore
          assert 'ep63-gungnir-cover.png' in home
          assert 'ep63-gungnir-cover.png' in archive
          PY

      - name: Record successful live verification and remove one-time workflow
        shell: bash
        env:
          EXPECTED: 6c0b37dfb93204ab4cbc37971207d89b15e67b67bca824bf55b4beef9c74b648
        run: |
          set -euo pipefail
          mkdir -p verification
          cat > verification/ep63-live-verification.txt <<EOF
          Episode #63 — Gungnir live verification
          Verified at: $(date -u +'%Y-%m-%dT%H:%M:%SZ')
          Source commit: ${GITHUB_SHA}
          Live episode: HTTP 200 and registry-backed Episode #63
          Live result: 3.01 kg CO2e
          Live cover SHA-256: ${EXPECTED}
          Cover identity: PASS — byte-identical to approved raster
          Homepage rendered integration: PASS
          Archive rendered integration: PASS
          Collections rendered integration: PASS
          Compare rendered integration: PASS
          Impact Map rendered integration: PASS
          SEO/Open Graph/Twitter/JSON-LD: PASS
          Sitemap: PASS
          Epic Model Passport rendered actions: View epic passport / Print-Save as PDF only
          Source PDF download: ABSENT
          Raw text export: ABSENT
          EOF
          rm -f .github/workflows/ep63-live-verify.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add verification/ep63-live-verification.txt .github/workflows/ep63-live-verify.yml
          git commit -m 'Record Episode 63 live verification'
          git pull --rebase origin main
          git push origin HEAD:main
