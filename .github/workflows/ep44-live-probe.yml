name: Episode 44 Live Probe

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  probe:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Probe live GitHub Pages state
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json, traceback, urllib.request
          from datetime import datetime, timezone
          BASE='https://lcaofimpossible.github.io/LCA-of-the-Impossible/'
          out=[f'UTC: {datetime.now(timezone.utc).isoformat()}']
          def get(path):
              req=urllib.request.Request(BASE+path,headers={'Cache-Control':'no-cache','User-Agent':'EP44-Probe'})
              with urllib.request.urlopen(req,timeout=30) as r:
                  return r.status,r.read()
          try:
              for path in ['episodes/wings-of-icarus.html','episodes.json','collections.json','sitemap.xml','assets/images/episodes/ep44-wings-of-icarus-cover-20260821.png','assets/phase6.js','assets/passport-cleanup.js']:
                  status,data=get(path)
                  out.append(f'{path}: HTTP {status} bytes={len(data)}')
                  if path.endswith('.png'):
                      out.append('cover_sha256='+hashlib.sha256(data).hexdigest())
              _,raw=get('episodes.json')
              reg=json.loads(raw.decode('utf-8'))
              ep=next((e for e in reg.get('episodes',[]) if e.get('number')==44),None)
              out.append('episode44='+json.dumps(ep,ensure_ascii=False,sort_keys=True))
              _,raw=get('collections.json')
              cols=json.loads(raw.decode('utf-8'))
              legendary=next((c for c in cols.get('collections',[]) if c.get('slug')=='legendary-engineering'),None)
              out.append('legendary_engineering='+json.dumps(legendary,ensure_ascii=False,sort_keys=True))
              _,raw=get('episodes/wings-of-icarus.html')
              html=raw.decode('utf-8')
              out.append('page_has_title='+str('The Wings of Icarus' in html))
              out.append('page_has_70.4='+str('70.4 kg CO₂e' in html))
              out.append('page_has_pdf_link='+str('assets/pdf/episodes/' in html or 'download episode pdf' in html.lower()))
              out.append('page_has_raw_text='+str('Raw text' in html))
          except Exception:
              out.append('ERROR')
              out.append(traceback.format_exc())
          open('ep44-live-probe.txt','w',encoding='utf-8').write('\n'.join(out)+'\n')
          PY
      - name: Commit live probe
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin main
          git add ep44-live-probe.txt
          git commit -m 'Record Episode 44 live probe'
          git push origin HEAD:main
