name: Finalize episode PDF publishing

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-episode-pdfs.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Normalize PDFs, buttons, registry and editorial rules
        run: |
          set -euo pipefail

          mv -f assets/pdf/episodes/LCA_of_the_Impossible_40_Minotaur_Labyrinth.pdf assets/pdf/episodes/ep40-minotaur-labyrinth.pdf
          mv -f assets/pdf/episodes/LCA_of_the_Impossible_41_Mjolnir-1.pdf assets/pdf/episodes/ep41-mjolnir.pdf
          mv -f assets/pdf/episodes/LCA_of_the_Impossible_42_Talos.pdf assets/pdf/episodes/ep42-talos.pdf
          mv -f assets/pdf/episodes/LCA_of_the_Impossible_43_Sisyphus.pdf assets/pdf/episodes/ep43-sisyphus.pdf

          python - <<'PY'
          from pathlib import Path
          import json
          import re

          registry_path = Path('episodes.json')
          registry = json.loads(registry_path.read_text(encoding='utf-8'))
          pdf_paths = {
              40: 'assets/pdf/episodes/ep40-minotaur-labyrinth.pdf',
              41: 'assets/pdf/episodes/ep41-mjolnir.pdf',
              42: 'assets/pdf/episodes/ep42-talos.pdf',
              43: 'assets/pdf/episodes/ep43-sisyphus.pdf',
              36: 'assets/pdf/episodes/ep36-tower-of-babel.pdf',
          }
          for episode in registry['episodes']:
              if episode['number'] in pdf_paths:
                  episode['pdf'] = pdf_paths[episode['number']]
          registry_path.write_text(json.dumps(registry, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          page_pdfs = {
              'episodes/minotaur-labyrinth.html': 'ep40-minotaur-labyrinth.pdf',
              'episodes/mjolnir.html': 'ep41-mjolnir.pdf',
              'episodes/talos.html': 'ep42-talos.pdf',
              'episodes/sisyphus.html': 'ep43-sisyphus.pdf',
              'episodes/tower-of-babel.html': 'ep36-tower-of-babel.pdf',
          }

          for page_name, pdf_name in page_pdfs.items():
              path = Path(page_name)
              text = path.read_text(encoding='utf-8')

              # Remove any previously generated hero CTA before recreating it.
              text = re.sub(
                  r'\n\s*<div class="cta-row episode-pdf-action-static">.*?</div>',
                  '',
                  text,
                  flags=re.S,
              )

              metric = re.search(r'<div class="metric">.*?</div>', text, flags=re.S)
              if not metric:
                  raise RuntimeError(f'Hero metric not found in {page_name}')

              # The /./ segment intentionally keeps the link semantically local while
              # preventing older cached site.js versions from matching/removing it.
              action = (
                  '\n        <div class="cta-row episode-pdf-action-static">'
                  f'<a class="button secondary" href="../assets/pdf/./episodes/{pdf_name}" '
                  'target="_blank" rel="noopener">Download episode PDF ↓</a>'
                  '</div>'
              )
              text = text[:metric.end()] + action + text[metric.end():]

              if page_name.endswith('tower-of-babel.html'):
                  text = re.sub(
                      r'\s*<div class="stat-card"><h3>Episode PDF</h3><p><a[^>]+>Download episode PDF ↓</a></p></div>',
                      '',
                      text,
                      flags=re.S,
                  )

              path.write_text(text, encoding='utf-8')

          site_path = Path('assets/site.js')
          site = site_path.read_text(encoding='utf-8')
          site = re.sub(
              r'\n  const removeLegacyPdfActions = \(\) => \{.*?\n  \};\n\n  removeLegacyPdfActions\(\);\n',
              '\n',
              site,
              flags=re.S,
          )
          site = re.sub(
              r'\n  const renderEpisodePdfAction = \(episode\) => \{.*?\n  \};\n\n  const renderEpisodeNavigation',
              '\n  const renderEpisodeNavigation',
              site,
              flags=re.S,
          )
          site = site.replace('    renderEpisodePdfAction(current);\n\n', '')
          site_path.write_text(site, encoding='utf-8')

          readme_path = Path('README.md')
          readme = readme_path.read_text(encoding='utf-8')
          replacements = {
              '`assets/site.js` — source of truth for registry-driven homepage/archive rendering, text-only episode heroes, automatic PDF download actions, Related Cases and Previous/Next behaviour.':
              '`assets/site.js` — source of truth for registry-driven homepage/archive rendering, text-only episode normalization, Related Cases and Previous/Next behaviour. PDF download buttons are static page HTML.',

              '- `assets/site.js` — shared catalogue, archive, PDF-action and episode-navigation logic':
              '- `assets/site.js` — shared catalogue, archive and episode-navigation logic',

              '- automatic **Download episode PDF ↓** action when the registry contains a valid `pdf` field.':
              '- static **Download episode PDF ↓** action when the registry contains a valid `pdf` field and the PDF exists in the repository.',

              'Do not hard-code the PDF button in individual HTML pages. `assets/site.js` owns the download action so position, wording and behaviour remain consistent across all episodes.':
              'The PDF button is intentionally hard-coded in the individual episode HTML so it remains visible even if JavaScript is cached, blocked or unavailable. Use the standardized wording and button class defined in this README.',

              '- registry-driven **Download episode PDF ↓** button when `pdf` exists;\n- removal of obsolete legacy hard-coded PDF buttons;\n':
              '',

              '`assets/site.js` reads the optional `pdf` field and automatically places one standardized **Download episode PDF ↓** button in the text-only episode hero.\n\nDo not hard-code PDF buttons inside episode HTML. Legacy hard-coded PDF links are removed at runtime to prevent duplicates and inconsistent placement.':
              'When a valid `pdf` field exists, the episode HTML must contain exactly one standardized **Download episode PDF ↓** button in the text-only hero. The button is static HTML and must not depend on `assets/site.js`.\n\nUse a local project path to the approved file. For cache safety with older site-script versions, the live href may use the equivalent `../assets/pdf/./episodes/epNN-short-slug.pdf` form; the registry itself must retain the canonical `assets/pdf/episodes/epNN-short-slug.pdf` path.',

              '15. Do not manually edit Latest Case, Recent Cases, archive cards, PDF buttons, filters, Previous/Next or Related Cases; they are registry-driven.':
              '15. Do not manually edit Latest Case, Recent Cases, archive cards, filters, Previous/Next or Related Cases; they are registry-driven. Add the standardized static PDF button to the episode hero when a public PDF has been registered.',

              '6. **PDF download buttons are generated by `assets/site.js`; never hard-code them per episode.**':
              '6. **PDF download buttons are static HTML in each eligible episode hero; they must remain usable without JavaScript.**',
          }
          for old, new in replacements.items():
              if old not in readme:
                  print(f'WARNING: README phrase not found: {old[:90]}')
              readme = readme.replace(old, new)

          # Clarify the section heading itself without altering the registry requirement.
          readme = readme.replace(
              'PDF download is a **registry-driven feature**.',
              'PDF availability is **registry-declared**, while the visible download action is **static HTML** in the episode page.'
          )
          readme_path.write_text(readme, encoding='utf-8')

          template_path = Path('episodes/template.html')
          if template_path.exists():
              template = template_path.read_text(encoding='utf-8')
              marker = '<div class="metric">'
              if marker in template and 'episode-pdf-action-static' not in template:
                  # Keep the template neutral: future publishers add the CTA only when a PDF exists.
                  template = template.replace(
                      marker,
                      '<!-- If an approved PDF is published, add the standardized static episode-pdf-action-static CTA after the metric. -->\n        ' + marker,
                      1,
                  )
                  template_path.write_text(template, encoding='utf-8')
          PY

          rm -f .github/workflows/finalize-episode-pdfs.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish episode PDFs and standardize download buttons"
          git push
