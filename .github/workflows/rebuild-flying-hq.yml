name: Rebuild Flying Dutchman HQ cover
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rebuild-flying-hq.yml'
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild high-resolution cover
        run: |
          set -euo pipefail
          python -m pip install --quiet pillow
          python - <<'PY'
          from PIL import Image, ImageFilter
          src = 'assets/images/episodes/ep35-flying-dutchman.webp'
          dst = 'assets/images/episodes/ep35-flying-dutchman.jpg'
          im = Image.open(src).convert('RGB')
          im = im.resize((im.width*3, im.height*3), Image.Resampling.LANCZOS)
          im = im.filter(ImageFilter.UnsharpMask(radius=1.4, percent=145, threshold=2))
          im.save(dst, 'JPEG', quality=93, subsampling=0, optimize=True)
          check = Image.open(dst)
          assert check.width >= 1000 and check.height >= 1300, check.size
          PY
          test "$(stat -c%s assets/images/episodes/ep35-flying-dutchman.jpg)" -gt 50000
          rm -f .github/workflows/rebuild-flying-hq.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Rebuild Flying Dutchman cover at high resolution"
          git push
