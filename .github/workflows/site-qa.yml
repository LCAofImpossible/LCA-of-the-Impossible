name: Site QA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Validate static site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install QA dependencies
        run: python -m pip install --disable-pip-version-check pillow

      - name: Build deterministic SEO metadata in QA workspace
        run: python scripts/apply_seo.py

      - name: Run structural site QA
        run: python scripts/site_qa.py

      - name: Run SEO and social QA
        run: python scripts/seo_qa.py
