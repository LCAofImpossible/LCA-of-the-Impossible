name: Publish Atlantis episode

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-atlantis.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install SVG rasterizer
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y librsvg2-bin

      - name: Publish episode 39
        run: |
          set -euo pipefail
          mkdir -p assets/images/episodes
          rsvg-convert -w 1024 -h 1280 .cover-staging/ep39-atlantis.svg -o assets/images/episodes/ep39-atlantis-cover-20260816.png

          python - <<'PY'
          from pathlib import Path
          import json
          import re

          # Registry: one canonical object, ordered by descending episode number.
          registry_path = Path('episodes.json')
          registry = json.loads(registry_path.read_text(encoding='utf-8'))
          registry['episodes'] = [ep for ep in registry['episodes'] if ep.get('number') != 39]
          registry['episodes'].append({
              'number': 39,
              'slug': 'atlantis',
              'title': 'Atlantis',
              'url': 'episodes/atlantis.html',
              'cover': 'assets/images/episodes/ep39-atlantis-cover-20260816.png',
              'categoryLabel': 'Mythic City',
              'categories': ['mythology', 'structures'],
              'lcaLabel': 'Materials-driven',
              'lcaCharacteristics': ['materials-driven', 'operation-driven', 'lifetime-sensitive', 'proxy-sensitive'],
              'result': '3.618 Mt CO₂e',
              'hotspot': 'Initial construction contributes 58.4% of lifecycle GWP; water supply and treatment add 27.4%.',
              'featuredDescription': "Plato's concentric royal-harbor core reconstructed as a 100-year urban system: 8.41 km² of buildable land, 7.57 Mm² GFA and 500,000 residents, with the result dominated by construction and highly sensitive to where the city boundary is drawn.",
              'keywords': ['atlantis', 'plato', 'critias', 'concentric', 'harbor', 'city', 'worked stone', 'water', 'system boundary', 'urban', 'orichalcum'],
              'related': [40, 36, 42]
          })
          registry['episodes'].sort(key=lambda ep: ep['number'], reverse=True)
          registry_path.write_text(json.dumps(registry, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          # The approved source PDF is not yet stored as a repository binary asset,
          # so README rules require no download button and no pdf registry field.
          page = Path('episodes/atlantis.html')
          html = page.read_text(encoding='utf-8')
          html = re.sub(
              r'\s*<div class="cta-row episode-pdf-action-static">\s*<a[^>]+href="\.\./assets/pdf/\./episodes/ep39-atlantis\.pdf"[^>]*>Download episode PDF ↓</a>\s*</div>',
              '',
              html,
              flags=re.S,
          )
          page.write_text(html, encoding='utf-8')

          # Remove one-shot staging artifacts after successful generation.
          Path('.cover-staging/ep39-atlantis.svg').unlink(missing_ok=True)
          try:
              Path('.cover-staging').rmdir()
          except OSError:
              pass
          Path('.github/workflows/publish-atlantis.yml').unlink(missing_ok=True)
          PY

          # Basic publication guards.
          test -s assets/images/episodes/ep39-atlantis-cover-20260816.png
          grep -q '"number": 39' episodes.json
          grep -q 'ep39-atlantis-cover-20260816.png' episodes.json
          ! grep -q 'ep39-atlantis.pdf' episodes/atlantis.html

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish Atlantis episode 39"
          git push
