name: Align README cover hierarchy

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-cover-hierarchy.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Align source hierarchy
        run: |
          python -c "from pathlib import Path; p=Path('README.md'); s=p.read_text(encoding='utf-8'); old='1. **Approved episode PDF / approved LinkedIn carousel** — source of truth for episode-specific facts, numbers, assumptions, results, sensitivities, narrative conclusions, wording and approved cover artwork.'; new='1. **Approved episode PDF / approved LinkedIn carousel** — source of truth for episode-specific facts, numbers, assumptions, results, sensitivities, narrative conclusions and wording. Website catalogue-cover style is governed separately by Section 4.'; assert old in s; p.write_text(s.replace(old,new),encoding='utf-8')"
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/fix-cover-hierarchy.yml
          git add -A
          git commit -m "Align cover hierarchy with canonical catalogue style"
          git push
