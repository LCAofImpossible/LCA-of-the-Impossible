name: Episode 34 Final Live Verification

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: ep34-final-live-verification
  cancel-in-progress: true

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install QA dependencies
        run: python -m pip install --disable-pip-version-check pillow

      - name: Confirm synchronized repository is clean
        shell: bash
        run: |
          python scripts/apply_seo.py
          python scripts/feature_sync.py
          python scripts/engagement_sync.py
          python scripts/phase5_sync.py
          python scripts/phase6_sync.py
          python scripts/epic_passport_sync.py
          python scripts/telemetry_sync.py
          git diff --exit-code

      - name: Run complete QA suite
        shell: bash
        run: |
          python scripts/site_qa.py
          python scripts/seo_qa.py
          python scripts/feature_qa.py
          python scripts/engagement_qa.py
          python scripts/phase5_qa.py
          python scripts/phase6_qa.py
          python scripts/telemetry_qa.py

      - name: Verify approved repository cover identity
        shell: bash
        run: |
          ACTUAL="$(git hash-object assets/images/episodes/ep34-solar-chariot-of-elios-cover.png)"
          EXPECTED="b60bafd6ba6494a521721158ac470a53b39b0592"
          echo "Repository cover blob: $ACTUAL"
          test "$ACTUAL" = "$EXPECTED"
          test "$(wc -c < assets/images/episodes/ep34-solar-chariot-of-elios-cover.png)" -eq 2575588

      - name: Wait for GitHub Pages and verify live publication
        shell: bash
        run: |
          BASE="https://lcaofimpossible.github.io/LCA-of-the-Impossible"
          EP="$BASE/episodes/solar-chariot-of-elios.html"
          for attempt in $(seq 1 30); do
            echo "Live probe $attempt/30"
            if curl -fsSL --retry 2 --retry-delay 2 "$EP?verify=$GITHUB_SHA-$attempt" -o /tmp/ep34.html \
              && grep -Fq 'Solar Chariot of Elios' /tmp/ep34.html \
              && grep -Fq '3,125 t CO₂e' /tmp/ep34.html \
              && grep -Fq 'data-episode="34"' /tmp/ep34.html; then
              echo "Episode page is live."
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              echo "Episode page did not become live within the verification window." >&2
              exit 1
            fi
            sleep 10
          done

          curl -fsSL "$BASE/?verify=$GITHUB_SHA" -o /tmp/home.html
          curl -fsSL "$BASE/archive.html?verify=$GITHUB_SHA" -o /tmp/archive.html
          curl -fsSL "$BASE/collections.html?verify=$GITHUB_SHA" -o /tmp/collections.html
          curl -fsSL "$BASE/compare.html?verify=$GITHUB_SHA" -o /tmp/compare.html
          curl -fsSL "$BASE/explore.html?verify=$GITHUB_SHA" -o /tmp/explore.html
          curl -fsSL "$BASE/episodes.json?verify=$GITHUB_SHA" -o /tmp/episodes.json
          curl -fsSL "$BASE/collections.json?verify=$GITHUB_SHA" -o /tmp/collections.json
          curl -fsSL "$BASE/sitemap.xml?verify=$GITHUB_SHA" -o /tmp/sitemap.xml
          curl -fsSL "$BASE/assets/phase6.js?verify=$GITHUB_SHA" -o /tmp/phase6.js
          curl -fsSL "$BASE/assets/passport-cleanup.js?verify=$GITHUB_SHA" -o /tmp/passport-cleanup.js
          curl -fsSL "$BASE/assets/images/episodes/ep34-solar-chariot-of-elios-cover.png?verify=$GITHUB_SHA" -o /tmp/live-cover.png

          grep -Fq '../assets/phase6.js' /tmp/ep34.html
          grep -Fq '../assets/passport-cleanup.js' /tmp/ep34.html
          grep -Fq '../assets/engagement.js' /tmp/ep34.html
          grep -Fq '../assets/telemetry.js' /tmp/ep34.html
          ! grep -Eiq 'Raw text|assets/pdf/episodes/.*\.pdf|Download (source )?PDF' /tmp/ep34.html
          grep -Fq 'View epic passport' /tmp/phase6.js
          grep -Fq 'Print / Save as PDF' /tmp/phase6.js

          python - <<'PY'
          import json
          from pathlib import Path
          episodes=json.loads(Path('/tmp/episodes.json').read_text(encoding='utf-8'))['episodes']
          ep=[e for e in episodes if e.get('number')==34]
          assert len(ep)==1, ep
          e=ep[0]
          assert e['slug']=='solar-chariot-of-elios'
          assert e['cover']=='assets/images/episodes/ep34-solar-chariot-of-elios-cover.png'
          assert e['result']=='3,125 t CO₂e'
          assert e['hotspot'].startswith('Gold plating and radiant panels contribute 3,086.5 t CO₂e')
          assert e['functionalUnit'].startswith('One operational year of the Solar Chariot of Elios')
          assert 'pdf' not in e
          assert e['evidence']['confidence']=='Medium'
          assert e['evidence']['proxyDependence']=='High'
          assert e['evidence']['assumptionSensitivity']=='High'
          assert e['related']==[55,52,45]
          collections=json.loads(Path('/tmp/collections.json').read_text(encoding='utf-8'))['collections']
          membership={c['slug']: c['episodes'] for c in collections}
          for slug in ('legendary-engineering','gilded-hotspots','gold-driven-cases'):
              assert 34 in membership[slug], (slug, membership[slug])
          sitemap=Path('/tmp/sitemap.xml').read_text(encoding='utf-8')
          assert sitemap.count('episodes/solar-chariot-of-elios.html')==1
          print('Live registry, collections and sitemap: PASS')
          PY

          LIVE_SHA="$(git hash-object /tmp/live-cover.png)"
          echo "Live cover blob: $LIVE_SHA"
          test "$LIVE_SHA" = "b60bafd6ba6494a521721158ac470a53b39b0592"
          test "$(wc -c < /tmp/live-cover.png)" -eq 2575588

          echo "Episode 34 final live verification: PASS"

      - name: Remove one-time verification workflow
        shell: bash
        run: |
          rm .github/workflows/ep34-live-verify.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Record Episode 34 final live verification"
          git pull --rebase origin main
          git push origin HEAD:main
