name: Episode 32 Publish

on:
  push:
    branches: [main]
    paths:
      - 'assets/images/episodes/ep32-pegasus-cover.png'

permissions:
  contents: write

concurrency:
  group: episode-32-publish-main
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install QA dependencies
        run: python -m pip install --disable-pip-version-check pillow

      - name: Register Episode 32 and collections
        run: python scripts/publish_ep32.py

      - name: Synchronize SEO and feature infrastructure
        run: |
          python scripts/apply_seo.py
          python scripts/feature_sync.py
          python scripts/engagement_sync.py
          python scripts/phase5_sync.py
          python scripts/phase6_sync.py
          python scripts/epic_passport_sync.py
          python scripts/telemetry_sync.py

      - name: Run full QA
        run: |
          python scripts/site_qa.py
          python scripts/seo_qa.py
          python scripts/feature_qa.py
          python scripts/engagement_qa.py
          python scripts/phase5_qa.py
          python scripts/phase6_qa.py
          python scripts/telemetry_qa.py

      - name: Remove one-time publisher
        run: rm -f scripts/publish_ep32.py .github/workflows/ep32-publish.yml

      - name: Commit synchronized Episode 32 publication
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No publication changes to commit."
            exit 0
          fi
          git commit -m "Publish Episode #32 — Pegasus"
          git pull --rebase origin main
          git push origin HEAD:main
