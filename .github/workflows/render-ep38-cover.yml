name: Render Episode 38 cover

on:
  push:
    branches: [main]
    paths:
      - 'assets/images/episodes/ep38-trojan-horse-cover-source.svg'

permissions:
  contents: write

jobs:
  render-cover:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install renderer
        run: python -m pip install --disable-pip-version-check cairosvg

      - name: Render 4:5 catalogue cover
        run: |
          python - <<'PY'
          import cairosvg
          cairosvg.svg2png(
              url='assets/images/episodes/ep38-trojan-horse-cover-source.svg',
              write_to='assets/images/episodes/ep38-trojan-horse-cover-20260816.png',
              output_width=1600,
              output_height=2000,
          )
          PY

      - name: Commit rendered cover
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/images/episodes/ep38-trojan-horse-cover-20260816.png
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Render Episode 38 catalogue cover"
          git push
