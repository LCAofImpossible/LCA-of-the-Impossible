name: SEO Sync

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: seo-sync-main
  cancel-in-progress: true

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Register Episode 33 Brahmastra
        run: python scripts/register_ep33.py

      - name: Synchronize static SEO metadata
        run: python scripts/apply_seo.py

      - name: Synchronize Phase 3 metadata
        run: python scripts/feature_sync.py

      - name: Synchronize Phase 4 engagement metadata
        run: python scripts/engagement_sync.py

      - name: Synchronize Phase 5 editorial infrastructure
        run: python scripts/phase5_sync.py

      - name: Synchronize Phase 6 model transparency
        run: python scripts/phase6_sync.py

      - name: Propagate Epic Passport presentation
        run: python scripts/epic_passport_sync.py

      - name: Propagate visitor telemetry
        run: python scripts/telemetry_sync.py

      - name: Commit synchronized metadata
        shell: bash
        run: |
          if git diff --quiet; then
            echo "SEO, features and telemetry already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html archive.html compare.html explore.html collections.html method.html sources.html about.html glossary.html episodes episodes.json collections.json README.md sitemap.xml robots.txt site.webmanifest assets/favicon.svg
          git commit -m "Sync Episode 33 and site metadata"
          git pull --rebase origin main
          git push origin HEAD:main
