name: Episode 44 Final Live Acceptance

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  acceptance:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run final live acceptance checks
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json, traceback, urllib.error, urllib.request
          from datetime import datetime, timezone

          BASE='https://lcaofimpossible.github.io/LCA-of-the-Impossible/'
          EXPECTED='3ac44495a975329821ced9ddcd8f73b1387073a689e67d17ee10052e62956f72'
          ok=True
          lines=[]
          def get(path):
              req=urllib.request.Request(BASE+path,headers={'Cache-Control':'no-cache','Pragma':'no-cache','User-Agent':'EP44-Final-Acceptance'})
              with urllib.request.urlopen(req,timeout=30) as r:
                  if r.status != 200: raise RuntimeError(f'{path}: HTTP {r.status}')
                  return r.read()
          try:
              html=get('episodes/wings-of-icarus.html').decode('utf-8')
              reg=json.loads(get('episodes.json').decode('utf-8'))
              cols=json.loads(get('collections.json').decode('utf-8'))
              sitemap=get('sitemap.xml').decode('utf-8')
              cover=get('assets/images/episodes/ep44-wings-of-icarus-cover-20260821.png')
              sha=hashlib.sha256(cover).hexdigest()
              assert sha==EXPECTED
              matches=[e for e in reg['episodes'] if e.get('number')==44]
              assert len(matches)==1
              ep=matches[0]
              assert ep['slug']=='wings-of-icarus'
              assert ep['cover']=='assets/images/episodes/ep44-wings-of-icarus-cover-20260821.png'
              assert ep['coverAspectPolicy']=='approved-native'
              assert ep['result']=='70.4 kg CO₂e'
              assert ep['hotspot']=='Bindings + harness contribute 62.5 kg CO₂e, or 88.8% of the baseline footprint.'
              assert ep['related']==[52,38,37]
              assert ep['evidence']=={
                  'confidence':'Medium','proxyDependence':'High','assumptionSensitivity':'High',
                  'basis':ep['evidence']['basis'],'uncertainty':ep['evidence']['uncertainty']}
              assert not any('pdf' in e for e in reg['episodes'])
              assert sitemap.count('/episodes/wings-of-icarus.html')==1
              legendary=next(c for c in cols['collections'] if c['slug']=='legendary-engineering')
              assert 44 in legendary['episodes']
              for needle in ['data-episode="44"','The Wings of Icarus','70.4 kg CO₂e','62.5 kg CO₂e','88.8%','53.0 kg CO₂e','91.2 kg CO₂e','8.32 kg CO₂e','89.1 kg CO₂e','application/ld+json','og:image','twitter:image','<meta name="viewport"','Skip to content','../assets/site.js','../assets/phase6.js','../assets/passport-cleanup.js','../assets/engagement.js','../assets/telemetry.js']:
                  assert needle in html, needle
              assert 'raw text' not in html.lower()
              assert 'download episode pdf' not in html.lower()
              assert 'assets/pdf/episodes/' not in html

              paths=['index.html','archive.html','collections.html','compare.html','explore.html','method.html','sources.html','about.html','glossary.html','assets/site.js','assets/phase6.js','assets/passport-cleanup.js','assets/engagement.js','assets/telemetry.js','assets/style.css','assets/features.css','assets/engagement.css','assets/editorial.css','assets/phase6.css','assets/telemetry.css','assets/images/episode-graphics/ep44-inventory-map.svg','assets/images/episode-graphics/ep44-technical-plate.svg','assets/images/episode-graphics/ep44-hotspot-breakdown.svg']
              deployed={p:get(p) for p in paths}
              phase6=deployed['assets/phase6.js'].decode('utf-8')
              cleanup=deployed['assets/passport-cleanup.js'].decode('utf-8')
              sitejs=deployed['assets/site.js'].decode('utf-8').lower()
              assert 'View epic passport →' in phase6
              assert 'Print / Save as PDF' in phase6
              assert 'allowedPassportActions' in cleanup
              assert "'view epic passport →'" in cleanup.lower()
              assert "'print / save as pdf'" in cleanup.lower()
              assert 'passport-raw' in cleanup and 'raw text' in cleanup.lower()
              assert 'related cases' in sitejs and 'previous episode' in sitejs and 'next episode' in sitejs
              css=(deployed['assets/style.css']+deployed['assets/features.css']+deployed['assets/phase6.css']).decode('utf-8')
              compact=css.replace(' ','').replace('\n','')
              assert '@media' in css and 'overflow-x' in css and 'object-fit:contain' in compact
              try:
                  get('assets/pdf/episodes/ep44-wings-of-icarus.pdf')
                  raise AssertionError('Unexpected Episode 44 source PDF is public')
              except urllib.error.HTTPError as exc:
                  assert exc.code==404
              lines=[
                  'Episode #44 final live verification: PASS',
                  f'UTC: {datetime.now(timezone.utc).isoformat()}',
                  f'Approved/live cover SHA-256: {sha}',
                  'Exact approved cover bytes live: PASS',
                  'Live episode HTML: PASS',
                  'Source numbers/results/sensitivities: PASS',
                  'episodes.json + Evidence Profile: PASS',
                  'Collections + Related Cases registry: PASS',
                  'SEO / Open Graph / Twitter / JSON-LD / sitemap: PASS',
                  'Homepage / Archive / Collections / Compare / Impact Map endpoints: HTTP 200',
                  'Inventory Map / Technical Plate / Hotspot Breakdown: HTTP 200',
                  'Epic Passport controls + Passport-only cleanup: PASS',
                  'Previous / Next runtime: PASS',
                  'Raw text: ABSENT',
                  'Source PDF field/link/file: ABSENT',
                  'Responsive/mobile CSS invariants: PASS',
                  'Accessibility structural invariants: PASS'
              ]
          except Exception:
              ok=False
              lines=['Episode #44 final live verification: FAIL',f'UTC: {datetime.now(timezone.utc).isoformat()}',traceback.format_exc()]
          open('ep44-live-verification.txt','w',encoding='utf-8').write('\n'.join(lines)+'\n')
          open('ep44-live-verification.status','w',encoding='utf-8').write('PASS\n' if ok else 'FAIL\n')
          PY

      - name: Record final live acceptance
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin main
          git add ep44-live-verification.txt ep44-live-verification.status
          git commit -m 'Record Episode 44 final live verification'
          git push origin HEAD:main

      - name: Enforce passing result
        shell: bash
        run: grep -qx 'PASS' ep44-live-verification.status
