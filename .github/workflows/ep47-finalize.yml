name: Episode 47 Finalize

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ep47-finalize.yml'

permissions:
  contents: write

concurrency:
  group: ep47-finalize
  cancel-in-progress: true

jobs:
  publish-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install QA dependencies
        run: python -m pip install --disable-pip-version-check pillow

      - name: Let concurrent metadata sync settle
        shell: bash
        run: |
          sleep 60
          git pull --rebase origin main

      - name: Finalize Episode 47 registry, collections and exact approved cover
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, json

          ROOT = Path('.')
          source = ROOT / 'assets/images/episodes/file_0000000006a481f4a206802445387626.png'
          target = ROOT / 'assets/images/episodes/ep47-draupnir-cover.png'
          expected_sha256 = 'b4670ac34cb1e45055c159ee879fd2f239118733071a336b277b5db041ce21f0'
          expected_git_blob = '5e6b59b3a306be9b5214930933ecbcb8d3b80bdb'

          def sha256(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()

          if target.exists():
              assert sha256(target) == expected_sha256
              if source.exists():
                  assert sha256(source) == expected_sha256
                  source.unlink()
          else:
              assert source.exists(), 'Approved uploaded cover not found'
              assert sha256(source) == expected_sha256, 'Uploaded cover does not match approved bytes'
              source.rename(target)
          assert sha256(target) == expected_sha256, 'Cover bytes changed during canonical rename'

          registry_path = ROOT / 'episodes.json'
          registry = json.loads(registry_path.read_text(encoding='utf-8'))
          ep47 = {
              'number': 47,
              'slug': 'draupnir',
              'title': 'Draupnir',
              'url': 'episodes/draupnir.html',
              'cover': 'assets/images/episodes/ep47-draupnir-cover.png',
              'coverAspectPolicy': 'approved-native',
              'categoryLabel': 'Myth & Legend',
              'categories': ['mythology', 'legends'],
              'lcaLabel': 'Materials-driven',
              'lcaCharacteristics': ['materials-driven', 'proxy-sensitive'],
              'result': '90.8 t CO₂e',
              'hotspot': 'Primary gold contributes 90,756.7 kg CO₂e, or 99.996% of the baseline result.',
              'featuredDescription': 'One nine-night Draupnir replication event reconstructed as nine equal 0.45 kg fine-gold rings: 90.8 t CO₂e, with primary gold carrying 99.996% of the footprint while minor modeled flows total only 3.7 kg CO₂e.',
              'functionalUnit': 'One complete Draupnir replication event: one original gold arm-ring plus eight equal rings delivered over a nine-night cycle.',
              'evidence': {
                  'confidence': 'Medium',
                  'proxyDependence': 'High',
                  'assumptionSensitivity': 'High',
                  'basis': 'The approved episode defines one nine-night replication event as nine equal 0.45 kg fine-gold rings (4.05 kg total), with an idealized torus reconstruction, workshop electricity, local freight, a wood box and a lost-wax mold. DEFRA 2026 is used where representative; primary gold uses a separately disclosed external mine-intensity proxy because DEFRA does not provide a gold mining factor.',
                  'uncertainty': 'Ring mass and the primary-gold intensity proxy control interpretation. The reported mass sensitivity spans 50.4–151.3 t CO₂e, while changing only the gold-intensity proxy spans 49.4–132.4 t CO₂e.'
              },
              'keywords': ['draupnir','norse mythology','gold ring','gold','replication','material replication','fine gold','nine-night cycle','DEFRA 2026','primary gold','gold mining proxy','materials-driven','proxy sensitivity'],
              'related': [55, 52, 41]
          }
          episodes = [e for e in registry.get('episodes', []) if e.get('number') != 47]
          episodes.append(ep47)
          episodes.sort(key=lambda e: e['number'], reverse=True)
          assert not any('pdf' in e for e in episodes), 'A public pdf field is forbidden'
          registry['episodes'] = episodes
          registry_path.write_text(json.dumps(registry, ensure_ascii=False, separators=(',', ':')) + '\n', encoding='utf-8')

          collections_path = ROOT / 'collections.json'
          cols = json.loads(collections_path.read_text(encoding='utf-8'))
          collections = cols['collections']
          legendary = next(c for c in collections if c.get('slug') == 'legendary-engineering')
          legendary['episodes'] = [n for n in legendary.get('episodes', []) if n != 47]
          insert_at = next((i for i, n in enumerate(legendary['episodes']) if n < 47), len(legendary['episodes']))
          legendary['episodes'].insert(insert_at, 47)
          gold_collection = {
              'slug': 'gold-driven-cases',
              'title': 'Gold-Driven Cases',
              'eyebrow': 'PRECIOUS METAL & MATERIAL INTENSITY',
              'description': 'Cases where gold intensity overwhelms much larger energy, logistics or base-material flows, making the precious-metal assumption the decisive model driver.',
              'episodes': [55, 52, 47]
          }
          collections = [c for c in collections if c.get('slug') != 'gold-driven-cases']
          collections.append(gold_collection)
          cols['collections'] = collections
          collections_path.write_text(json.dumps(cols, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          qa_path = ROOT / 'scripts/site_qa.py'
          qa = qa_path.read_text(encoding='utf-8')
          qa = qa.replace('def check_cover(number: int, value: str) -> None:', 'def check_cover(number: int, value: str, aspect_policy: str | None = None) -> None:', 1)
          old_ratio = '''    if abs(ratio - 0.8) > 0.012:\n        fail(f"Episode #{number} cover: expected portrait 4:5, found {width}x{height} (ratio {ratio:.4f})")'''
          new_ratio = '''    if abs(ratio - 0.8) > 0.012:\n        if aspect_policy == "approved-native":\n            if not (0.5 < ratio < 1.0):\n                fail(f"Episode #{number} cover: approved-native asset must remain portrait, found {width}x{height} (ratio {ratio:.4f})")\n            else:\n                warn(f"Episode #{number} cover: using explicitly approved native aspect ratio {width}x{height}; exact-file rule overrides 4:5 target")\n        else:\n            fail(f"Episode #{number} cover: expected portrait 4:5, found {width}x{height} (ratio {ratio:.4f})")'''
          if old_ratio in qa:
              qa = qa.replace(old_ratio, new_ratio, 1)
          qa = qa.replace('                check_cover(number, cover)', '                check_cover(number, cover, episode.get("coverAspectPolicy"))', 1)
          qa_path.write_text(qa, encoding='utf-8')

          readme_path = ROOT / 'README.md'
          readme = readme_path.read_text(encoding='utf-8')
          note = '**Explicit approved-native cover exception:** if the user explicitly approves a specific raster and simultaneously requires byte-for-byte reuse, the exact-file rule prevails over the canonical 4:5 production target. Record `coverAspectPolicy: "approved-native"` for that episode, preserve the approved blob unchanged, and render it uncropped with the catalogue\'s contain behaviour. This is a controlled exception for an explicitly approved exact asset, not permission to generate new covers outside the canonical 4:5 family.'
          if note not in readme:
              anchor = 'When a cover is replaced after publication, use a cache-safe new filename/revision, update `episodes.json`, deploy, and verify what GitHub Pages actually serves before considering the replacement complete. **Never solve a cache or transfer problem by regenerating the artwork.**'
              assert anchor in readme, 'README exact-file anchor missing'
              readme = readme.replace(anchor, anchor + '\n\n' + note, 1)
              readme_path.write_text(readme, encoding='utf-8')

          html = (ROOT / 'episodes/draupnir.html').read_text(encoding='utf-8')
          required = ['data-episode="47"','90.8 t CO₂e','99.996%','90,756.7 kg CO₂e','3.7 kg CO₂e','0.25 kg/ring → 50.4 t CO₂e','0.75 kg/ring → 151.3 t CO₂e','12,200 kg/kg → 49.4 t CO₂e','32,689 kg/kg → 132.4 t CO₂e','4.05 kg','0.45 kg','9.1 cm','19.32 g/cm³','22,409 kg CO₂e/kg','0.18436 kg CO₂e/kWh','0.10356 kg CO₂e/t-km','0.26950 kg CO₂e/kg','0.074996 kg CO₂e/kg','../assets/site.js','../assets/phase6.js','../assets/passport-cleanup.js']
          for token in required:
              assert token in html, token
          for token in ['assets/pdf/episodes/','Download episode PDF','Raw text','cover-frame']:
              assert token.lower() not in html.lower(), token
          for p in ['assets/images/episode-graphics/ep47-inventory-map.svg','assets/images/episode-graphics/ep47-technical-plate.svg','assets/images/episode-graphics/ep47-hotspot-breakdown.svg']:
              assert (ROOT / p).is_file(), p
          print('Episode 47 source reconciliation and cover freeze: PASS')
          print('Approved cover SHA-256:', sha256(target))
          print('Expected Git blob:', expected_git_blob)
          PY
          test "$(git hash-object assets/images/episodes/ep47-draupnir-cover.png)" = "5e6b59b3a306be9b5214930933ecbcb8d3b80bdb"

      - name: Synchronize all current site layers
        run: |
          python scripts/apply_seo.py
          python scripts/feature_sync.py
          python scripts/engagement_sync.py
          python scripts/phase5_sync.py
          python scripts/phase6_sync.py
          python scripts/epic_passport_sync.py
          python scripts/telemetry_sync.py

      - name: Run full repository QA
        run: |
          python scripts/site_qa.py
          python scripts/seo_qa.py
          python scripts/feature_qa.py
          python scripts/engagement_qa.py
          python scripts/phase5_qa.py
          python scripts/phase6_qa.py
          python scripts/telemetry_qa.py

      - name: Run Episode 47 bespoke QA
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          root = Path('.')
          expected = 'b4670ac34cb1e45055c159ee879fd2f239118733071a336b277b5db041ce21f0'
          cover = root / 'assets/images/episodes/ep47-draupnir-cover.png'
          assert hashlib.sha256(cover.read_bytes()).hexdigest() == expected
          reg = json.loads((root/'episodes.json').read_text(encoding='utf-8'))
          matches = [e for e in reg['episodes'] if e.get('number') == 47]
          assert len(matches) == 1
          ep = matches[0]
          assert ep['slug'] == 'draupnir'
          assert ep['cover'] == 'assets/images/episodes/ep47-draupnir-cover.png'
          assert ep['coverAspectPolicy'] == 'approved-native'
          assert ep['functionalUnit'] == 'One complete Draupnir replication event: one original gold arm-ring plus eight equal rings delivered over a nine-night cycle.'
          assert ep['result'] == '90.8 t CO₂e'
          assert ep['lcaLabel'] == 'Materials-driven'
          assert ep['related'] == [55,52,41]
          assert ep['evidence']['confidence'] == 'Medium'
          assert ep['evidence']['proxyDependence'] == 'High'
          assert ep['evidence']['assumptionSensitivity'] == 'High'
          assert 'pdf' not in ep and not any('pdf' in e for e in reg['episodes'])
          cols = json.loads((root/'collections.json').read_text(encoding='utf-8'))
          assert 47 in next(c for c in cols['collections'] if c['slug']=='legendary-engineering')['episodes']
          assert next(c for c in cols['collections'] if c['slug']=='gold-driven-cases')['episodes'] == [55,52,47]
          sitemap = (root/'sitemap.xml').read_text(encoding='utf-8')
          assert sitemap.count('/episodes/draupnir.html') == 1
          html = (root/'episodes/draupnir.html').read_text(encoding='utf-8')
          assert 'rel="canonical" href="https://lcaofimpossible.github.io/LCA-of-the-Impossible/episodes/draupnir.html"' in html
          assert 'og:image' in html and 'twitter:image' in html and 'application/ld+json' in html
          assert 'Raw text' not in html and '/assets/pdf/' not in html.lower()
          lines = [
              'Episode #47 repository QA: PASS',
              'Approved cover SHA-256: ' + expected,
              'Approved cover Git blob: 5e6b59b3a306be9b5214930933ecbcb8d3b80bdb',
              'Exact approved cover preserved: PASS',
              'PDF source/registry exposure: NONE',
              'Raw text export: NONE',
              'Source numerical reconciliation: PASS',
              'Evidence Profile registry data: PASS',
              'Epic Passport registry basis: PASS',
              'Related Cases and Collections: PASS',
              'SEO / Open Graph / Twitter / JSON-LD / sitemap: PASS',
              'Structural / feature / engagement / Phase 5 / Phase 6 / telemetry QA: PASS',
          ]
          (root/'ep47-qa-verification.txt').write_text('\n'.join(lines)+'\n', encoding='utf-8')
          PY

      - name: Commit Episode 47 to main
        shell: bash
        run: |
          rm -f .github/workflows/ep47-finalize.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish Episode 47 Draupnir"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Verify deployed GitHub Pages result
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json, time, traceback, urllib.request
          from datetime import datetime, timezone
          BASE = 'https://lcaofimpossible.github.io/LCA-of-the-Impossible/'
          EXPECTED = 'b4670ac34cb1e45055c159ee879fd2f239118733071a336b277b5db041ce21f0'
          def get(path):
              req = urllib.request.Request(BASE + path, headers={'Cache-Control':'no-cache','User-Agent':'LCA-Episode-47-QA'})
              with urllib.request.urlopen(req, timeout=30) as r:
                  if r.status != 200: raise RuntimeError(f'{path}: HTTP {r.status}')
                  return r.read()
          lines=[]
          ok=False
          err=None
          for _ in range(54):
              try:
                  html = get('episodes/draupnir.html').decode('utf-8')
                  reg = json.loads(get('episodes.json').decode('utf-8'))
                  ep = next((e for e in reg.get('episodes',[]) if e.get('number')==47), None)
                  if ep and 'Draupnir' in html and '90.8 t CO₂e' in html:
                      cover = get('assets/images/episodes/ep47-draupnir-cover.png')
                      if hashlib.sha256(cover).hexdigest() == EXPECTED:
                          ok=True
                          break
              except Exception as exc:
                  err=exc
              time.sleep(10)
          if not ok:
              raise RuntimeError(f'Live deployment did not converge: {err}')
          cover = get('assets/images/episodes/ep47-draupnir-cover.png')
          sha = hashlib.sha256(cover).hexdigest()
          html = get('episodes/draupnir.html').decode('utf-8')
          reg = json.loads(get('episodes.json').decode('utf-8'))
          ep = next(e for e in reg['episodes'] if e.get('number')==47)
          assert sha == EXPECTED
          for token in ['data-episode="47"','90.8 t CO₂e','99.996%','50.4 t CO₂e','151.3 t CO₂e','49.4 t CO₂e','132.4 t CO₂e','../assets/site.js','../assets/phase6.js','../assets/passport-cleanup.js']:
              assert token in html, token
          assert 'Raw text' not in html
          assert '/assets/pdf/' not in html.lower() and 'download episode pdf' not in html.lower()
          assert 'rel="canonical" href="https://lcaofimpossible.github.io/LCA-of-the-Impossible/episodes/draupnir.html"' in html
          assert 'og:image' in html and 'twitter:image' in html and 'application/ld+json' in html
          assert ep['cover'] == 'assets/images/episodes/ep47-draupnir-cover.png'
          assert ep['coverAspectPolicy'] == 'approved-native'
          assert ep['result'] == '90.8 t CO₂e'
          assert ep['related'] == [55,52,41]
          assert 'pdf' not in ep and not any('pdf' in e for e in reg['episodes'])
          sitemap = get('sitemap.xml').decode('utf-8')
          assert sitemap.count('/episodes/draupnir.html') == 1
          cols = json.loads(get('collections.json').decode('utf-8'))
          assert 47 in next(c for c in cols['collections'] if c['slug']=='legendary-engineering')['episodes']
          assert next(c for c in cols['collections'] if c['slug']=='gold-driven-cases')['episodes'] == [55,52,47]
          endpoints = ['index.html','archive.html','collections.html','compare.html','explore.html','assets/site.js','assets/phase6.js','assets/passport-cleanup.js','assets/engagement.js','assets/style.css','assets/editorial.css','assets/phase6.css','assets/images/episode-graphics/ep47-inventory-map.svg','assets/images/episode-graphics/ep47-technical-plate.svg','assets/images/episode-graphics/ep47-hotspot-breakdown.svg']
          deployed = {p:get(p) for p in endpoints}
          phase6 = deployed['assets/phase6.js'].decode('utf-8')
          cleanup = deployed['assets/passport-cleanup.js'].decode('utf-8')
          assert 'View epic passport →' in phase6 and 'Print / Save as PDF' in phase6
          assert 'Raw text' not in phase6
          assert 'allowedPassportActions' in cleanup and 'raw text' in cleanup.lower()
          css = deployed['assets/style.css'].decode('utf-8') + deployed['assets/phase6.css'].decode('utf-8')
          assert '@media' in css and 'overflow-x' in css and 'object-fit:contain' in css.replace(' ','')
          lines = [
              'Episode #47 live verification: PASS',
              f'UTC: {datetime.now(timezone.utc).isoformat()}',
              f'Cover SHA-256: {sha}',
              'Exact approved cover live: PASS',
              'Live episode HTML and registry: PASS',
              'Live sitemap and collections: PASS',
              'Homepage/archive/collections/compare/explore endpoints: HTTP 200',
              'Analytical graphics and shared assets: HTTP 200',
              'Epic Passport labels and Passport-only cleanup deployed: PASS',
              'Raw text in episode/Passport implementation: NO',
              'Source PDF link in episode HTML/registry: NO',
              'Responsive/mobile CSS invariants deployed: PASS',
          ]
          open('ep47-live-verification.txt','w',encoding='utf-8').write('\n'.join(lines)+'\n')
          print('\n'.join(lines))
          PY

      - name: Record live verification
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          git add ep47-live-verification.txt
          git commit -m "Record Episode 47 live verification"
          git push origin HEAD:main
