name: Finalize HQ episode covers
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-hq-covers.yml'
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Materialize HQ assets and update references
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p assets/img
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/LCAofImpossible/LCA-of-the-Impossible/git/blobs/ac4b38f69fb725539e97ee2bb20c57ab02845191" | jq -r '.content' | tr -d '\n' | base64 -d > assets/img/flying-dutchman-cover-hq2.jpg
          test -s assets/img/flying-dutchman-cover-hq2.jpg
          test -s assets/img/tower-of-babel-cover-hq.jpg
          sed -i 's#assets/img/flying-dutchman-linkedin-live.webp#assets/img/flying-dutchman-cover-hq2.jpg#g' index.html
          sed -i 's#assets/img/tower-of-babel-linkedin-live.webp#assets/img/tower-of-babel-cover-hq.jpg#g' index.html
          sed -i 's#../assets/img/flying-dutchman-linkedin-live.webp#../assets/img/flying-dutchman-cover-hq2.jpg#g' episodes/flying-dutchman.html
          sed -i 's#../assets/img/tower-of-babel-linkedin-live.webp#../assets/img/tower-of-babel-cover-hq.jpg#g' episodes/tower-of-babel.html
          rm -f .github/workflows/materialize-flying-cover.yml
          rm -f .github/workflows/finalize-hq-covers.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Use high-quality LinkedIn episode covers"
          git push
