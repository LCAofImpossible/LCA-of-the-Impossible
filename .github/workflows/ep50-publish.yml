name: Episode 50 Controlled Build

on:
  push:
    branches: [ep50-bifrost-staging]
    paths:
      - '.github/workflows/ep50-publish.yml'

permissions:
  contents: write

concurrency:
  group: ep50-bifrost-controlled-build
  cancel-in-progress: true

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install QA dependency
        run: python -m pip install --disable-pip-version-check pillow

      - name: Assemble controlled publisher
        run: |
          cat .github/ep50-script-part-01.txt .github/ep50-script-part-02.txt .github/ep50-script-part-03.txt > scripts/publish_ep50.py
          python -m py_compile scripts/publish_ep50.py

      - name: Import exact approved cover from main and freeze canonical path
        run: |
          git fetch origin main
          git checkout origin/main -- assets/images/episodes/file_000000000bb4820da5abc2b25f78d641.png
          git mv assets/images/episodes/file_000000000bb4820da5abc2b25f78d641.png assets/images/episodes/ep50-bifrost-cover.png

      - name: Generate Episode 50 source files
        run: python scripts/publish_ep50.py

      - name: Synchronize shared site systems
        run: |
          python scripts/apply_seo.py
          python scripts/feature_sync.py
          python scripts/engagement_sync.py
          python scripts/phase5_sync.py
          python scripts/phase6_sync.py
          python scripts/epic_passport_sync.py

      - name: Run full repository QA
        run: |
          python scripts/site_qa.py
          python scripts/seo_qa.py
          python scripts/feature_qa.py
          python scripts/engagement_qa.py
          python scripts/phase5_qa.py
          python scripts/phase6_qa.py

      - name: Commit clean Episode 50 release candidate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f scripts/publish_ep50.py .github/ep50-script-part-01.txt .github/ep50-script-part-02.txt .github/ep50-script-part-03.txt .github/workflows/ep50-publish.yml
          git add -A
          git commit -m "Prepare Episode 50: Bifrost"
          git push origin HEAD:ep50-bifrost-staging
