name: Diagnose live Episode 54

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ep54-live-verify.yml'

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Probe live GitHub Pages
        shell: bash
        run: |
          set +e
          BASE='https://lcaofimpossible.github.io/LCA-of-the-Impossible'
          REPORT='.ep54-live-diagnostic.txt'
          : > "$REPORT"
          probe() {
            name="$1"; url="$2"; out="$3"
            code=$(curl -LsS --max-time 30 -o "$out" -w '%{http_code}' "$url" 2>>"$REPORT")
            echo "$name HTTP $code" >> "$REPORT"
          }
          probe episode "$BASE/episodes/santas-sleigh.html" /tmp/episode.html
          probe cover "$BASE/assets/images/episodes/ep54-santas-sleigh-cover.png" /tmp/cover.png
          probe pdf "$BASE/assets/pdf/episodes/ep54-santas-sleigh.pdf" /tmp/episode.pdf
          probe homepage "$BASE/" /tmp/home.html
          probe archive "$BASE/archive.html" /tmp/archive.html
          probe registry "$BASE/episodes.json" /tmp/episodes.json
          probe collections "$BASE/collections.json" /tmp/collections.json
          probe sitemap "$BASE/sitemap.xml" /tmp/sitemap.xml
          probe compare "$BASE/compare.html" /tmp/compare.html
          probe explore "$BASE/explore.html" /tmp/explore.html
          probe collections_page "$BASE/collections.html" /tmp/collections.html
          if [ -f /tmp/episode.html ]; then
            grep -Fq "Santa's Sleigh" /tmp/episode.html; echo "episode_has_title=$?" >> "$REPORT"
            grep -Fq '267 kg CO₂e' /tmp/episode.html; echo "episode_has_result=$?" >> "$REPORT"
            grep -Fq 'ep54-santas-sleigh-cover.png' /tmp/episode.html; echo "episode_has_cover_meta=$?" >> "$REPORT"
            grep -Fq 'ep54-santas-sleigh.pdf' /tmp/episode.html; echo "episode_has_pdf_link=$?" >> "$REPORT"
          fi
          if [ -s /tmp/cover.png ]; then sha256sum /tmp/cover.png >> "$REPORT"; fi
          if [ -s /tmp/episode.pdf ]; then sha256sum /tmp/episode.pdf >> "$REPORT"; fi
          if [ -f /tmp/episodes.json ]; then grep -Fq '"number": 54' /tmp/episodes.json; echo "registry_has_54=$?" >> "$REPORT"; fi
          if [ -f /tmp/collections.json ]; then grep -Fq 'legendary-engineering' /tmp/collections.json; echo "collections_has_legendary_engineering=$?" >> "$REPORT"; grep -Fq '54' /tmp/collections.json; echo "collections_has_54=$?" >> "$REPORT"; fi
          if [ -f /tmp/sitemap.xml ]; then grep -Fq 'episodes/santas-sleigh.html' /tmp/sitemap.xml; echo "sitemap_has_episode=$?" >> "$REPORT"; fi
          cat "$REPORT"

      - name: Commit diagnostic and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/ep54-live-verify.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Record Episode 54 live diagnostic'
          git pull --rebase origin main
          git push origin HEAD:main
