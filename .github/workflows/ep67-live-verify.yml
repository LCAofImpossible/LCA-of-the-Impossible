name: Episode 67 Live Verification

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: ep67-live-verification
  cancel-in-progress: true

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install QA dependencies
        run: python -m pip install --disable-pip-version-check pillow

      - name: Run deterministic synchronization in verification workspace
        run: |
          python scripts/apply_seo.py
          python scripts/feature_sync.py
          python scripts/engagement_sync.py
          python scripts/phase5_sync.py
          python scripts/phase6_sync.py
          python scripts/epic_passport_sync.py
          python scripts/telemetry_sync.py

      - name: Run complete repository QA suite
        run: |
          python scripts/site_qa.py
          python scripts/seo_qa.py
          python scripts/feature_qa.py
          python scripts/engagement_qa.py
          python scripts/phase5_qa.py
          python scripts/phase6_qa.py
          python scripts/telemetry_qa.py

      - name: Verify Episode 67 registry and publication contract
        shell: bash
        run: |
          python - <<'PY'
          import json, pathlib, sys
          root = pathlib.Path('.')
          data = json.loads((root/'episodes.json').read_text(encoding='utf-8'))
          eps = [e for e in data['episodes'] if e.get('number') == 67]
          assert len(eps) == 1, f'Expected exactly one Episode 67 entry, found {len(eps)}'
          ep = eps[0]
          assert ep['slug'] == 'augean-stables'
          assert ep['result'] == '181 t CO₂e'
          assert ep['cover'] == 'assets/images/episodes/ep67-augean-stables-cover.png'
          assert 'pdf' not in ep
          assert set(['confidence','proxyDependence','assumptionSensitivity','basis','uncertainty']).issubset(ep['evidence'])
          collections = json.loads((root/'collections.json').read_text(encoding='utf-8'))['collections']
          for slug in ('impossible-structures','legendary-engineering'):
              c = next(x for x in collections if x['slug'] == slug)
              assert 67 in c['episodes'], f'Episode 67 missing from {slug}'
          html = (root/'episodes/augean-stables.html').read_text(encoding='utf-8')
          assert 'data-episode="67"' in html
          assert 'passport-cleanup.js' in html and 'phase6.js' in html and 'site.js' in html
          assert 'assets/pdf/episodes/' not in html
          assert 'Raw text' not in html
          assert '../assets/images/episode-graphics/ep67-inventory-map.svg' in html
          assert '../assets/images/episode-graphics/ep67-technical-plate.svg' in html
          assert '../assets/images/episode-graphics/ep67-hotspot-breakdown.svg' in html
          phase6 = (root/'assets/phase6.js').read_text(encoding='utf-8')
          assert 'View epic passport' in phase6
          assert 'Print / Save as PDF' in phase6
          assert 'Raw text' not in phase6
          cleanup = (root/'assets/passport-cleanup.js').read_text(encoding='utf-8')
          assert 'Raw text' in cleanup or 'raw' in cleanup.lower()
          assert 'augean-stables.html' in (root/'sitemap.xml').read_text(encoding='utf-8')
          print('Episode 67 publication contract: PASS')
          PY

      - name: Verify exact approved cover in repository
        shell: bash
        run: |
          test "$(sha256sum assets/images/episodes/ep67-augean-stables-cover.png | awk '{print $1}')" = "e9f835644931056778e42fd9458fdc3e67d875f08bc4d413aab7aec3141cbef1"

      - name: Wait for GitHub Pages and verify live publication
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://lcaofimpossible.github.io/LCA-of-the-Impossible'
          EP="$BASE/episodes/augean-stables.html"
          COVER="$BASE/assets/images/episodes/ep67-augean-stables-cover.png"
          HOME="$BASE/"
          ARCHIVE="$BASE/archive.html"
          COLLECTIONS="$BASE/collections.html"
          COMPARE="$BASE/compare.html"
          EXPLORE="$BASE/explore.html"
          SITEMAP="$BASE/sitemap.xml"
          ok=0
          for i in $(seq 1 48); do
            if curl -fsSL --retry 2 --connect-timeout 10 "$EP?verify=$i" -o /tmp/ep.html \
              && curl -fsSL --retry 2 --connect-timeout 10 "$HOME?verify=$i" -o /tmp/home.html \
              && curl -fsSL --retry 2 --connect-timeout 10 "$ARCHIVE?verify=$i" -o /tmp/archive.html \
              && curl -fsSL --retry 2 --connect-timeout 10 "$COLLECTIONS?verify=$i" -o /tmp/collections.html \
              && curl -fsSL --retry 2 --connect-timeout 10 "$COMPARE?verify=$i" -o /tmp/compare.html \
              && curl -fsSL --retry 2 --connect-timeout 10 "$EXPLORE?verify=$i" -o /tmp/explore.html \
              && curl -fsSL --retry 2 --connect-timeout 10 "$SITEMAP?verify=$i" -o /tmp/sitemap.xml \
              && curl -fsSL --retry 2 --connect-timeout 10 "$COVER?verify=$i" -o /tmp/cover.png; then
              if grep -q 'The Augean Stables' /tmp/ep.html \
                && grep -q '181 t CO₂e' /tmp/ep.html \
                && grep -q 'ep67-augean-stables-cover.png' /tmp/ep.html \
                && grep -q 'passport-cleanup.js' /tmp/ep.html \
                && grep -q 'augean-stables.html' /tmp/sitemap.xml \
                && ! grep -q 'assets/pdf/episodes/' /tmp/ep.html \
                && ! grep -q 'Raw text' /tmp/ep.html \
                && test "$(sha256sum /tmp/cover.png | awk '{print $1}')" = 'e9f835644931056778e42fd9458fdc3e67d875f08bc4d413aab7aec3141cbef1'; then
                  ok=1
                  break
              fi
            fi
            sleep 10
          done
          test "$ok" = 1
          cat > ep67-live-verification.txt <<EOF
          Episode 67 live verification: PASS
          Episode URL: $EP
          Cover URL: $COVER
          Exact approved cover SHA-256: e9f835644931056778e42fd9458fdc3e67d875f08bc4d413aab7aec3141cbef1
          Main result: 181 t CO₂e
          Source-PDF download exposed: NO
          Raw text exposed in static episode HTML: NO
          Passport cleanup loaded: YES
          Sitemap includes Episode 67: YES
          Homepage reachable: YES
          Archive reachable: YES
          Collections reachable: YES
          Compare reachable: YES
          Impact Map reachable: YES
          Repository QA suite: PASS
          EOF

      - name: Record verification and remove one-time workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -- .
          git clean -fd
          # Recreate only the verified report after removing temporary sync changes.
          cat > ep67-live-verification.txt <<'EOF'
          Episode 67 live verification: PASS
          Episode URL: https://lcaofimpossible.github.io/LCA-of-the-Impossible/episodes/augean-stables.html
          Cover URL: https://lcaofimpossible.github.io/LCA-of-the-Impossible/assets/images/episodes/ep67-augean-stables-cover.png
          Exact approved cover SHA-256: e9f835644931056778e42fd9458fdc3e67d875f08bc4d413aab7aec3141cbef1
          Main result: 181 t CO₂e
          Source-PDF download exposed: NO
          Raw text exposed in static episode HTML: NO
          Passport cleanup loaded: YES
          Sitemap includes Episode 67: YES
          Homepage reachable: YES
          Archive reachable: YES
          Collections reachable: YES
          Compare reachable: YES
          Impact Map reachable: YES
          Repository QA suite: PASS
          EOF
          git rm .github/workflows/ep67-live-verify.yml
          git add ep67-live-verification.txt
          git commit -m "Record Episode 67 live verification"
          git pull --rebase origin main
          git push origin HEAD:main
