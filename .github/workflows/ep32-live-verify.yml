name: Episode 32 Live Verify

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ep32-live-verify.yml'

permissions:
  contents: write

jobs:
  verify-live:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Wait for GitHub Pages publication
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://lcaofimpossible.github.io/LCA-of-the-Impossible'
          for i in $(seq 1 60); do
            if curl -fsSL --retry 2 --connect-timeout 10 "$BASE/episodes.json?verify=$GITHUB_SHA" -o /tmp/live-episodes.json \
              && grep -q '"number": 32' /tmp/live-episodes.json \
              && grep -q 'assets/images/episodes/ep32-pegasus-cover.png' /tmp/live-episodes.json \
              && curl -fsSL --retry 2 --connect-timeout 10 "$BASE/assets/images/episodes/ep32-pegasus-cover.png?verify=$GITHUB_SHA" -o /tmp/live-cover.png; then
              HASH=$(sha256sum /tmp/live-cover.png | awk '{print $1}')
              if [ "$HASH" = '48ca70217d868843ddf8386155fb59fa4a137c5a603564325085a20548ec92aa' ]; then
                echo "Live Episode #32 registry and exact cover are available."
                exit 0
              fi
            fi
            echo "Waiting for Pages deployment ($i/60)..."
            sleep 10
          done
          echo 'Timed out waiting for Episode #32 live deployment.' >&2
          exit 1

      - name: Verify live static publication contract
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://lcaofimpossible.github.io/LCA-of-the-Impossible'
          curl -fsSL "$BASE/episodes/pegasus.html?verify=$GITHUB_SHA" -o /tmp/pegasus.html
          curl -fsSL "$BASE/episodes.json?verify=$GITHUB_SHA" -o /tmp/episodes.json
          curl -fsSL "$BASE/collections.json?verify=$GITHUB_SHA" -o /tmp/collections.json
          curl -fsSL "$BASE/sitemap.xml?verify=$GITHUB_SHA" -o /tmp/sitemap.xml
          curl -fsSL "$BASE/assets/phase6.js?v=20260819-epic-passport3&verify=$GITHUB_SHA" -o /tmp/phase6.js
          curl -fsSL "$BASE/assets/passport-cleanup.js?v=20260819-passport-cleanup2&verify=$GITHUB_SHA" -o /tmp/passport-cleanup.js
          python - <<'PY'
          import json, re
          from pathlib import Path

          episode_html = Path('/tmp/pegasus.html').read_text(encoding='utf-8')
          episodes = json.loads(Path('/tmp/episodes.json').read_text(encoding='utf-8'))
          collections = json.loads(Path('/tmp/collections.json').read_text(encoding='utf-8'))
          sitemap = Path('/tmp/sitemap.xml').read_text(encoding='utf-8')
          phase6 = Path('/tmp/phase6.js').read_text(encoding='utf-8')
          cleanup = Path('/tmp/passport-cleanup.js').read_text(encoding='utf-8')

          matches = [e for e in episodes['episodes'] if e.get('number') == 32]
          assert len(matches) == 1, f'Expected exactly one Episode #32, found {len(matches)}'
          ep = matches[0]
          assert ep['slug'] == 'pegasus'
          assert ep['cover'] == 'assets/images/episodes/ep32-pegasus-cover.png'
          assert ep['functionalUnit'] == 'One 300 km courier flight carrying one rider and one sealed message.'
          assert ep['result'] == '5.51 kg CO₂e'
          assert ep['hotspot'] == 'Feed contributes 2.68 kg CO₂e, or 48.6% of the baseline footprint.'
          assert 'pdf' not in ep
          assert all('pdf' not in e for e in episodes['episodes']), 'Public registry contains a legacy pdf field'

          flight = [c for c in collections['collections'] if c.get('slug') == 'impossible-flight']
          assert len(flight) == 1 and 32 in flight[0]['episodes']

          required_html = [
              'Pegasus — Episode #32 | LCA of the Impossible',
              '5.51 kg CO₂e',
              'ep32-pegasus-cover.png',
              'application/ld+json',
              'twitter:card',
              'og:image',
              '../assets/site.js',
              '../assets/phase6.js?v=20260819-epic-passport3',
              '../assets/passport-cleanup.js?v=20260819-passport-cleanup2',
          ]
          for token in required_html:
              assert token in episode_html, f'Missing live episode token: {token}'
          assert 'assets/pdf/episodes/' not in episode_html
          assert re.search(r'<meta name="robots" content="index,follow,max-image-preview:large">', episode_html)
          assert 'episodes/pegasus.html' in sitemap
          assert 'View epic passport' in phase6
          assert 'Print / Save as PDF' in phase6
          assert 'Raw text' not in phase6
          assert 'Raw text' in cleanup or 'raw' in cleanup.lower(), 'Cleanup safeguard missing raw-text handling'
          print('Static live publication contract passed.')
          PY

      - name: Verify rendered live experience
        run: |
          python -m pip install --disable-pip-version-check selenium
          python - <<'PY'
          import shutil, time
          from selenium import webdriver
          from selenium.webdriver.common.by import By
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.support.ui import WebDriverWait
          from selenium.webdriver.support import expected_conditions as EC

          BASE='https://lcaofimpossible.github.io/LCA-of-the-Impossible'
          opts=Options()
          opts.add_argument('--headless=new')
          opts.add_argument('--no-sandbox')
          opts.add_argument('--disable-dev-shm-usage')
          opts.add_argument('--window-size=1440,1200')
          binary = shutil.which('google-chrome') or shutil.which('chromium') or shutil.which('chromium-browser')
          if binary:
              opts.binary_location = binary
          driver=webdriver.Chrome(options=opts)
          wait=WebDriverWait(driver,20)
          try:
              driver.get(BASE + '/episodes/pegasus.html?render=1')
              wait.until(lambda d: 'Pegasus' in d.find_element(By.TAG_NAME,'body').text)
              wait.until(lambda d: 'View epic passport' in d.find_element(By.TAG_NAME,'body').text)
              body = driver.find_element(By.TAG_NAME,'body').text
              assert 'Evidence Profile' in body or 'EVIDENCE PROFILE' in body
              assert 'Related Cases' in body or 'RELATED CASES' in body
              assert 'Full archive' in body
              assert 'Raw text' not in body
              assert not driver.find_elements(By.CSS_SELECTOR, 'a[href$=".pdf"], a[href*="assets/pdf/episodes/"]')
              passport_links = [e for e in driver.find_elements(By.XPATH, "//*[contains(normalize-space(.), 'View epic passport')]") if e.is_displayed()]
              assert passport_links, 'View epic passport action is not visible'
              passport_links[0].click()
              wait.until(lambda d: 'Print / Save as PDF' in d.find_element(By.TAG_NAME,'body').text)
              body2 = driver.find_element(By.TAG_NAME,'body').text
              assert 'MODEL PASSPORT' in body2.upper()
              assert '5.51 kg CO₂e' in body2
              assert 'Print / Save as PDF' in body2
              assert 'Raw text' not in body2
              assert not driver.find_elements(By.CSS_SELECTOR, 'a[href$=".pdf"], a[href*="assets/pdf/episodes/"]')

              driver.set_window_size(390, 844)
              time.sleep(1)
              overflow = driver.execute_script('return document.documentElement.scrollWidth - document.documentElement.clientWidth')
              assert overflow <= 2, f'Episode mobile horizontal overflow: {overflow}px'

              driver.get(BASE + '/archive.html?render=1')
              search = wait.until(EC.presence_of_element_located((By.ID,'episode-search')))
              search.clear(); search.send_keys('Pegasus')
              wait.until(lambda d: 'Pegasus' in d.find_element(By.ID,'episode-grid').text)
              cards = driver.find_element(By.ID,'episode-grid')
              assert cards.find_elements(By.CSS_SELECTOR, 'img[src*="ep32-pegasus-cover.png"]'), 'Archive Pegasus card does not use approved cover'
              driver.set_window_size(390,844); time.sleep(0.5)
              overflow = driver.execute_script('return document.documentElement.scrollWidth - document.documentElement.clientWidth')
              assert overflow <= 2, f'Archive mobile horizontal overflow: {overflow}px'

              for path, token in [('/collections.html','Impossible Flight'),('/compare.html','Pegasus'),('/explore.html','Pegasus')]:
                  driver.get(BASE + path + '?render=1')
                  wait.until(lambda d, t=token: t in d.find_element(By.TAG_NAME,'body').text)
                  driver.set_window_size(390,844); time.sleep(0.4)
                  overflow = driver.execute_script('return document.documentElement.scrollWidth - document.documentElement.clientWidth')
                  assert overflow <= 2, f'{path} mobile horizontal overflow: {overflow}px'

              print('Rendered live experience passed.')
          finally:
              driver.quit()
          PY

      - name: Record final verification and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p verification
          cat > verification/ep32-live-verification.txt <<'EOF'
          Episode #32 — Pegasus · final live verification
          Date: 2026-08-21
          Approved cover SHA-256: 48ca70217d868843ddf8386155fb59fa4a137c5a603564325085a20548ec92aa
          Checks: exact live cover; registry; collections; sitemap; static SEO/social metadata; rendered Evidence Profile; Epic Model Passport; Passport-only actions; no source-PDF download; no Raw text; Archive search/card; Compare; Impact Map; mobile horizontal-overflow checks.
          Status: PASS
          EOF
          rm -f .github/workflows/ep32-live-verify.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Record Episode 32 final live verification"
          git pull --rebase origin main
          git push origin HEAD:main
