name: Episode 49 Live Verification

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  verify-live:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install browser verifier
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install chromium

      - name: Verify deployed GitHub Pages site
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json, time, urllib.request
          from datetime import datetime, timezone
          from playwright.sync_api import sync_playwright

          BASE = 'https://lcaofimpossible.github.io/LCA-of-the-Impossible/'
          EXPECTED_COVER_SHA256 = '498dd600f273e658e8ac3cc38d3a7396d2f4d8029147460cb8c1faf8ac728de6'

          def get_bytes(path):
              with urllib.request.urlopen(BASE + path, timeout=30) as r:
                  if r.status != 200:
                      raise RuntimeError(f'{path}: HTTP {r.status}')
                  return r.read()

          def wait_for_deploy():
              last = None
              for _ in range(18):
                  try:
                      html = get_bytes('episodes/the-argo.html').decode('utf-8')
                      registry = json.loads(get_bytes('episodes.json').decode('utf-8'))
                      if 'The Argo' in html and any(e.get('number') == 49 for e in registry.get('episodes', [])):
                          return
                  except Exception as exc:
                      last = exc
                  time.sleep(10)
              raise RuntimeError(f'Pages deployment did not become ready: {last}')

          wait_for_deploy()

          cover = get_bytes('assets/images/episodes/ep49-the-argo-cover.png')
          cover_sha = hashlib.sha256(cover).hexdigest()
          assert cover_sha == EXPECTED_COVER_SHA256, (cover_sha, EXPECTED_COVER_SHA256)

          registry = json.loads(get_bytes('episodes.json').decode('utf-8'))
          ep = next(e for e in registry['episodes'] if e.get('number') == 49)
          assert ep['slug'] == 'the-argo'
          assert ep['cover'] == 'assets/images/episodes/ep49-the-argo-cover.png'
          assert ep['result'] == '10.66 t CO₂e'
          assert ep['functionalUnit'].startswith('Build and equip one Argo-class')
          assert 'pdf' not in ep
          assert ep['evidence']['confidence'] in {'Low','Medium','High'}
          assert ep['evidence']['proxyDependence'] in {'Low','Medium','High'}
          assert ep['evidence']['assumptionSensitivity'] in {'Low','Medium','High'}

          sitemap = get_bytes('sitemap.xml').decode('utf-8')
          assert '/episodes/the-argo.html' in sitemap
          collections = json.loads(get_bytes('collections.json').decode('utf-8'))
          assert any(49 in c.get('episodes', []) for c in collections.get('collections', []))

          with sync_playwright() as p:
              browser = p.chromium.launch()
              page = browser.new_page(viewport={'width': 1440, 'height': 1000})
              page.goto(BASE + 'episodes/the-argo.html', wait_until='networkidle', timeout=60000)
              body = page.locator('body').inner_text()
              assert 'The Argo' in body
              assert '10.66 t CO₂e' in body
              assert 'Evidence Profile' in body
              assert 'View epic passport →' in body
              assert 'Print / Save as PDF' in body
              assert 'Raw text' not in body
              hrefs = page.locator('a').evaluate_all("els => els.map(e => e.getAttribute('href')).filter(Boolean)")
              assert not any('.pdf' in h.lower() or '/assets/pdf/' in h.lower() for h in hrefs)
              assert 'Flying Dutchman' in body and 'Trojan Horse' in body and 'Tower of Babel' in body

              for path in ['archive.html','collections.html','compare.html','explore.html']:
                  page.goto(BASE + path, wait_until='networkidle', timeout=60000)
                  assert 'The Argo' in page.locator('body').inner_text(), path

              page.set_viewport_size({'width': 390, 'height': 844})
              page.goto(BASE + 'episodes/the-argo.html', wait_until='networkidle', timeout=60000)
              assert page.evaluate('document.documentElement.scrollWidth <= document.documentElement.clientWidth + 1')
              browser.close()

          out = [
              'Episode #49 live verification: PASS',
              f'UTC: {datetime.now(timezone.utc).isoformat()}',
              f'Cover SHA-256: {cover_sha}',
              'Episode page: PASS',
              'Evidence Profile: PASS',
              'Epic Model Passport: PASS',
              'Passport actions: View epic passport + Print / Save as PDF only',
              'Raw text visible: NO',
              'Source PDF links: NO',
              'Archive: PASS',
              'Collections: PASS',
              'Compare: PASS',
              'Impact Map: PASS',
              'Mobile horizontal overflow: NO',
              'Registry/sitemap live: PASS',
          ]
          open('ep49-live-verification.txt','w',encoding='utf-8').write('\n'.join(out) + '\n')
          PY

      - name: Record successful live verification
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin main
          git add ep49-live-verification.txt
          git commit -m 'Record Episode 49 live verification'
          git push origin HEAD:main
