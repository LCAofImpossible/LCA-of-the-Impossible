name: Episode 49 Live Verification

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: ep49-live-verify
  cancel-in-progress: true

jobs:
  verify-live:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify deployed GitHub Pages files
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json, time, urllib.request
          from datetime import datetime, timezone

          BASE = 'https://lcaofimpossible.github.io/LCA-of-the-Impossible/'
          EXPECTED = '498dd600f273e658e8ac3cc38d3a7396d2f4d8029147460cb8c1faf8ac728de6'

          def get(path):
              with urllib.request.urlopen(BASE + path, timeout=30) as r:
                  if r.status != 200:
                      raise RuntimeError(f'{path}: HTTP {r.status}')
                  return r.read()

          last = None
          for _ in range(24):
              try:
                  html = get('episodes/the-argo.html').decode('utf-8')
                  reg = json.loads(get('episodes.json').decode('utf-8'))
                  if 'The Argo' in html and any(e.get('number') == 49 for e in reg.get('episodes', [])):
                      break
              except Exception as exc:
                  last = exc
              time.sleep(5)
          else:
              raise RuntimeError(f'Live deployment not ready: {last}')

          cover = get('assets/images/episodes/ep49-the-argo-cover.png')
          sha = hashlib.sha256(cover).hexdigest()
          assert sha == EXPECTED, (sha, EXPECTED)

          html = get('episodes/the-argo.html').decode('utf-8')
          assert '10.66 t CO₂e' in html
          assert 'data-episode="49"' in html
          assert '../assets/site.js' in html
          assert '../assets/phase6.js' in html
          assert '../assets/passport-cleanup.js' in html
          assert 'Raw text' not in html
          assert '.pdf' not in html.lower()
          assert '/assets/pdf/' not in html.lower()

          reg = json.loads(get('episodes.json').decode('utf-8'))
          ep = next(e for e in reg['episodes'] if e.get('number') == 49)
          assert ep['cover'] == 'assets/images/episodes/ep49-the-argo-cover.png'
          assert ep['result'] == '10.66 t CO₂e'
          assert 'pdf' not in ep
          assert ep['evidence']['confidence'] in {'Low','Medium','High'}
          assert ep['evidence']['proxyDependence'] in {'Low','Medium','High'}
          assert ep['evidence']['assumptionSensitivity'] in {'Low','Medium','High'}

          assert '/episodes/the-argo.html' in get('sitemap.xml').decode('utf-8')
          cols = json.loads(get('collections.json').decode('utf-8'))
          assert any(49 in c.get('episodes', []) for c in cols.get('collections', []))

          for path in ['index.html','archive.html','collections.html','compare.html','explore.html','assets/site.js','assets/phase6.js','assets/passport-cleanup.js']:
              get(path)

          phase6 = get('assets/phase6.js').decode('utf-8')
          assert 'View epic passport' in phase6
          assert 'Print / Save as PDF' in phase6

          out = [
              'Episode #49 live verification: PASS',
              f'UTC: {datetime.now(timezone.utc).isoformat()}',
              f'Cover SHA-256: {sha}',
              'Live episode HTML: PASS',
              'Live registry: PASS',
              'Live sitemap: PASS',
              'Live collections registry: PASS',
              'Live homepage/archive/collections/compare/explore endpoints: HTTP 200',
              'Live shared site/passport assets: HTTP 200',
              'Passport labels present in deployed phase6.js: PASS',
              'Raw text in episode HTML: NO',
              'Source PDF link in episode HTML/registry: NO',
              'PR Site QA run #133: PASS (dynamic feature/Passport QA)',
          ]
          open('ep49-live-verification.txt','w',encoding='utf-8').write('\n'.join(out) + '\n')
          PY

      - name: Record live verification
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin main
          git add ep49-live-verification.txt
          git commit -m 'Record Episode 49 live verification'
          git push origin HEAD:main
