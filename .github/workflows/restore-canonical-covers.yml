name: Restore canonical episode covers
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/restore-canonical-covers.yml'
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore proven cover assets into clean structure
        run: |
          set -euo pipefail
          git fetch origin backup-pre-cleanup-2026-08-14
          mkdir -p assets/images/episodes
          git show origin/backup-pre-cleanup-2026-08-14:assets/img/flying-dutchman-linkedin-live.webp > assets/images/episodes/ep35-flying-dutchman.webp
          git show origin/backup-pre-cleanup-2026-08-14:assets/img/tower-of-babel-linkedin-live.webp > assets/images/episodes/ep36-tower-of-babel.webp
          test -s assets/images/episodes/ep35-flying-dutchman.webp
          test -s assets/images/episodes/ep36-tower-of-babel.webp
          sed -i 's/ep35-flying-dutchman\.jpg/ep35-flying-dutchman.webp/g' index.html episodes/flying-dutchman.html
          sed -i 's/ep36-tower-of-babel\.jpg/ep36-tower-of-babel.webp/g' index.html episodes/tower-of-babel.html
          rm -f assets/images/episodes/ep35-flying-dutchman.jpg
          rm -f assets/images/episodes/ep36-tower-of-babel.jpg
          rm -f .github/workflows/restore-canonical-covers.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Restore canonical episode cover assets"
          git push
