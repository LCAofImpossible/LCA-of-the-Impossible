name: Episode 49 Registry Assembly

on:
  push:
    branches: [ep49-content]

permissions:
  contents: write

jobs:
  assemble:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ep49-content
          fetch-depth: 0

      - name: Verify and freeze approved cover
        shell: bash
        run: |
          set -euo pipefail
          SRC='assets/images/episodes/il_viaggio_dell_argo_impossibile.png'
          DST='assets/images/episodes/ep49-the-argo-cover.png'
          test -f "$SRC"
          test "$(git hash-object "$SRC")" = 'e76cc4e5793452dff351cdf0319e699946c45625'
          cp --preserve=mode,timestamps "$SRC" "$DST"
          test "$(git hash-object "$DST")" = 'e76cc4e5793452dff351cdf0319e699946c45625'
          rm "$SRC"

      - name: Register Episode 49
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('episodes.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          episode = {
            "number": 49,
            "slug": "the-argo",
            "title": "The Argo",
            "url": "episodes/the-argo.html",
            "cover": "assets/images/episodes/ep49-the-argo-cover.png",
            "categoryLabel": "Myth & Legend",
            "categories": ["mythology", "legends"],
            "lcaLabel": "Materials-driven",
            "lcaCharacteristics": ["materials-driven", "proxy-sensitive"],
            "result": "10.66 t CO₂e",
            "hotspot": "Sail + rigging contributes 50.2% of the baseline footprint; wood procurement contributes 41.7%.",
            "featuredDescription": "One 28.5 m Argo-class fifty-oared vessel and one Pagasae–Colchis–Pagasae expedition: 10.66 t CO₂e per build-and-voyage functional unit, with a conservative sail-and-rigging proxy dominating while direct propulsion uses no purchased fuel.",
            "functionalUnit": "Build and equip one Argo-class fifty-oared vessel and complete one Pagasae-Colchis-Pagasae expedition under oar and sail.",
            "evidence": {
              "confidence": "Medium",
              "proxyDependence": "High",
              "assumptionSensitivity": "Medium",
              "basis": "Argonautes 2008 provides the principal technical reconstruction for the 28.5 m vessel, 50 oars, 8 m mast and 55 m² sail. The approved episode freezes a 16.50 t wood reconstruction plus declared sail/rigging, minor-metal, stone-anchor and inbound-freight assumptions, then applies UK Government GHG Conversion Factors 2026 exact rows to the modeled physical flows.",
              "uncertainty": "The DEFRA Clothing factor used for woven sailcloth and natural-fibre rigging is explicitly the highest-uncertainty factor and drives 50.2% of baseline GWP. The reported wood-mass sensitivity spans 9.94–11.37 t CO₂e and the HGV-factor sensitivity spans 10.55–11.13 t CO₂e without overturning the hotspot story."
            },
            "keywords": ["argo", "argonauts", "argo-class vessel", "galley", "timber", "wood", "sail", "rigging", "oars", "Pagasae", "Colchis", "DEFRA 2026", "textile proxy", "freight", "mythology"],
            "related": [35, 38, 36]
          }
          eps = [e for e in data.get('episodes', []) if e.get('number') != 49]
          eps.append(episode)
          eps.sort(key=lambda e: e['number'], reverse=True)
          data['episodes'] = eps
          path.write_text(json.dumps(data, ensure_ascii=False, separators=(',', ':')), encoding='utf-8')
          PY

      - name: Commit registry and exact cover rename
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add episodes.json assets/images/episodes/ep49-the-argo-cover.png assets/images/episodes/il_viaggio_dell_argo_impossibile.png
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Register Episode 49 and freeze approved cover'
          git push origin HEAD:ep49-content
