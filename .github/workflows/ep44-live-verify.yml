name: Episode 44 Final QA and Live Verification

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: ep44-final-live-verify
  cancel-in-progress: true

jobs:
  finalize-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install QA dependencies
        run: python -m pip install --disable-pip-version-check pillow

      - name: Finalize Episode 44 registry policy
        shell: bash
        run: |
          git pull --rebase origin main
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('episodes.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          matches = [e for e in data.get('episodes', []) if e.get('number') == 44]
          if len(matches) != 1:
              raise SystemExit(f'Expected exactly one Episode 44 registry entry, found {len(matches)}')
          ep = matches[0]
          ep['coverAspectPolicy'] = 'approved-native'
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Run deterministic synchronization
        shell: bash
        run: |
          python scripts/apply_seo.py
          python scripts/feature_sync.py
          python scripts/engagement_sync.py
          python scripts/phase5_sync.py
          python scripts/phase6_sync.py
          python scripts/epic_passport_sync.py
          python scripts/telemetry_sync.py

      - name: Run full repository QA
        shell: bash
        run: |
          python scripts/site_qa.py
          python scripts/seo_qa.py
          python scripts/feature_qa.py
          python scripts/engagement_qa.py
          python scripts/phase5_qa.py
          python scripts/phase6_qa.py
          python scripts/telemetry_qa.py
          python - <<'PY'
          import hashlib, json
          from pathlib import Path

          EXPECTED_SHA256 = '3ac44495a975329821ced9ddcd8f73b1387073a689e67d17ee10052e62956f72'
          cover_path = Path('assets/images/episodes/ep44-wings-of-icarus-cover-20260821.png')
          cover = cover_path.read_bytes()
          assert hashlib.sha256(cover).hexdigest() == EXPECTED_SHA256

          reg = json.loads(Path('episodes.json').read_text(encoding='utf-8'))
          matches = [e for e in reg['episodes'] if e.get('number') == 44]
          assert len(matches) == 1
          ep = matches[0]
          assert ep['slug'] == 'wings-of-icarus'
          assert ep['cover'] == 'assets/images/episodes/ep44-wings-of-icarus-cover-20260821.png'
          assert ep['coverAspectPolicy'] == 'approved-native'
          assert ep['result'] == '70.4 kg CO₂e'
          assert ep['hotspot'] == 'Bindings + harness contribute 62.5 kg CO₂e, or 88.8% of the baseline footprint.'
          assert ep['functionalUnit'].startswith('One launch-ready wing pair on Crete')
          assert ep['evidence']['confidence'] == 'Medium'
          assert ep['evidence']['proxyDependence'] == 'High'
          assert ep['evidence']['assumptionSensitivity'] == 'High'
          assert ep['related'] == [52, 38, 37]
          assert 'pdf' not in ep
          assert not any('pdf' in e for e in reg['episodes'])

          page = Path('episodes/wings-of-icarus.html').read_text(encoding='utf-8')
          required = [
              'data-episode="44"', '70.4 kg CO₂e', '62.5 kg CO₂e', '88.8%',
              '53.0 kg CO₂e', '91.2 kg CO₂e', '8.32 kg CO₂e', '89.1 kg CO₂e',
              '../assets/images/episode-graphics/ep44-inventory-map.svg',
              '../assets/images/episode-graphics/ep44-technical-plate.svg',
              '../assets/images/episode-graphics/ep44-hotspot-breakdown.svg',
              '../assets/site.js', '../assets/phase6.js', '../assets/passport-cleanup.js',
              '../assets/engagement.js', '../assets/telemetry.js',
              '<meta name="viewport"', 'Skip to content', 'alt="Icarus inventory map',
              'inventory-table-wrap', 'application/ld+json', 'og:image', 'twitter:image'
          ]
          for needle in required:
              assert needle in page, needle
          assert 'Raw text' not in page
          assert 'download episode pdf' not in page.lower()
          assert 'assets/pdf/episodes/' not in page
          assert not Path('assets/pdf/episodes/ep44-wings-of-icarus.pdf').exists()

          cols = json.loads(Path('collections.json').read_text(encoding='utf-8'))
          legendary = next(c for c in cols['collections'] if c['slug'] == 'legendary-engineering')
          assert 44 in legendary['episodes']
          sitemap = Path('sitemap.xml').read_text(encoding='utf-8')
          assert sitemap.count('/episodes/wings-of-icarus.html') == 1
          PY

      - name: Commit synchronized final release
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add episodes.json collections.json index.html archive.html compare.html explore.html collections.html method.html sources.html about.html glossary.html episodes README.md sitemap.xml robots.txt site.webmanifest assets/favicon.svg
          if ! git diff --cached --quiet; then
            git commit -m 'Finalize Episode 44 publication metadata'
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo 'Episode 44 release files already synchronized.'
          fi

      - name: Verify deployed GitHub Pages release
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json, time, traceback, urllib.error, urllib.request
          from datetime import datetime, timezone

          BASE = 'https://lcaofimpossible.github.io/LCA-of-the-Impossible/'
          EXPECTED_SHA256 = '3ac44495a975329821ced9ddcd8f73b1387073a689e67d17ee10052e62956f72'
          lines = []

          def get(path):
              req = urllib.request.Request(BASE + path, headers={'Cache-Control':'no-cache','Pragma':'no-cache','User-Agent':'LCA-Episode-44-Final-QA'})
              with urllib.request.urlopen(req, timeout=30) as r:
                  if r.status != 200:
                      raise RuntimeError(f'{path}: HTTP {r.status}')
                  return r.read()

          try:
              last = None
              for _ in range(72):
                  try:
                      html = get('episodes/wings-of-icarus.html').decode('utf-8')
                      reg = json.loads(get('episodes.json').decode('utf-8'))
                      cols = json.loads(get('collections.json').decode('utf-8'))
                      ep = next((e for e in reg.get('episodes', []) if e.get('number') == 44), None)
                      legendary = next((c for c in cols.get('collections', []) if c.get('slug') == 'legendary-engineering'), None)
                      if ep and ep.get('coverAspectPolicy') == 'approved-native' and legendary and 44 in legendary.get('episodes', []) and 'The Wings of Icarus' in html:
                          break
                  except Exception as exc:
                      last = exc
                  time.sleep(5)
              else:
                  raise RuntimeError(f'Live deployment not ready after polling: {last}')

              cover = get('assets/images/episodes/ep44-wings-of-icarus-cover-20260821.png')
              live_sha = hashlib.sha256(cover).hexdigest()
              assert live_sha == EXPECTED_SHA256, (live_sha, EXPECTED_SHA256)

              html = get('episodes/wings-of-icarus.html').decode('utf-8')
              for needle in [
                  'data-episode="44"','70.4 kg CO₂e','62.5 kg CO₂e','88.8%',
                  '53.0 kg CO₂e','91.2 kg CO₂e','8.32 kg CO₂e','89.1 kg CO₂e',
                  '../assets/site.js','../assets/phase6.js','../assets/passport-cleanup.js',
                  '../assets/engagement.js','../assets/telemetry.js',
                  'rel="canonical" href="https://lcaofimpossible.github.io/LCA-of-the-Impossible/episodes/wings-of-icarus.html"',
                  'application/ld+json','og:image','twitter:image','<meta name="viewport"','Skip to content'
              ]:
                  assert needle in html, needle
              assert 'Raw text' not in html
              assert 'download episode pdf' not in html.lower()
              assert 'assets/pdf/episodes/' not in html

              reg = json.loads(get('episodes.json').decode('utf-8'))
              matches = [e for e in reg['episodes'] if e.get('number') == 44]
              assert len(matches) == 1
              ep = matches[0]
              assert ep['slug'] == 'wings-of-icarus'
              assert ep['cover'] == 'assets/images/episodes/ep44-wings-of-icarus-cover-20260821.png'
              assert ep['coverAspectPolicy'] == 'approved-native'
              assert ep['result'] == '70.4 kg CO₂e'
              assert ep['hotspot'] == 'Bindings + harness contribute 62.5 kg CO₂e, or 88.8% of the baseline footprint.'
              assert ep['functionalUnit'].startswith('One launch-ready wing pair on Crete')
              assert ep['related'] == [52,38,37]
              assert ep['evidence']['confidence'] == 'Medium'
              assert ep['evidence']['proxyDependence'] == 'High'
              assert ep['evidence']['assumptionSensitivity'] == 'High'
              assert 'pdf' not in ep
              assert not any('pdf' in e for e in reg['episodes'])

              cols = json.loads(get('collections.json').decode('utf-8'))
              legendary = next(c for c in cols['collections'] if c['slug'] == 'legendary-engineering')
              assert 44 in legendary['episodes']

              sitemap = get('sitemap.xml').decode('utf-8')
              assert sitemap.count('/episodes/wings-of-icarus.html') == 1

              endpoints = [
                  'index.html','archive.html','collections.html','compare.html','explore.html','method.html','sources.html','about.html','glossary.html',
                  'assets/site.js','assets/phase6.js','assets/passport-cleanup.js','assets/engagement.js','assets/telemetry.js',
                  'assets/style.css','assets/features.css','assets/engagement.css','assets/editorial.css','assets/phase6.css','assets/telemetry.css',
                  'assets/images/episode-graphics/ep44-inventory-map.svg',
                  'assets/images/episode-graphics/ep44-technical-plate.svg',
                  'assets/images/episode-graphics/ep44-hotspot-breakdown.svg'
              ]
              deployed = {path: get(path) for path in endpoints}

              phase6 = deployed['assets/phase6.js'].decode('utf-8')
              cleanup = deployed['assets/passport-cleanup.js'].decode('utf-8')
              sitejs = deployed['assets/site.js'].decode('utf-8')
              assert 'View epic passport →' in phase6
              assert 'Print / Save as PDF' in phase6
              assert 'allowedPassportActions' in cleanup
              assert "'view epic passport →'" in cleanup.lower()
              assert "'print / save as pdf'" in cleanup.lower()
              assert 'passport-raw' in cleanup and 'raw text' in cleanup.lower()
              assert 'Related Cases' in sitejs or 'RELATED CASES' in sitejs
              assert 'Previous' in sitejs and 'Next' in sitejs

              css = (deployed['assets/style.css'] + deployed['assets/features.css'] + deployed['assets/phase6.css']).decode('utf-8')
              compact = css.replace(' ', '').replace('\n','')
              assert '@media' in css and 'overflow-x' in css
              assert 'object-fit:contain' in compact

              try:
                  get('assets/pdf/episodes/ep44-wings-of-icarus.pdf')
                  raise AssertionError('Unexpected public source PDF exists for Episode 44')
              except urllib.error.HTTPError as exc:
                  assert exc.code == 404, exc.code

              lines = [
                  'Episode #44 final live verification: PASS',
                  f'UTC: {datetime.now(timezone.utc).isoformat()}',
                  f'Approved/live cover SHA-256: {live_sha}',
                  'Exact approved cover bytes live: PASS',
                  'Live episode HTML and canonical metadata: PASS',
                  'Numerical/source reconciliation: PASS',
                  'Live registry and Evidence Profile data: PASS',
                  'Live collections integration: PASS',
                  'Live sitemap: PASS',
                  'Homepage/Archive/Collections/Compare/Impact Map and editorial endpoints: HTTP 200',
                  'Inventory Map / Technical Plate / Hotspot Breakdown: HTTP 200',
                  'Epic Passport implementation and Passport-only cleanup: PASS',
                  'Related Cases and Previous/Next shared runtime present: PASS',
                  'Raw text export: ABSENT',
                  'Source PDF registry/link/file: ABSENT',
                  'Responsive/mobile CSS invariants: PASS',
                  'Accessibility structural invariants: PASS',
              ]
          except Exception:
              lines = [
                  'Episode #44 final live verification: FAIL',
                  f'UTC: {datetime.now(timezone.utc).isoformat()}',
                  traceback.format_exc(),
              ]

          open('ep44-live-verification.txt','w',encoding='utf-8').write('\n'.join(lines) + '\n')
          if lines[0].endswith('FAIL'):
              raise SystemExit(1)
          PY

      - name: Record final live verification
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin main
          git add ep44-live-verification.txt
          git commit -m 'Record Episode 44 final live verification'
          git push origin HEAD:main
