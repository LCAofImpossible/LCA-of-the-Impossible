name: Publish new web covers

on:
  push:
    branches: [main]
    paths:
      - '.cover-staging/READY'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decode covers and update catalogue
        run: |
          set -euo pipefail

          mkdir -p assets/images/episodes

          decode_cover() {
            prefix="$1"
            output="$2"
            cat .cover-staging/${prefix}.part* | tr -d '\n\r ' | base64 --decode > "$output"
            file "$output"
            test -s "$output"
          }

          decode_cover ep35 assets/images/episodes/ep35-flying-dutchman-web.jpg
          decode_cover ep36 assets/images/episodes/ep36-tower-of-babel-web.jpg
          decode_cover ep40 assets/images/episodes/ep40-minotaur-labyrinth-web.jpg
          decode_cover ep41 assets/images/episodes/ep41-mjolnir-web.jpg
          decode_cover ep42 assets/images/episodes/ep42-talos-web.jpg
          decode_cover ep43 assets/images/episodes/ep43-sisyphus-web.jpg

          python - <<'PY'
          from pathlib import Path
          import json

          registry_path = Path('episodes.json')
          registry = json.loads(registry_path.read_text(encoding='utf-8'))
          covers = {
              35: 'assets/images/episodes/ep35-flying-dutchman-web.jpg',
              36: 'assets/images/episodes/ep36-tower-of-babel-web.jpg',
              40: 'assets/images/episodes/ep40-minotaur-labyrinth-web.jpg',
              41: 'assets/images/episodes/ep41-mjolnir-web.jpg',
              42: 'assets/images/episodes/ep42-talos-web.jpg',
              43: 'assets/images/episodes/ep43-sisyphus-web.jpg',
          }
          for ep in registry['episodes']:
              if ep['number'] in covers:
                  ep['cover'] = covers[ep['number']]
          registry_path.write_text(json.dumps(registry, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          readme_path = Path('README.md')
          readme = readme_path.read_text(encoding='utf-8')

          old = '''### 4.1 Canonical-cover lock

When an approved PDF/carousel exists, extract or rasterize the exact approved cover and use it as the catalogue cover. Do not redraw, regenerate, reinterpret, restyle or substitute it unless the user explicitly requests a replacement.
'''
          new = '''### 4.1 Website catalogue-cover system

The website catalogue cover is a dedicated web editorial asset and is **not required to reproduce page 1 of the approved PDF**. The approved PDF remains the source of truth for episode content, while homepage and Archive use purpose-built covers optimized for the website.

For all new or refreshed catalogue covers:

- use a portrait **4:5** composition;
- use the shared dark charcoal / deep navy visual system;
- use crisp, high-contrast artwork with no deliberate blur;
- combine restrained mythic imagery with technical / blueprint overlays;
- keep one dominant subject and avoid decorative clutter;
- use off-white / stone typography, muted gold or bronze technical linework, and at most one episode-specific accent colour;
- include `LCA OF THE IMPOSSIBLE`, the episode number and the episode title;
- optionally include the principal LCA lens (`Materials-driven`, `Operation-driven`, `Energy-driven`, etc.);
- export a lightweight web image sized for catalogue cards while retaining enough resolution for sharp rendering on high-density mobile displays;
- store the asset as `assets/images/episodes/epNN-short-slug-web.jpg` unless another format is explicitly justified.

The website cover must remain visually consistent with the existing web-cover family. A PDF cover may still be used when explicitly requested, but it is no longer the default website-cover rule.
'''
          if old in readme:
              readme = readme.replace(old, new)
          else:
              marker = '### 4.2 Where covers are allowed'
              if marker in readme and '### 4.1 Website catalogue-cover system' not in readme:
                  readme = readme.replace(marker, new + '\n' + marker)

          readme = readme.replace(
              '1. If page 1 of the approved PDF contains the final cover, use that exact cover for homepage/archive.\n2. If the user explicitly approves a replacement, use that exact replacement.\n3. Only when no approved cover exists may a new cover be created.\n\nBefore publication, visually compare the catalogue cover with the approved source. Any mismatch is a homepage/archive publication blocker.',
              '1. Use the dedicated website catalogue cover defined by the web-cover system.\n2. Keep the PDF/carousel cover unchanged inside the approved PDF.\n3. When refreshing an old episode, create or approve a new web cover without altering the episode PDF.\n\nBefore publication, verify title, episode number, subject identity, 4:5 composition, sharpness and consistency with the current web-cover family. A mismatch in those elements is a homepage/archive publication blocker.'
          )

          readme_path.write_text(readme, encoding='utf-8')
          PY

          rm -rf .cover-staging
          rm -f .github/workflows/publish-new-web-covers.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish new website catalogue covers"
          git push
