name: Episode 51 Live Verification

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ep51-live-verify.yml'

permissions:
  contents: write

concurrency:
  group: ep51-live-final
  cancel-in-progress: true

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pillow selenium

      - name: Synchronization must be clean
        id: sync
        continue-on-error: true
        run: |
          python scripts/apply_seo.py
          python scripts/feature_sync.py
          python scripts/engagement_sync.py
          python scripts/phase5_sync.py
          python scripts/phase6_sync.py
          python scripts/epic_passport_sync.py
          git diff --exit-code

      - name: Structural QA
        id: site
        continue-on-error: true
        run: python scripts/site_qa.py
      - name: SEO QA
        id: seo
        continue-on-error: true
        run: python scripts/seo_qa.py
      - name: Phase 3 QA
        id: f3
        continue-on-error: true
        run: python scripts/feature_qa.py
      - name: Phase 4 QA
        id: f4
        continue-on-error: true
        run: python scripts/engagement_qa.py
      - name: Phase 5 QA
        id: f5
        continue-on-error: true
        run: python scripts/phase5_qa.py
      - name: Phase 6 QA
        id: f6
        continue-on-error: true
        run: python scripts/phase6_qa.py

      - name: Live static deployment verification
        id: static
        continue-on-error: true
        env:
          EXPECTED_COVER_SHA256: 469b45981a05b8379a25c9e6369b67d2158273252130a6686d45f8507873db92
        run: |
          python - <<'PY'
          import hashlib, json, os, time, urllib.request
          from io import BytesIO
          from PIL import Image
          base='https://lcaofimpossible.github.io/LCA-of-the-Impossible/'
          def get(path,binary=False):
              url=base+path+('?' if '?' not in path else '&')+'finalqa='+str(time.time_ns())
              req=urllib.request.Request(url,headers={'Cache-Control':'no-cache','User-Agent':'ep51-final-qa'})
              with urllib.request.urlopen(req,timeout=30) as r: data=r.read()
              return data if binary else data.decode('utf-8')
          last=None
          for i in range(30):
              try:
                  html=get('episodes/pandoras-jar.html')
                  reg=json.loads(get('episodes.json'))
                  col=json.loads(get('collections.json'))
                  sitemap=get('sitemap.xml')
                  cover=get('assets/images/episodes/ep51-pandoras-jar-cover.png',True)
                  assert "Pandora's Jar" in html and '26.0 kg CO₂e' in html
                  assert 'passport-cleanup.js?v=20260819-passport-cleanup2' in html
                  assert 'assets/pdf/episodes/' not in html and 'Raw text' not in html
                  assert all('pdf' not in e for e in reg['episodes'])
                  ep=next(e for e in reg['episodes'] if e['number']==51)
                  assert ep['cover']=='assets/images/episodes/ep51-pandoras-jar-cover.png'
                  assert ep['result']=='26.0 kg CO₂e'
                  assert ep['hotspot']=='Kiln energy and freight together account for 49.9% of the baseline footprint.'
                  assert sitemap.count('/episodes/pandoras-jar.html')==1
                  groups={c['slug']:c['episodes'] for c in col['collections']}
                  assert 51 in groups['legendary-engineering'] and 51 in groups['mythic-threat-control']
                  assert hashlib.sha256(cover).hexdigest()==os.environ['EXPECTED_COVER_SHA256']
                  with Image.open(BytesIO(cover)) as im:
                      assert im.size==(1122,1402)
                      assert abs(im.width/im.height-0.8)<0.012
                  print('Live static deployment verification passed.')
                  break
              except Exception as exc:
                  last=exc; print('not ready',i+1,exc); time.sleep(10)
          else: raise SystemExit(last)
          PY

      - name: Live discovery verification
        id: discovery
        continue-on-error: true
        run: |
          python - <<'PY'
          from selenium import webdriver
          from selenium.webdriver.support.ui import WebDriverWait
          import time
          base='https://lcaofimpossible.github.io/LCA-of-the-Impossible/'
          o=webdriver.ChromeOptions(); o.add_argument('--headless=new'); o.add_argument('--no-sandbox'); o.add_argument('--disable-dev-shm-usage'); o.add_argument('--window-size=1440,1000')
          d=webdriver.Chrome(options=o); w=WebDriverWait(d,30)
          try:
              for p in ['', 'archive.html','collections.html','compare.html','explore.html']:
                  d.get(base+p+'?finalqa='+str(time.time_ns()))
                  w.until(lambda x:x.execute_script('return document.readyState')=='complete')
                  w.until(lambda x:"Pandora's Jar" in x.page_source)
              print('Live discovery verification passed.')
          finally:d.quit()
          PY

      - name: Live Episode and Epic Passport verification
        id: episode
        continue-on-error: true
        run: |
          python - <<'PY'
          from selenium import webdriver
          from selenium.webdriver.common.by import By
          from selenium.webdriver.support.ui import WebDriverWait
          from selenium.webdriver.support import expected_conditions as EC
          import time
          base='https://lcaofimpossible.github.io/LCA-of-the-Impossible/episodes/pandoras-jar.html?finalqa='+str(time.time_ns())
          o=webdriver.ChromeOptions(); o.add_argument('--headless=new'); o.add_argument('--no-sandbox'); o.add_argument('--disable-dev-shm-usage'); o.add_argument('--window-size=1440,1000')
          d=webdriver.Chrome(options=o); w=WebDriverWait(d,30)
          try:
              d.get(base)
              w.until(EC.presence_of_element_located((By.ID,'evidence')))
              w.until(EC.presence_of_element_located((By.ID,'model-passport')))
              w.until(EC.presence_of_element_located((By.CSS_SELECTOR,'.related-section')))
              body=d.find_element(By.TAG_NAME,'body').text
              assert 'EVIDENCE PROFILE' in body and 'Related cases' in body
              assert 'Raw text' not in body and 'Download episode PDF' not in body
              w.until(lambda x:len([e for e in x.find_elements(By.CSS_SELECTOR,'#model-passport .passport-actions > *') if e.is_displayed()])==2)
              actions=[e.text.strip() for e in d.find_elements(By.CSS_SELECTOR,'#model-passport .passport-actions > *') if e.is_displayed()]
              assert actions==['View epic passport →','Print / Save as PDF'],actions
              cover=d.find_element(By.CSS_SELECTOR,'#model-passport .passport-preview-cover img')
              d.execute_script("arguments[0].scrollIntoView({block:'center'})",cover)
              w.until(lambda x:x.execute_script('return arguments[0].complete && arguments[0].naturalWidth>0',cover))
              dims=d.execute_script('return [arguments[0].naturalWidth,arguments[0].naturalHeight]',cover)
              assert dims==[1122,1402],dims
              d.find_element(By.CSS_SELECTOR,'#model-passport .passport-view').click()
              overlay=w.until(EC.visibility_of_element_located((By.CSS_SELECTOR,'.passport-overlay')))
              text=overlay.text
              assert '26.0 kg CO₂e' in text and 'Print / Save as PDF' in text and 'CANONICAL RECORD' in text
              assert 'Raw text' not in text and 'Download episode PDF' not in text
              print('Live Episode and Epic Passport verification passed.')
          finally:d.quit()
          PY

      - name: Live mobile verification
        id: mobile
        continue-on-error: true
        run: |
          python - <<'PY'
          from selenium import webdriver
          from selenium.webdriver.common.by import By
          from selenium.webdriver.support.ui import WebDriverWait
          from selenium.webdriver.support import expected_conditions as EC
          import time
          u='https://lcaofimpossible.github.io/LCA-of-the-Impossible/episodes/pandoras-jar.html?mobileqa='+str(time.time_ns())
          o=webdriver.ChromeOptions(); o.add_argument('--headless=new'); o.add_argument('--no-sandbox'); o.add_argument('--disable-dev-shm-usage'); o.add_argument('--window-size=390,844')
          d=webdriver.Chrome(options=o); w=WebDriverWait(d,30)
          try:
              d.get(u); w.until(EC.presence_of_element_located((By.ID,'model-passport')))
              overflow=d.execute_script('return document.documentElement.scrollWidth-document.documentElement.clientWidth')
              assert overflow<=2,overflow
              print('Live mobile verification passed.')
          finally:d.quit()
          PY

      - name: Finalize controlled publication verification
        if: always()
        env:
          SYNC: ${{ steps.sync.outcome }}
          SITE: ${{ steps.site.outcome }}
          SEO: ${{ steps.seo.outcome }}
          F3: ${{ steps.f3.outcome }}
          F4: ${{ steps.f4.outcome }}
          F5: ${{ steps.f5.outcome }}
          F6: ${{ steps.f6.outcome }}
          STATIC: ${{ steps.static.outcome }}
          DISC: ${{ steps.discovery.outcome }}
          EP: ${{ steps.episode.outcome }}
          MOB: ${{ steps.mobile.outcome }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          if [ "$SYNC" = success ] && [ "$SITE" = success ] && [ "$SEO" = success ] && [ "$F3" = success ] && [ "$F4" = success ] && [ "$F5" = success ] && [ "$F6" = success ] && [ "$STATIC" = success ] && [ "$DISC" = success ] && [ "$EP" = success ] && [ "$MOB" = success ]; then
            git rm -f .github/workflows/ep51-live-verify.yml .github/ep51-live-diagnostic.txt
            git commit -m "QA EP51: all publication checks passed; remove temporary verifier"
            git push origin HEAD:main
          else
            git commit --allow-empty -m "QA4 EP51: sync=${SYNC} site=${SITE} seo=${SEO} f3=${F3} f4=${F4} f5=${F5} f6=${F6} static=${STATIC} disc=${DISC} ep=${EP} mob=${MOB}"
            git push origin HEAD:main
            exit 1
          fi
