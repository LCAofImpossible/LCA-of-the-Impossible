name: Episode 51 Live Verification

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ep51-live-verify.yml'

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check selenium
      - name: Diagnose live Episode 51 DOM
        run: |
          python - <<'PY'
          from selenium import webdriver
          from selenium.webdriver.common.by import By
          from selenium.webdriver.support.ui import WebDriverWait
          import traceback, time

          base = 'https://lcaofimpossible.github.io/LCA-of-the-Impossible/episodes/pandoras-jar.html?diag=' + str(time.time_ns())
          opts = webdriver.ChromeOptions()
          opts.add_argument('--headless=new')
          opts.add_argument('--no-sandbox')
          opts.add_argument('--disable-dev-shm-usage')
          opts.add_argument('--window-size=1440,1000')
          driver = webdriver.Chrome(options=opts)
          wait = WebDriverWait(driver, 30)
          out = []
          try:
              driver.get(base)
              wait.until(lambda d: d.execute_script('return document.readyState') == 'complete')
              time.sleep(3)
              out.append('url=' + driver.current_url)
              out.append('scripts=' + repr(driver.execute_script("return Array.from(document.scripts).map(s=>s.src)")))
              out.append('evidence_count=' + str(len(driver.find_elements(By.ID, 'evidence'))))
              related = driver.find_elements(By.CSS_SELECTOR, '.related-section')
              out.append('related_count=' + str(len(related)))
              out.append('related_text=' + repr(related[0].text if related else ''))
              passports = driver.find_elements(By.ID, 'model-passport')
              out.append('passport_count=' + str(len(passports)))
              actions = driver.find_elements(By.CSS_SELECTOR, '#model-passport .passport-actions > *')
              out.append('actions_all=' + repr([(e.tag_name, e.text, e.is_displayed()) for e in actions]))
              cover = driver.find_elements(By.CSS_SELECTOR, '#model-passport .passport-preview-cover img')
              if cover:
                  out.append('cover_dims=' + repr(driver.execute_script('return [arguments[0].complete, arguments[0].naturalWidth, arguments[0].naturalHeight, arguments[0].src]', cover[0])))
              else:
                  out.append('cover_dims=MISSING')
              view = driver.find_elements(By.CSS_SELECTOR, '#model-passport .passport-view')
              out.append('view_count=' + str(len(view)))
              if view:
                  driver.execute_script('arguments[0].click()', view[0])
                  time.sleep(1)
                  overlays = driver.find_elements(By.CSS_SELECTOR, '.passport-overlay')
                  out.append('overlay_count=' + str(len(overlays)))
                  out.append('overlay_displayed=' + repr([e.is_displayed() for e in overlays]))
                  out.append('overlay_text=' + repr(overlays[0].text[:3000] if overlays else ''))
              out.append('body_has_raw=' + str('Raw text' in driver.find_element(By.TAG_NAME, 'body').text))
              out.append('body_has_pdf=' + str('Download episode PDF' in driver.find_element(By.TAG_NAME, 'body').text))
          except Exception:
              out.append('EXCEPTION=' + traceback.format_exc())
          finally:
              driver.quit()
          open('.github/ep51-live-diagnostic.txt','w',encoding='utf-8').write('\n'.join(out)+'\n')
          print('\n'.join(out))
          PY
      - name: Publish diagnostic
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/ep51-live-diagnostic.txt
          git commit -m "Diagnostic: Episode 51 live Passport DOM"
          git pull --rebase origin main
          git push origin HEAD:main
