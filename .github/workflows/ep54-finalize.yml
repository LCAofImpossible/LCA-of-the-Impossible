name: Finalize Episode 54

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ep54-finalize.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch staged Episode 54 text assets
        run: git fetch origin ep54-santas-sleigh-staging

      - name: Verify and normalize exact approved binary assets
        shell: bash
        run: |
          set -euo pipefail
          COVER_SRC='assets/images/episodes/file_0000000039b881f4b6998445c754bfe2.png'
          PDF_SRC='assets/pdf/episodes/LCA_of_the_Impossible_54_Santa_Sleigh_final_carousel-1.pdf'
          COVER_DST='assets/images/episodes/ep54-santas-sleigh-cover.png'
          PDF_DST='assets/pdf/episodes/ep54-santas-sleigh.pdf'
          echo '18dea5718a3b786d8def1c77eb4c971f7cea428b704a875f1e2be19c4ef2b1e5  '"$COVER_SRC" | sha256sum -c -
          echo '5c01e7118079372f8c2e69a563d949687eb572d304673493cd91ebea0f3d7f6c  '"$PDF_SRC" | sha256sum -c -
          cp "$COVER_SRC" "$COVER_DST"
          cp "$PDF_SRC" "$PDF_DST"
          echo '18dea5718a3b786d8def1c77eb4c971f7cea428b704a875f1e2be19c4ef2b1e5  '"$COVER_DST" | sha256sum -c -
          echo '5c01e7118079372f8c2e69a563d949687eb572d304673493cd91ebea0f3d7f6c  '"$PDF_DST" | sha256sum -c -
          rm "$COVER_SRC" "$PDF_SRC"

      - name: Bring staged Episode 54 page and analytical graphics into main
        shell: bash
        run: |
          set -euo pipefail
          git checkout origin/ep54-santas-sleigh-staging -- \
            episodes/santas-sleigh.html \
            assets/images/episode-graphics/ep54-inventory-map.svg \
            assets/images/episode-graphics/ep54-technical-plate.svg \
            assets/images/episode-graphics/ep54-hotspot-breakdown.svg

      - name: Register Episode 54 metadata, Evidence Profile, Related Cases and Collection
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          registry_path = Path('episodes.json')
          data = json.loads(registry_path.read_text(encoding='utf-8'))
          episodes = [e for e in data['episodes'] if e.get('number') != 54]
          episodes.append({
              'number': 54,
              'slug': 'santas-sleigh',
              'title': "Santa's Sleigh",
              'url': 'episodes/santas-sleigh.html',
              'cover': 'assets/images/episodes/ep54-santas-sleigh-cover.png',
              'categoryLabel': 'Myth & Legend',
              'categories': ['legends'],
              'lcaLabel': 'Operation-driven',
              'lcaCharacteristics': ['operation-driven', 'proxy-sensitive', 'lifetime-sensitive'],
              'result': '267 kg CO₂e',
              'hotspot': 'Reindeer forage contributes 177.7 kg CO₂e, or 67% of the baseline footprint.',
              'featuredDescription': 'A reusable 4.2 m sleigh reconstructed as a one-night delivery system: 267 kg CO₂e per Christmas Eve mission, with reindeer forage dominating the baseline and feeding-rate and harness assumptions controlling the main sensitivities.',
              'functionalUnit': 'One reusable airborne gift-delivery sleigh completing one Christmas Eve mission.',
              'evidence': {
                  'confidence': 'Medium',
                  'proxyDependence': 'High',
                  'assumptionSensitivity': 'High',
                  'basis': 'The approved episode uses a canonical eight-reindeer motive team and reconstructs one 4.2 m reusable sleigh with a 160 kg laminated-wood body, 40 kg steel runners and brackets, a 30 kg leather/textile harness and a twelve-mission lifetime. DEFRA 2026 is prioritized for physical material, forage and logistics flows, with declared modern proxies where no dedicated factor exists.',
                  'uncertainty': 'Feeding rate moves the total from 208 to 326 kg CO₂e, while changing the harness factor moves it from 211 to 351 kg CO₂e. Magic flight energy remains excluded rather than receiving an invented emission factor.'
              },
              'keywords': ['santa', "santa's sleigh", 'christmas eve', 'sleigh', 'reindeer', 'forage', 'harness', 'wood', 'steel', 'biological motive system', 'DEFRA 2026', 'proxy', 'lifetime allocation'],
              'related': [35, 42, 41],
              'pdf': 'assets/pdf/episodes/ep54-santas-sleigh.pdf'
          })
          data['episodes'] = sorted(episodes, key=lambda e: e['number'], reverse=True)
          registry_path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          collections_path = Path('collections.json')
          collections = json.loads(collections_path.read_text(encoding='utf-8'))
          target = next(c for c in collections['collections'] if c['slug'] == 'legendary-engineering')
          target['description'] = 'Objects that behave like engineered systems: legendary vehicles, forged weapons, autonomous guardians and machines built to solve impossible tasks.'
          target['episodes'] = [54] + [n for n in target['episodes'] if n != 54]
          collections_path.write_text(json.dumps(collections, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Install QA dependencies
        run: python -m pip install --disable-pip-version-check pillow

      - name: Synchronize SEO and feature metadata
        shell: bash
        run: |
          set -euo pipefail
          python scripts/apply_seo.py
          python scripts/feature_sync.py
          python scripts/engagement_sync.py

      - name: Run complete site QA
        shell: bash
        run: |
          set -euo pipefail
          python scripts/site_qa.py
          python scripts/seo_qa.py
          python scripts/feature_qa.py
          python scripts/engagement_qa.py

      - name: Remove one-shot finalizer and publish to main
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/ep54-finalize.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Publish Episode 54 Santa Sleigh'
          git pull --rebase origin main
          git push origin HEAD:main
          git push origin --delete ep54-santas-sleigh-staging || true
