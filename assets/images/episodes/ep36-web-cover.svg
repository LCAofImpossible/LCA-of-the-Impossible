  <path d="M346 464H466L450 406H362Z" class="subject"/>
  <path d="M371 406H448L435 355H384Z" class="subject"/>
  <path d="M394 355H432L425 320H401Z" class="subject"/>
  <path d="M235 700h314M270 631h244M302 562h186M336 498h132M362 438h88M384 382h51" class="subject2"/>
  <g class="subject2" opacity=".75">
