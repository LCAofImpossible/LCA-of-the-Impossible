<title id="title">LCA of the Impossible Episode 38 Trojan Horse cover</title>
<desc id="desc">Dark archaeological engineering cover with an engraved wooden Trojan Horse on wheels, technical construction circles and measurements, bronze and ivory typography, and a restrained green accent.</desc>
<defs>
