  </pattern>
  <pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(35)"><path d="M0 0V18" stroke="#d0a563" stroke-width="2" opacity=".18"/></pattern>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="14"/><feComponentTransfer><feFuncA type="linear" slope=".65"/></feComponentTransfer><feOffset dy="18"/></filter>
