<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1000" viewBox="0 0 800 1000" role="img" aria-label="LCA of the Impossible Episode 41 catalogue cover">
<defs>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M40 0H0V40" fill="none" stroke="#b78b55" stroke-width="0.7" opacity="0.10"/>
  </pattern>
  <filter id="paper" x="-20%" y="-20%" width="140%" height="140%">
    <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" seed="41" result="noise"/>
    <feColorMatrix in="noise" type="saturate" values="0" result="mono"/>
    <feComponentTransfer in="mono"><feFuncA type="table" tableValues="0 0.06"/></feComponentTransfer>
  </filter>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <style>
    .series{font-family:Georgia,'Times New Roman',serif;font-size:20px;letter-spacing:5px;fill:#c7ad83}
    .episode{font-family:Arial,sans-serif;font-size:15px;font-weight:600;letter-spacing:5px;fill:#53b9cf}
    .title{font-family:Georgia,'Times New Roman',serif;font-weight:400;letter-spacing:5px;fill:#ddd2bf}
    .micro{font-family:Arial,sans-serif;font-size:12px;letter-spacing:2px;fill:#9e8665}
    .lens{font-family:Georgia,'Times New Roman',serif;font-size:17px;font-style:italic;letter-spacing:4px;fill:#c7ad83}
    .tech{fill:none;stroke:#a77c45;stroke-width:1.2;opacity:.62}
    .tech2{fill:none;stroke:#c7ad83;stroke-width:1;opacity:.28}
    .accent{fill:none;stroke:#53b9cf;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
    .subject{fill:none;stroke:#d0c1a9;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    .subject2{fill:none;stroke:#9c8666;stroke-width:1.2;stroke-linecap:round;stroke-linejoin:round}
  </style>
</defs>
<rect width="800" height="1000" fill="#071015"/>
<rect width="800" height="1000" fill="url(#grid)"/>
<rect width="800" height="1000" fill="#fff" opacity="0.15" filter="url(#paper)"/>

<rect x="18" y="18" width="764" height="964" rx="2" fill="none" stroke="#9c7343" stroke-width="1.4"/>
<path d="M42 42h70M688 42h70M42 958h70M688 958h70" class="tech"/>
<circle cx="28" cy="28" r="8" class="tech"/><circle cx="772" cy="28" r="8" class="tech"/>
<circle cx="28" cy="972" r="8" class="tech"/><circle cx="772" cy="972" r="8" class="tech"/>
<path d="M400 18v24M388 30h24" class="tech"/>

<text x="400" y="72" text-anchor="middle" class="series">LCA OF THE IMPOSSIBLE</text>
<line x1="92" y1="66" x2="250" y2="66" class="tech"/><line x1="550" y1="66" x2="708" y2="66" class="tech"/>
<circle cx="260" cy="66" r="3" class="tech"/><circle cx="540" cy="66" r="3" class="tech"/>
<text x="400" y="116" text-anchor="middle" class="episode">EPISODE #41</text>
<line x1="340" y1="132" x2="386" y2="132" stroke="#53b9cf" opacity=".9"/><line x1="414" y1="132" x2="460" y2="132" stroke="#53b9cf" opacity=".9"/>
<rect x="396" y="128" width="8" height="8" transform="rotate(45 400 132)" fill="none" stroke="#53b9cf"/>
<text x="400" y="180" text-anchor="middle" class="title" font-size="68">MJÖLNIR</text>

<circle cx="390" cy="520" r="235" class="tech2"/><circle cx="390" cy="520" r="180" class="tech2"/>
<circle cx="390" cy="520" r="125" class="tech2"/>
<path d="M155 520h470M390 285v470" class="tech2"/>
<path d="M170 352A235 235 0 0 1 601 420" class="tech" stroke-dasharray="3 9"/>
<path d="M190 690A235 235 0 0 0 590 670" class="tech" stroke-dasharray="2 7"/>


<g>
  <rect x="300" y="555" width="210" height="122" rx="12" fill="#10191d" stroke="#d0c1a9" stroke-width="3"/>
  <path d="M315 570h180v92H315Z" class="subject2"/>
  <circle cx="405" cy="616" r="38" class="subject"/><path d="M382 628l23-40 23 40-23-14Z" class="subject"/>
  <path d="M385 555V348h42v207" class="subject"/>
  <path d="M383 365l44 34M383 403l44 34M383 441l44 34M383 479l44 34" class="subject2"/>
  <path d="M427 360q42 20 28 62q-8 26-36 34" class="subject2"/>
  <path d="M268 405l46 38-31 34 54 38-37 44" class="accent" filter="url(#glow)"/>
  <path d="M535 390l-38 48 32 27-49 48 41 37" class="accent" filter="url(#glow)"/>
  <path d="M340 690q65 24 130 0" class="tech"/>
</g>

<g transform="translate(58 690)">
  <text x="0" y="0" class="micro">CYCLE</text>
  <rect x="0" y="14" width="54" height="46" class="tech"/>
  <text x="27" y="48" text-anchor="middle" font-family="Georgia,serif" font-size="30" fill="#53b9cf">∞</text>
  <rect x="0" y="74" width="54" height="44" class="tech2"/>
  <path d="M0 74l54 44M54 74L0 118" class="tech2"/>
</g>

<g transform="translate(610 650)">
  <rect x="0" y="0" width="142" height="186" fill="#071015" opacity=".78" stroke="#9c7343"/>
  <text x="24" y="28" class="micro" fill="#c7ad83">SYSTEM LENS</text>
  <circle cx="72" cy="72" r="34" class="tech"/><circle cx="72" cy="72" r="20" class="tech2"/>
  <path d="M38 72h68M72 38v68" class="tech2"/>
  <path d="M72 72l25 -22" class="accent"/>
  <text x="634" y="690" class="micro" fill="#c7ad83">MASS</text><text x="634" y="718" class="micro" fill="#c7ad83">RETURN</text><text x="634" y="746" class="micro" fill="#c7ad83">DISCHARGE</text>
  <text x="24" y="166" class="micro">Σ FLOW × FACTOR</text>
</g>

<g transform="translate(400 895)">
  <circle cx="0" cy="0" r="20" fill="none" stroke="#a77c45"/>
  <path d="M0 -13L13 11H-13Z" fill="none" stroke="#c7ad83"/>
</g>
<line x1="250" y1="895" x2="365" y2="895" class="tech"/><line x1="435" y1="895" x2="550" y2="895" class="tech"/>
<text x="400" y="938" text-anchor="middle" class="lens">Energy-driven</text>
</svg>