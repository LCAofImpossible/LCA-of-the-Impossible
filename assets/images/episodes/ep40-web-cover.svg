<line x1="340" y1="132" x2="386" y2="132" stroke="#c7463c" opacity=".9"/><line x1="414" y1="132" x2="460" y2="132" stroke="#c7463c" opacity=".9"/>
<rect x="396" y="128" width="8" height="8" transform="rotate(45 400 132)" fill="none" stroke="#c7463c"/>
