<rect x="825" y="400" width="310" height="105" rx="13" class="panel"/>
<text x="850" y="433" class="m">MASS IN MOTION</text><text x="850" y="466" class="t">Horse 11.77 t + warriors 4.75 t</text><text x="850" y="491" class="g">16.52 t rolling total</text>
<rect x="825" y="525" width="310" height="120" rx="13" class="panel"/>
<text x="850" y="558" class="m">FORCE SCREENING</text><text x="850" y="590" class="t">rolling resistance 0.05 · slope 3%</text><text x="850" y="616" class="g">13.0 kN · 52 effective pullers</text>
<text x="65" y="681" class="m">Virgil reports wheels and hemp ropes. Screening confirms crowd-scale pulling is mechanically plausible;</text><text x="65" y="705" class="m">the four gate-threshold impacts described in the story remain unmodelled.</text>
