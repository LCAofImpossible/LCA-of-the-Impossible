<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">Trojan Horse technical reconstruction plate</title>
<desc id="desc">A schematic wooden horse with two internal crouched decks. The reconstruction is 12 metres high, 11 metres long and 4.5 metres wide, with 45 square metres of internal floor, 11.77 tonnes horse mass and 16.52 tonnes rolling mass including 50 equipped warriors.</desc>
<style>
.bg{fill:#071019}.shape{fill:#0d1b27;stroke:#d0a563;stroke-width:5}.inner{fill:#112232;stroke:#6de7ff;stroke-width:3}.wheel{fill:#0b1622;stroke:#d0a563;stroke-width:6}.ax{stroke:#d0a563;stroke-width:4}.dim{stroke:#6de7ff;stroke-width:2;fill:none}.guide{stroke:#234557;stroke-width:2;stroke-dasharray:7 7;fill:none}.h{font:700 28px ui-monospace,monospace;fill:#eef7fb}.t{font:500 19px ui-monospace,monospace;fill:#c4d4dc}.m{font:500 16px ui-monospace,monospace;fill:#9ab0bc}.k{font:700 19px ui-monospace,monospace;fill:#6de7ff}.g{font:700 19px ui-monospace,monospace;fill:#d0a563}.panel{fill:#0d1b27;stroke:#234557;stroke-width:2}
</style>
