<text x="205" y="405" transform="rotate(-90 205 405)" class="k">12 m OVERALL HEIGHT</text>
<line x1="330" y1="700" x2="790" y2="700" class="dim"/><line x1="330" y1="686" x2="330" y2="714" class="dim"/><line x1="790" y1="686" x2="790" y2="714" class="dim"/>
<text x="560" y="730" text-anchor="middle" class="k">11 m LENGTH · 4.5 m WIDTH</text>
<rect x="825" y="150" width="310" height="105" rx="13" class="panel"/>
<text x="850" y="183" class="m">INTERNAL FLOOR</text><text x="850" y="220" class="h">45 m²</text>
