<circle cx="422" cy="618" r="14" fill="#d0a563"/><circle cx="690" cy="618" r="14" fill="#d0a563"/>
<rect x="405" y="370" width="300" height="48" rx="7" class="inner"/>
<rect x="405" y="432" width="300" height="48" rx="7" class="inner"/>
