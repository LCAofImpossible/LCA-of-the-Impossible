<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">Hermes Sandals hotspot breakdown</title><desc id="desc">Gold leaf contributes 80.2 percent, leather 15.5 percent, feather textile 2.1 percent, bronze brass 1.1 percent and other flows 1.1 percent of the 63.5 kilogram carbon dioxide equivalent baseline.</desc>
<style>.bg{fill:#071019}.base{fill:#112232}.gold{fill:#d0a563}.cyan{fill:#6de7ff}.light{fill:#c4f7ff}.mutedbar{fill:#4b6775}.txt{font-family:Arial,sans-serif;fill:#eef7fb}.muted{font-family:Arial,sans-serif;fill:#9ab0bc}.ey{font-family:Arial,sans-serif;fill:#6de7ff;font-size:18;font-weight:bold;letter-spacing:2px}.h{font-size:30;font-weight:bold}.lab{font-size:21;font-weight:bold}.pct{font-size:20;font-weight:bold}.note{font-size:18}</style>
<rect class="bg" width="1200" height="720"/><text class="ey" x="55" y="58">HOTSPOT BREAKDOWN · EPISODE #52</text><text class="txt h" x="55" y="100">Two grams dominate the baseline</text><text class="muted note" x="55" y="132">63.5 kg CO₂e per delivered pair</text>
<g transform="translate(55,185)">
<text class="txt lab" x="0" y="20">Gold leaf</text><rect class="base" x="250" y="0" width="760" height="34" rx="8"/><rect class="gold" x="250" y="0" width="609.5" height="34" rx="8"/><text class="txt pct" x="1030" y="24">80.2%</text><text class="muted note" x="250" y="62">50.93 kg CO₂e · 0.3% of product mass</text>
<text class="txt lab" x="0" y="120">Leather body</text><rect class="base" x="250" y="100" width="760" height="34" rx="8"/><rect class="cyan" x="250" y="100" width="117.8" height="34" rx="8"/><text class="txt pct" x="1030" y="124">15.5%</text><text class="muted note" x="250" y="162">9.82 kg CO₂e</text>
<text class="txt lab" x="0" y="220">Feather / textile</text><rect class="base" x="250" y="200" width="760" height="34" rx="8"/><rect class="light" x="250" y="200" width="16.0" height="34" rx="8"/><text class="txt pct" x="1030" y="224">2.1%</text><text class="muted note" x="250" y="262">1.34 kg CO₂e</text>
<text class="txt lab" x="0" y="320">Bronze / brass</text><rect class="base" x="250" y="300" width="760" height="34" rx="8"/><rect class="mutedbar" x="250" y="300" width="8.4" height="34" rx="8"/><text class="txt pct" x="1030" y="324">1.1%</text><text class="muted note" x="250" y="362">0.688 kg CO₂e</text>
<text class="txt lab" x="0" y="420">Other</text><rect class="base" x="250" y="400" width="760" height="34" rx="8"/><rect class="mutedbar" x="250" y="400" width="8.4" height="34" rx="8"/><text class="txt pct" x="1030" y="424">1.1%</text><text class="muted note" x="250" y="462">Workshop + packaging + water + freight ≈0.73 kg CO₂e</text>
</g>
<rect x="55" y="660" width="1090" height="2" fill="#234557"/><text class="muted note" x="55" y="695">A tiny high-intensity input outweighs nearly everything else.</text>
</svg>
