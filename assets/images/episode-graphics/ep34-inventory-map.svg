<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">Solar Chariot of Elios inventory map</title>
<desc id="desc">Cradle-to-cut-off inventory showing gold and metal supply, wood and harness, chariot making, HGV freight, annual stabilisation electricity, 365 celestial journeys and annual refurbishment.</desc>
<defs><style>
.bg{fill:#071019}.panel{fill:#0d1b27;stroke:#234557;stroke-width:2}.gold{fill:#d0a563}.cyan{fill:#6de7ff}.txt{fill:#eef7fb;font:600 24px Arial,sans-serif}.muted{fill:#9ab0bc;font:18px Arial,sans-serif}.small{fill:#9ab0bc;font:15px Arial,sans-serif}.ey{fill:#6de7ff;font:700 15px Arial,sans-serif;letter-spacing:2px}.line{stroke:#6de7ff;stroke-width:3;fill:none}.dash{stroke:#d0a563;stroke-width:2;stroke-dasharray:8 9;fill:none}
</style><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#6de7ff"/></marker></defs>
<rect class="bg" width="1200" height="760"/><text class="ey" x="60" y="58">EP34 · INVENTORY MAP · PER FUNCTIONAL UNIT</text><text class="txt" x="60" y="98">One chariot · 365 dawn-to-dusk journeys</text>
<rect class="panel" x="60" y="150" width="250" height="120" rx="10"/><text class="gold" x="85" y="184" style="font:700 17px Arial">PRECIOUS MATERIAL</text><text class="txt" x="85" y="220">Gold · 120 kg</text><text class="small" x="85" y="247">radiant plating · global proxy</text>
<rect class="panel" x="60" y="300" width="250" height="120" rx="10"/><text class="cyan" x="85" y="334" style="font:700 17px Arial">BASE MATERIALS</text><text class="txt" x="85" y="370">Metals · 4,550 kg</text><text class="small" x="85" y="397">frame · cradle · shields</text>
<rect class="panel" x="60" y="450" width="250" height="120" rx="10"/><text class="cyan" x="85" y="484" style="font:700 17px Arial">SECONDARY MATERIALS</text><text class="txt" x="85" y="520">Wood 470 kg</text><text class="small" x="85" y="548">Harness proxy · 90 kg</text>
<rect class="panel" x="400" y="225" width="250" height="190" rx="10"/><text class="gold" x="425" y="260" style="font:700 17px Arial">CHARIOT MAKING</text><text class="txt" x="425" y="300">Cast · plate · yoke</text><text class="muted" x="425" y="334">Electricity total</text><text class="txt" x="425" y="368">141,360 kWh</text><text class="small" x="425" y="398">making + operation combined</text>
<path class="line" marker-end="url(#arrow)" d="M310 210 C350 210 360 270 400 285"/><path class="line" marker-end="url(#arrow)" d="M310 360 L400 330"/><path class="line" marker-end="url(#arrow)" d="M310 510 C350 510 360 390 400 370"/>
<rect class="panel" x="735" y="150" width="250" height="120" rx="10"/><text class="cyan" x="760" y="184" style="font:700 17px Arial">ASSEMBLY FREIGHT</text><text class="txt" x="760" y="220">2,970 t·km</text><text class="small" x="760" y="247">4.95 t × 600 km · HGV</text><path class="line" marker-end="url(#arrow)" d="M650 300 C690 300 690 225 735 215"/>
<rect class="panel" x="735" y="325" width="390" height="160" rx="10"/><text class="gold" x="760" y="360" style="font:700 17px Arial">CELESTIAL OPERATION</text><text class="txt" x="760" y="399">365 journeys · 12 h/day</text><text class="muted" x="760" y="432">32.0 kW control load</text><text class="txt" x="760" y="466">140,160 kWh/year</text><path class="line" marker-end="url(#arrow)" d="M650 350 L735 390"/>
<rect class="panel" x="735" y="540" width="390" height="100" rx="10"/><text class="cyan" x="760" y="575" style="font:700 17px Arial">CUT-OFF</text><text class="txt" x="760" y="610">Annual refurbishment after journey 365</text><path class="line" marker-end="url(#arrow)" d="M930 485 L930 540"/>
<path class="dash" d="M400 650 H60 V610"/><text class="small" x="60" y="686">EXCLUDED · creation of the Sun · creation of Elios · divine horse metabolism · end-of-life</text>
<text class="small" x="60" y="728">BOUNDARY · cradle-to-cut-off · vehicle system only · magic receives no invented fuel</text>
</svg>
