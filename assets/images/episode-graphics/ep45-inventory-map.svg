<text x="70" y="118" fill="#eef7fb" font-family="Arial,sans-serif" font-size="34" font-weight="700">THE CURSE BECOMES A SYSTEM</text>
<g font-family="Arial,sans-serif">
  <g transform="translate(70 170)"><rect width="330" height="92" rx="8" fill="#0d1b27" stroke="#6de7ff"/><text x="22" y="32" fill="#6de7ff" font-size="15" font-weight="700">PRIMARY GOLD</text><text x="22" y="64" fill="#eef7fb" font-size="24">0.622 kg Au</text></g>
  <g transform="translate(70 286)"><rect width="330" height="92" rx="8" fill="#0d1b27" stroke="#234557"/><text x="22" y="32" fill="#9ab0bc" font-size="15" font-weight="700">WOOD SUBSTRATE</text><text x="22" y="64" fill="#eef7fb" font-size="24">0.040 kg</text></g>
  <g transform="translate(70 402)"><rect width="330" height="92" rx="8" fill="#0d1b27" stroke="#234557"/><text x="22" y="32" fill="#9ab0bc" font-size="15" font-weight="700">WORKSHOP ELECTRICITY</text><text x="22" y="64" fill="#eef7fb" font-size="24">3.20 kWh</text></g>
  <g transform="translate(70 518)"><rect width="330" height="92" rx="8" fill="#0d1b27" stroke="#234557"/><text x="22" y="32" fill="#9ab0bc" font-size="15" font-weight="700">PROCESS WATER</text><text x="22" y="64" fill="#eef7fb" font-size="24">0.020 m³</text></g>
  <g transform="translate(800 170)"><rect width="330" height="92" rx="8" fill="#0d1b27" stroke="#234557"/><text x="22" y="32" fill="#9ab0bc" font-size="15" font-weight="700">PROTECTIVE WOOD CASE</text><text x="22" y="64" fill="#eef7fb" font-size="24">1.20 kg</text></g>
