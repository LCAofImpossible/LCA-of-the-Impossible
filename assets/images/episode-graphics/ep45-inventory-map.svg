<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">Episode 45 King Midas inventory map</title>
<desc id="desc">Primary gold, wooden substrate, workshop electricity, protective wooden case, road freight and process water flow into one touch-converted ceremonial goblet, ending at the palace boundary.</desc>
<rect width="1200" height="760" fill="#071019"/>
<g fill="none" stroke="#234557" stroke-width="2"><path d="M40 40H1160V720H40Z"/><path d="M70 80H1130"/><path d="M600 125V650" stroke-dasharray="6 10" opacity=".45"/></g>
