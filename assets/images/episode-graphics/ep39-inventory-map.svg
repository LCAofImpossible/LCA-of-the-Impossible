<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
<title id="title">Atlantis inventory map</title>
<desc id="desc">Diagram showing initial construction, material maintenance, water service and the excluded geophysical catastrophe over 100 years.</desc>
<rect width="720" height="420" rx="24" fill="#071423"/>
<rect x="20" y="20" width="680" height="380" rx="18" fill="none" stroke="#6de7ff" stroke-opacity="0.22"/>
<text x="40" y="58" fill="#c4f7ff" font-size="16" font-family="Arial, Helvetica, sans-serif" letter-spacing="2">INVENTORY MAP · EPISODE #39</text>
<text x="40" y="92" fill="#d0a563" font-size="32" font-weight="700" font-family="Arial, Helvetica, sans-serif">ATLANTIS</text>
<text x="40" y="118" fill="#9ab0bc" font-size="15" font-family="Arial, Helvetica, sans-serif">Royal-harbor core · construction + maintenance + 100 years water service</text>
<rect x="40" y="150" width="148" height="112" rx="14" fill="#0d1b27" stroke="#d0a563" stroke-opacity="0.58"/>
<text x="56" y="177" fill="#d0a563" font-size="13" font-weight="700" font-family="Arial, Helvetica, sans-serif">01 · CONSTRUCTION</text>
<text x="56" y="204" fill="#eef7fb" font-size="14" font-family="Arial, Helvetica, sans-serif">Buildings + walls</text>
<text x="56" y="226" fill="#eef7fb" font-size="14" font-family="Arial, Helvetica, sans-serif">temple + harbor works</text>
<text x="56" y="248" fill="#9ab0bc" font-size="13" font-family="Arial, Helvetica, sans-serif">2.114 Mt · 58.4%</text>
<rect x="210" y="150" width="148" height="112" rx="14" fill="#0d1b27" stroke="#6de7ff" stroke-opacity="0.55"/>
<text x="226" y="177" fill="#6de7ff" font-size="13" font-weight="700" font-family="Arial, Helvetica, sans-serif">02 · MAINTENANCE</text>
<text x="226" y="204" fill="#eef7fb" font-size="14" font-family="Arial, Helvetica, sans-serif">100-year material</text>
<text x="226" y="226" fill="#eef7fb" font-size="14" font-family="Arial, Helvetica, sans-serif">replacement scenario</text>
<text x="226" y="248" fill="#9ab0bc" font-size="13" font-family="Arial, Helvetica, sans-serif">0.512 Mt · 14.2%</text>
<rect x="380" y="150" width="148" height="112" rx="14" fill="#0d1b27" stroke="#2aa79e" stroke-opacity="0.72"/>
<text x="396" y="177" fill="#52d9d1" font-size="13" font-weight="700" font-family="Arial, Helvetica, sans-serif">03 · WATER</text>
<text x="396" y="204" fill="#eef7fb" font-size="14" font-family="Arial, Helvetica, sans-serif">2.74 billion m³</text>
<text x="396" y="226" fill="#eef7fb" font-size="14" font-family="Arial, Helvetica, sans-serif">supply + treatment</text>
<text x="396" y="248" fill="#9ab0bc" font-size="13" font-family="Arial, Helvetica, sans-serif">0.991 Mt · 27.4%</text>
<rect x="550" y="150" width="130" height="112" rx="14" fill="#0d1b27" stroke="#9ab0bc" stroke-opacity="0.35" stroke-dasharray="5 5"/>
<text x="566" y="177" fill="#9ab0bc" font-size="13" font-weight="700" font-family="Arial, Helvetica, sans-serif">04 · SINKING</text>
<text x="566" y="204" fill="#eef7fb" font-size="14" font-family="Arial, Helvetica, sans-serif">earthquake + flood</text>
<text x="566" y="226" fill="#eef7fb" font-size="14" font-family="Arial, Helvetica, sans-serif">geophysical event</text>
<text x="566" y="248" fill="#9ab0bc" font-size="13" font-family="Arial, Helvetica, sans-serif">excluded · 0 quantified</text>
<line x1="188" y1="206" x2="210" y2="206" stroke="#6de7ff" stroke-width="2"/>
<path d="M201 201 l9 5 -9 5" fill="none" stroke="#6de7ff" stroke-width="2"/>
<line x1="358" y1="206" x2="380" y2="206" stroke="#6de7ff" stroke-width="2"/>
<path d="M371 201 l9 5 -9 5" fill="none" stroke="#6de7ff" stroke-width="2"/>
<line x1="528" y1="206" x2="550" y2="206" stroke="#9ab0bc" stroke-width="1.5" stroke-dasharray="4 4"/>
<rect x="40" y="288" width="640" height="90" rx="14" fill="#081b2b" stroke="#d0a563" stroke-opacity="0.28"/>
<text x="58" y="316" fill="#d0a563" font-size="14" font-weight="700" font-family="Arial, Helvetica, sans-serif">FUNCTIONAL UNIT</text>
<text x="58" y="341" fill="#eef7fb" font-size="15" font-family="Arial, Helvetica, sans-serif">One royal-harbor core · 8.41 km² buildable land · 7.57 Mm² GFA · 500,000 residents · 100 years</text>
<text x="58" y="363" fill="#9ab0bc" font-size="14" font-family="Arial, Helvetica, sans-serif">26.4 Mm³ canal excavation disclosed, not carbonized · wider island and empire outside headline</text>
</svg>