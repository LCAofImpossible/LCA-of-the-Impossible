<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">Excalibur technical reconstruction plate</title>
<desc id="desc">Technical plate with sword dimensions, component masses, bloomery scaling and forty-year functional unit.</desc>
<rect width="1200" height="760" fill="#071019"/>
<g font-family="Inter,Arial,sans-serif">
  <text x="60" y="70" fill="#d0a563" font-size="24" letter-spacing="4">TECHNICAL PLATE</text>
  <text x="60" y="108" fill="#eef7fb" font-size="42" font-weight="700">One blade. Forty years.</text>
  <g transform="translate(95 155)">
    <line x1="300" y1="0" x2="300" y2="480" stroke="#6de7ff" stroke-width="2"/>
    <polygon points="300,0 270,360 330,360" fill="#112232" stroke="#c4f7ff" stroke-width="2"/>
    <rect x="220" y="360" width="160" height="16" rx="4" fill="#d0a563"/>
    <rect x="285" y="376" width="30" height="115" rx="10" fill="#112232" stroke="#c4f7ff" stroke-width="2"/>
    <circle cx="300" cy="500" r="18" fill="#d0a563"/>
    <line x1="120" y1="0" x2="120" y2="500" stroke="#234557" stroke-width="2"/><line x1="100" y1="0" x2="140" y2="0" stroke="#234557" stroke-width="2"/><line x1="100" y1="500" x2="140" y2="500" stroke="#234557" stroke-width="2"/>
    <text x="75" y="250" fill="#9ab0bc" font-size="20" transform="rotate(-90 75 250)">1,232 mm overall analogue</text>
    <text x="440" y="55" fill="#d0a563" font-size="18" font-weight="700">COMPONENT RECONSTRUCTION</text>
    <text x="440" y="96" fill="#eef7fb" font-size="22">Blade + guard + pommel</text><text x="760" y="96" fill="#c4f7ff" font-size="22" text-anchor="end">1.61 kg</text>
    <text x="440" y="132" fill="#eef7fb" font-size="22">Wood grip core</text><text x="760" y="132" fill="#c4f7ff" font-size="22" text-anchor="end">0.07 kg</text>
    <text x="440" y="168" fill="#eef7fb" font-size="22">Leather grip wrap</text><text x="760" y="168" fill="#c4f7ff" font-size="22" text-anchor="end">0.03 kg</text>
    <text x="440" y="204" fill="#eef7fb" font-size="22">Complete sword</text><text x="760" y="204" fill="#6de7ff" font-size="24" text-anchor="end" font-weight="700">1.71 kg</text>
    <line x1="440" y1="235" x2="770" y2="235" stroke="#234557"/>
    <text x="440" y="276" fill="#eef7fb" font-size="22">Original scabbard assembly</text><text x="760" y="276" fill="#c4f7ff" font-size="22" text-anchor="end">0.88 kg</text>
    <text x="440" y="312" fill="#eef7fb" font-size="22">Installed sword + scabbard</text><text x="760" y="312" fill="#6de7ff" font-size="24" text-anchor="end" font-weight="700">2.59 kg</text>
    <rect x="430" y="360" width="380" height="160" rx="10" fill="#0d1b27" stroke="#d0a563"/>
    <text x="455" y="396" fill="#d0a563" font-size="18" font-weight="700">EXPERIMENTAL BLOOMERY SCALE</text>
    <text x="455" y="431" fill="#eef7fb" font-size="21">43 kg ore + 73 kg charcoal → 1.85 kg billet</text>
    <text x="455" y="466" fill="#eef7fb" font-size="21">Scaled FU metal input → 45.6 kg ore</text>
    <text x="455" y="501" fill="#6de7ff" font-size="21" font-weight="700">Total charcoal over 40 years → 103.5 kg</text>
  </g>
  <g><rect x="870" y="170" width="260" height="150" rx="10" fill="#0d1b27" stroke="#d0a563"/><text x="1000" y="208" fill="#d0a563" font-size="18" text-anchor="middle" font-weight="700">FUNCTIONAL UNIT</text><text x="1000" y="248" fill="#eef7fb" font-size="32" text-anchor="middle" font-weight="700">40 YEARS</text><text x="1000" y="282" fill="#9ab0bc" font-size="18" text-anchor="middle">1 blade · 2 scabbards total</text></g>
  <g><rect x="870" y="360" width="260" height="150" rx="10" fill="#0d1b27" stroke="#6de7ff"/><text x="1000" y="398" fill="#6de7ff" font-size="18" text-anchor="middle" font-weight="700">FOREST EQUIVALENT</text><text x="1000" y="440" fill="#eef7fb" font-size="34" text-anchor="middle" font-weight="700">517 kg</text><text x="1000" y="474" fill="#9ab0bc" font-size="18" text-anchor="middle">dry wood at 20% yield</text></g>
  <g><rect x="870" y="550" width="260" height="110" rx="10" fill="#112232" stroke="#6de7ff"/><text x="1000" y="587" fill="#6de7ff" font-size="18" text-anchor="middle" font-weight="700">MAIN RESULT</text><text x="1000" y="630" fill="#eef7fb" font-size="34" text-anchor="middle" font-weight="700">73 kg CO₂e</text></g>
</g>
</svg>