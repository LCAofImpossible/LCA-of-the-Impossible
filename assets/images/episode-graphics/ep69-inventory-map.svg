<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
<title id="title">Valhalla inventory map</title>
<desc id="desc">Six emitting flows feed one first-muster-ready Valhalla structural shell: wood and timber products, iron and steel artefacts, stone aggregate foundation, construction electricity, material freight and one commissioning feast.</desc>
<rect width="1200" height="820" fill="#f2efe6"/>
<rect x="22" y="22" width="1156" height="776" rx="18" fill="none" stroke="#a58b47" stroke-width="2"/>
<g font-family="Arial,Helvetica,sans-serif" fill="#071019">
  <text x="70" y="82" font-size="22" font-weight="700" letter-spacing="4">EP69 // INVENTORY MAP</text>
  <text x="70" y="128" font-size="42" font-weight="800">SIX FLOWS BUILD THE FIRST MUSTER</text>
  <text x="70" y="162" font-size="18" fill="#4d5b53">One reconstructed structural shell · 540 gates · 432,000 einherjar</text>
</g>
<g stroke="#0b6b47" stroke-width="3" fill="none">
  <path d="M330 248 H474"/><path d="M330 370 H474"/><path d="M330 492 H474"/>
  <path d="M870 248 H726"/><path d="M870 370 H726"/><path d="M870 492 H726"/>
</g>
<g font-family="Arial,Helvetica,sans-serif">
  <rect x="474" y="204" width="252" height="366" rx="34" fill="#071019"/>
  <text x="600" y="252" text-anchor="middle" fill="#d8b34f" font-size="17" font-weight="700">VALHALLA</text>
  <text x="600" y="302" text-anchor="middle" fill="#fff" font-size="38" font-weight="800">FIRST MUSTER</text>
  <g transform="translate(514 338)" stroke="#d8b34f" fill="none">
    <path d="M12 154 V66 Q86 -6 172 66 V154" stroke-width="5"/>
    <path d="M34 154 V82 Q88 28 150 82 V154" stroke-width="3"/>
    <path d="M92 36 V154 M12 154 H172" stroke-width="3"/>
    <circle cx="92" cy="96" r="44" stroke="#6de7ff" stroke-width="3"/>
    <path d="M48 96 H136 M92 52 V140" stroke="#6de7ff" stroke-width="2"/>
  </g>
  <text x="600" y="534" text-anchor="middle" fill="#8fd0a9" font-size="17" font-weight="700">607.8 kt CO₂e</text>
</g>
<g font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#071019">
  <g><rect x="70" y="197" width="260" height="102" rx="12" fill="#fff" stroke="#b9b6a8"/><text x="92" y="229" fill="#0b6b47" font-weight="700">01 · TIMBER BODY</text><text x="92" y="260" font-weight="700">Wood and timber</text><text x="92" y="285">1,675,956.1 t</text></g>
  <g><rect x="70" y="319" width="260" height="102" rx="12" fill="#fff" stroke="#b9b6a8"/><text x="92" y="351" fill="#0b6b47" font-weight="700">02 · STEEL ARTEFACTS</text><text x="92" y="382" font-weight="700">Iron and steel</text><text x="92" y="407">28,683.1 t</text></g>
  <g><rect x="70" y="441" width="260" height="102" rx="12" fill="#fff" stroke="#b9b6a8"/><text x="92" y="473" fill="#0b6b47" font-weight="700">03 · FOUNDATION</text><text x="92" y="504" font-weight="700">Stone aggregate</text><text x="92" y="529">370,656.0 t</text></g>
  <g><rect x="870" y="197" width="260" height="102" rx="12" fill="#fff" stroke="#b9b6a8"/><text x="892" y="229" fill="#0b6b47" font-weight="700">04 · ASSEMBLY</text><text x="892" y="260" font-weight="700">Construction electricity</text><text x="892" y="285">88,957,440 kWh</text></g>
  <g><rect x="870" y="319" width="260" height="102" rx="12" fill="#fff" stroke="#b9b6a8"/><text x="892" y="351" fill="#0b6b47" font-weight="700">05 · LOGISTICS</text><text x="892" y="382" font-weight="700">Material freight</text><text x="892" y="407">415,162,714 t·km</text></g>
  <g><rect x="870" y="441" width="260" height="102" rx="12" fill="#fff" stroke="#b9b6a8"/><text x="892" y="473" fill="#0b6b47" font-weight="700">06 · COMMISSIONING</text><text x="892" y="504" font-weight="700">First feast</text><text x="892" y="529">518.4 t</text></g>
</g>
<g font-family="Arial,Helvetica,sans-serif">
  <rect x="70" y="626" width="1060" height="112" rx="14" fill="#071019"/>
  <text x="96" y="666" fill="#d8b34f" font-size="17" font-weight="700">BOUNDARY</text>
  <text x="96" y="706" fill="#fff" font-size="24" font-weight="800">CRADLE TO GATE · ONE FEAST · NO MAGIC SUPPLY</text>
  <text x="1104" y="706" text-anchor="end" fill="#8fd0a9" font-size="17">use, combat, resurrection and end-of-life excluded</text>
</g>
</svg>
