<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">UFO Robot hotspot breakdown</title>
  <desc id="desc">Operation contributes 88.9 percent of the approved 73.8 tonne carbon dioxide equivalent baseline, followed by base, craft, maintenance, consumables and end-of-life.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071019"/><stop offset="1" stop-color="#0d1b27"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#234557" stroke-width="1" opacity=".32"/></pattern>
  </defs>
  <rect width="1200" height="720" rx="20" fill="url(#bg)"/>
  <rect width="1200" height="720" rx="20" fill="url(#grid)"/>
  <rect x="28" y="28" width="1144" height="664" rx="14" fill="none" stroke="#d0a563" stroke-width="2"/>
  <text x="70" y="82" fill="#6de7ff" font-family="Arial, sans-serif" font-size="18" letter-spacing="4">S01 / EP01 / HOTSPOT BREAKDOWN</text>
  <text x="70" y="132" fill="#eef7fb" font-family="Georgia, serif" font-size="40">Use dominates.</text>
  <text x="70" y="168" fill="#9ab0bc" font-family="Arial, sans-serif" font-size="18">Source-rounded contribution shares of the 73.8 t CO₂e baseline</text>

  <g transform="translate(100 228)" font-family="Arial, sans-serif">
    <circle cx="190" cy="190" r="142" fill="none" stroke="#112232" stroke-width="58"/>
    <circle cx="190" cy="190" r="142" fill="none" stroke="#2a9fc4" stroke-width="58" stroke-dasharray="793 99" transform="rotate(-90 190 190)"/>
    <circle cx="190" cy="190" r="96" fill="#071019" stroke="#234557" stroke-width="2"/>
    <text x="190" y="176" text-anchor="middle" fill="#eef7fb" font-size="54" font-weight="700">73.8</text>
    <text x="190" y="209" text-anchor="middle" fill="#6de7ff" font-size="17" letter-spacing="2">t CO₂e / FU</text>
    <text x="190" y="242" text-anchor="middle" fill="#d0a563" font-size="16">88.9% USE</text>
  </g>

  <g transform="translate(520 225)" font-family="Arial, sans-serif">
    <g transform="translate(0 0)">
      <text x="0" y="18" fill="#eef7fb" font-size="20" font-weight="700">OPERATION</text><text x="600" y="18" text-anchor="end" fill="#6de7ff" font-size="21" font-weight="700">65.651 t · 88.9%</text>
      <rect y="35" width="600" height="28" rx="6" fill="#112232"/><rect y="35" width="533.4" height="28" rx="6" fill="#2a9fc4"/>
    </g>
    <g transform="translate(0 92)">
      <text x="0" y="18" fill="#eef7fb" font-size="20" font-weight="700">BASE</text><text x="600" y="18" text-anchor="end" fill="#d0a563" font-size="21" font-weight="700">3.788 t · 5.1%</text>
      <rect y="35" width="600" height="24" rx="6" fill="#112232"/><rect y="35" width="30.6" height="24" rx="6" fill="#d0a563"/>
    </g>
    <g transform="translate(0 180)">
      <text x="0" y="18" fill="#eef7fb" font-size="20" font-weight="700">CRAFT</text><text x="600" y="18" text-anchor="end" fill="#d0a563" font-size="21" font-weight="700">3.537 t · 4.8%</text>
      <rect y="35" width="600" height="24" rx="6" fill="#112232"/><rect y="35" width="28.8" height="24" rx="6" fill="#b28a47"/>
    </g>
    <g transform="translate(0 268)">
      <text x="0" y="18" fill="#eef7fb" font-size="20" font-weight="700">MAINTENANCE</text><text x="600" y="18" text-anchor="end" fill="#9ab0bc" font-size="21" font-weight="700">0.531 t · 0.7%</text>
      <rect y="35" width="600" height="20" rx="6" fill="#112232"/><rect y="35" width="8" height="20" rx="4" fill="#9ab0bc"/>
    </g>
    <g transform="translate(0 350)">
      <text x="0" y="18" fill="#eef7fb" font-size="20" font-weight="700">CONSUMABLES + EOL</text><text x="600" y="18" text-anchor="end" fill="#9ab0bc" font-size="21" font-weight="700">0.309 t · 0.4%</text>
      <rect y="35" width="600" height="20" rx="6" fill="#112232"/><rect y="35" width="6" height="20" rx="3" fill="#7f98a5"/>
    </g>
  </g>
  <g transform="translate(90 638)" font-family="Arial, sans-serif">
    <rect width="1020" height="44" rx="8" fill="#112232" stroke="#234557"/>
    <text x="510" y="28" text-anchor="middle" fill="#eef7fb" font-size="17">NON-ELECTRIC FLOOR · 7.82 t CO₂e PER MISSION</text>
  </g>
</svg>
