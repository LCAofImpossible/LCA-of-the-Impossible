<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">Yggdrasil inventory map</title>
<desc id="desc">Seven physical inventory flows feeding one installed world-tree analogue maintained for one narrative year.</desc>
<defs>
  <style>
    .bg{fill:#071019}.panel{fill:#0d1b27;stroke:#234557;stroke-width:2}.line{stroke:#6de7ff;stroke-width:3;fill:none}.goldline{stroke:#d0a563;stroke-width:3;fill:none}.muted{fill:#9ab0bc;font:20px Arial,sans-serif}.label{fill:#eef7fb;font:700 23px Arial,sans-serif}.small{fill:#9ab0bc;font:17px Arial,sans-serif}.value{fill:#c4f7ff;font:700 21px Arial,sans-serif}.gold{fill:#d0a563}.cyan{fill:#6de7ff}.head{fill:#eef7fb;font:700 34px Arial,sans-serif}.eyebrow{fill:#6de7ff;font:700 18px Arial,sans-serif;letter-spacing:3px}
  </style>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#6de7ff"/></marker>
  <marker id="arrowGold" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#d0a563"/></marker>
</defs>
<rect width="1200" height="760" class="bg"/>
<text x="60" y="58" class="eyebrow">EPISODE #48 · INVENTORY MAP</text>
<text x="60" y="105" class="head">A sacred tree still has a supply chain.</text>
<text x="60" y="138" class="muted">The boundary ends with the installed analogue operating at the end of year one.</text>

<g transform="translate(55 190)"><rect width="300" height="92" rx="12" class="panel"/><circle cx="28" cy="28" r="9" class="gold"/><text x="52" y="34" class="label">Ash-like wood body</text><text x="52" y="64" class="value">1,638 t</text><text x="52" y="84" class="small">hollow trunk + crown + roots</text></g>
<g transform="translate(55 302)"><rect width="300" height="92" rx="12" class="panel"/><text x="24" y="34" class="label">Metal supports</text><text x="24" y="64" class="value">45.0 t</text><text x="24" y="84" class="small">bands, anchors and pins</text></g>
<g transform="translate(55 414)"><rect width="300" height="92" rx="12" class="panel"/><text x="24" y="34" class="label">Concrete anchors</text><text x="24" y="64" class="value">180.0 t</text><text x="24" y="84" class="small">three root foundations + plinths</text></g>
<g transform="translate(55 526)"><rect width="300" height="92" rx="12" class="panel"/><text x="24" y="34" class="label">Root-zone compost</text><text x="24" y="64" class="value">40.0 t</text><text x="24" y="84" class="small">soil amendment</text></g>

<g transform="translate(845 210)"><rect width="300" height="92" rx="12" class="panel"/><text x="24" y="34" class="label">Electricity</text><text x="24" y="64" class="value">65,000 kWh</text><text x="24" y="84" class="small">workshop, lift and pumping</text></g>
<g transform="translate(845 342)"><rect width="300" height="92" rx="12" class="panel"/><text x="24" y="34" class="label">Irrigation water</text><text x="24" y="64" class="value">60,000 m³</text><text x="24" y="84" class="small">first-year root-zone watering</text></g>
<g transform="translate(845 474)"><rect width="300" height="108" rx="12" class="panel"/><text x="24" y="34" class="label">Road freight</text><text x="24" y="64" class="value">1,522,481 t·km</text><text x="24" y="86" class="small">1,903.1 t transported mass</text><text x="24" y="104" class="small">× 800 km</text></g>

<rect x="420" y="268" width="360" height="282" rx="20" fill="#112232" stroke="#d0a563" stroke-width="3"/>
<text x="600" y="312" text-anchor="middle" class="eyebrow" fill="#d0a563">FUNCTIONAL UNIT</text>
<text x="600" y="360" text-anchor="middle" class="label">One installed world-tree</text>
<text x="600" y="392" text-anchor="middle" class="label">analogue</text>
<line x1="475" y1="420" x2="725" y2="420" stroke="#234557" stroke-width="2"/>
<text x="600" y="460" text-anchor="middle" class="value">one narrative year</text>
<text x="600" y="492" text-anchor="middle" class="small">UK proxy · symbolic support</text>
<text x="600" y="520" text-anchor="middle" class="small">narrative LCA</text>

<path d="M355 236 C400 236 398 315 420 330" class="goldline" marker-end="url(#arrowGold)"/>
<path d="M355 348 C400 348 400 365 420 370" class="line" marker-end="url(#arrow)"/>
<path d="M355 460 C400 460 402 410 420 408" class="line" marker-end="url(#arrow)"/>
<path d="M355 572 C400 572 404 475 420 466" class="line" marker-end="url(#arrow)"/>
<path d="M845 256 C800 256 800 330 780 340" class="line" marker-end="url(#arrow)"/>
<path d="M845 388 C800 388 800 390 780 390" class="line" marker-end="url(#arrow)"/>
<path d="M845 528 C800 528 800 465 780 452" class="line" marker-end="url(#arrow)"/>

<rect x="410" y="596" width="380" height="78" rx="12" class="panel"/>
<text x="600" y="625" text-anchor="middle" class="label">Declared outside boundary</text>
<text x="600" y="652" text-anchor="middle" class="small">magic · realm holding · animals · ritual activity · biogenic credit · end of life</text>
<text x="60" y="718" class="small">The model counts only physical mass, energy and transport. No source flow is added beyond the approved episode.</text>
</svg>
