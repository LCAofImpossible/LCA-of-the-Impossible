<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
<title id="title">Augean Stables hotspot breakdown</title>
<desc id="desc">Earthmoving fuel contributes 71.7 percent, materials 18.1 percent and equipment mobilization 10.2 percent of the approved 181 tonne carbon dioxide equivalent baseline.</desc>
<rect width="1200" height="640" fill="#f2efe6"/>
<rect x="22" y="22" width="1156" height="596" rx="18" fill="none" stroke="#a58b47" stroke-width="2"/>
<g font-family="Arial,Helvetica,sans-serif">
  <text x="70" y="84" fill="#0b6b47" font-size="20" font-weight="700" letter-spacing="4">EP67 // HOTSPOT BREAKDOWN</text>
  <text x="70" y="134" fill="#071019" font-size="42" font-weight="800">THE CHANNEL IS THE FOOTPRINT</text>
  <text x="70" y="172" fill="#4d5b53" font-size="18">Approved baseline · 181 t CO₂e per completed campaign</text>
</g>
<g font-family="Arial,Helvetica,sans-serif">
  <rect x="72" y="232" width="1056" height="92" rx="10" fill="#d9ddd8"/>
  <rect x="72" y="232" width="757" height="92" rx="10" fill="#0b6b47"/>
  <rect x="829" y="232" width="191" height="92" fill="#b49a4b"/>
  <rect x="1020" y="232" width="108" height="92" rx="10" fill="#aeb9a9"/>
  <text x="98" y="288" fill="#fff" font-size="28" font-weight="800">71.7% EARTHMOVING FUEL</text>
  <g transform="translate(72 370)">
    <circle cx="12" cy="12" r="12" fill="#0b6b47"/><text x="42" y="19" fill="#071019" font-size="20" font-weight="700">Earthmoving fuel</text><text x="920" y="19" text-anchor="end" fill="#071019" font-size="20" font-weight="700">71.7%</text>
    <circle cx="12" cy="70" r="12" fill="#b49a4b"/><text x="42" y="77" fill="#071019" font-size="20" font-weight="700">Materials</text><text x="920" y="77" text-anchor="end" fill="#071019" font-size="20" font-weight="700">18.1%</text>
    <circle cx="12" cy="128" r="12" fill="#aeb9a9"/><text x="42" y="135" fill="#071019" font-size="20" font-weight="700">Equipment mobilization</text><text x="920" y="135" text-anchor="end" fill="#071019" font-size="20" font-weight="700">10.2%</text>
  </g>
  <rect x="72" y="542" width="1056" height="56" rx="10" fill="#071019"/>
  <text x="96" y="578" fill="#d8b34f" font-size="18" font-weight="700">DIESEL LEVER</text>
  <text x="270" y="578" fill="#fff" font-size="18">Every 1,000 L adds 3.19 t CO₂e at the average-blend factor.</text>
</g>
</svg>