<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">Santa's Sleigh technical plate</title><desc id="desc">Technical reconstruction of a 4.2 metre reusable sleigh with material masses, lifetime and eight-reindeer motive system.</desc>
<defs><style>.bg{fill:#071019}.p{fill:#0d1b27;stroke:#234557;stroke-width:2}.grid{stroke:#173342;stroke-width:1}.line{stroke:#d0a563;stroke-width:3;fill:none}.dim{stroke:#6de7ff;stroke-width:2;fill:none}.txt{fill:#eef7fb;font-family:Arial,sans-serif}.m{fill:#9ab0bc;font-family:Arial,sans-serif}.a{fill:#6de7ff;font-family:Arial,sans-serif}.g{fill:#d0a563;font-family:Arial,sans-serif}.l{font-size:20px;font-weight:700;letter-spacing:2px}.s{font-size:22px}.md{font-size:30px}.b{font-size:42px;font-weight:700}</style><marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6de7ff"/></marker></defs>
<rect class="bg" width="1200" height="760"/><g opacity=".55"><path d="M80 0V760M160 0V760M240 0V760M320 0V760M400 0V760M480 0V760M560 0V760M640 0V760M720 0V760M800 0V760M880 0V760M960 0V760M1040 0V760M1120 0V760" class="grid"/><path d="M0 80H1200M0 160H1200M0 240H1200M0 320H1200M0 400H1200M0 480H1200M0 560H1200M0 640H1200M0 720H1200" class="grid"/></g>
<text x="60" y="70" class="a l">TECHNICAL PLATE · CANONICAL RECONSTRUCTION</text><text x="60" y="120" class="txt b">SANTA'S SLEIGH</text>
<path d="M275 485 Q315 400 450 400 H710 Q785 400 830 340 Q855 310 885 335 Q900 348 886 372 Q850 438 780 485" class="line"/><path d="M255 500 Q520 555 860 500" class="line"/><path d="M300 520 q-38 72 18 106 q58 29 97-30" class="line"/><path d="M690 520 q-38 72 18 106 q58 29 97-30" class="line"/><path d="M440 402 Q470 317 580 315 Q685 316 720 402" class="line"/><path d="M420 405 Q500 455 737 405" class="line"/>
<path d="M255 255 H885" class="dim" marker-start="url(#arrow)" marker-end="url(#arrow)"/><path d="M255 270V240M885 270V240" class="dim"/><text x="570" y="240" text-anchor="middle" class="a md">4.2 m modeled length</text><path d="M955 315 V600" class="dim" marker-start="url(#arrow)" marker-end="url(#arrow)"/><text x="980" y="465" class="a md" transform="rotate(90 980 465)">1.55 m height</text>
<rect x="60" y="185" width="250" height="120" rx="10" class="p"/><text x="82" y="222" class="g l">BODY</text><text x="82" y="260" class="txt md">160 kg wood</text><text x="82" y="289" class="m s">laminated ash/oak-like</text>
<rect x="60" y="335" width="250" height="120" rx="10" class="p"/><text x="82" y="372" class="g l">RUNNERS</text><text x="82" y="410" class="txt md">40 kg steel</text><text x="82" y="439" class="m s">steel/metal proxy</text>
<rect x="890" y="185" width="250" height="120" rx="10" class="p"/><text x="912" y="222" class="g l">HARNESS</text><text x="912" y="260" class="txt md">30 kg</text><text x="912" y="289" class="m s">leather/textile proxy</text>
<rect x="890" y="610" width="250" height="100" rx="10" class="p"/><text x="912" y="647" class="g l">LIFETIME</text><text x="912" y="684" class="txt md">12 missions</text>
<g transform="translate(350,645)"><text x="0" y="0" class="g l">BIOLOGICAL MOTIVE SYSTEM</text><text x="0" y="34" class="txt md">8 reindeer · 48 kg forage / mission</text></g>
<text x="60" y="710" class="m s">Vehicle infrastructure is amortized across 12 Christmas missions; the one-night motive system is counted per mission.</text>
