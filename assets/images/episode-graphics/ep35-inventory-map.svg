<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900"><style>text{font-family:Arial,sans-serif}.t{fill:#eef7fb}.g{fill:#d0a563}.m{fill:#9ab0bc}.l{fill:none;stroke:#d0a563;stroke-width:2}.p{fill:#0b1622;stroke:#d0a563;stroke-width:1.5}</style><rect width="1200" height="900" fill="#071019"/><rect x="28" y="28" width="1144" height="844" rx="8" class="l" opacity=".5"/><text x="70" y="90" class="t" font-size="48" font-weight="800">INVENTORY MAP</text><text x="70" y="130" class="g" font-size="18" font-weight="700">THE FLYING DUTCHMAN — MAIN LIFE-CYCLE INPUTS</text><text x="70" y="175" class="m" font-size="14">Functional unit: one year of cursed navigation with full construction burden assigned</text><g transform="translate(600 500)" class="l"><circle r="220" opacity=".25"/><path d="M-175 95Q-75 150 125 110L165 50Q120 160-130 150Z"/><path d="M-100 90V-170M0 115V-220M100 90V-155"/><path d="M-100-145L-165-30L-100-48ZM-96-130L-22-35L-96-55ZM0-190L-78-55L0-70ZM4-175L82-50L4-72ZM100-130L38-35L100-52ZM104-118L155-32L104-50Z"/><path d="M-170 95H150M-150 120H135"/></g><text x="600" y="735" text-anchor="middle" class="g" font-size="17">BATAVIA-SCALE EAST INDIAMAN · ONE-YEAR CURSED VOYAGE</text><g font-size="16" font-weight="700" class="t"><rect x="55" y="245" width="330" height="92" rx="6" class="p"/><text x="80" y="280">STRUCTURAL TIMBER</text><text x="80" y="305" class="m" font-size="13" font-weight="400">Hull, deck, frames, masts and spars</text><rect x="55" y="355" width="330" height="92" rx="6" class="p"/><text x="80" y="390">SAILS &amp; SAILCLOTH</text><text x="80" y="415" class="m" font-size="13" font-weight="400">Canvas, stitching, sail plan + spares</text><rect x="55" y="465" width="330" height="92" rx="6" class="p"/><text x="80" y="500">CORDAGE &amp; RIGGING</text><text x="80" y="525" class="m" font-size="13" font-weight="400">Approx. 21 km of rope and rigging</text><rect x="55" y="575" width="330" height="92" rx="6" class="p"/><text x="80" y="610">PITCH / TAR</text><text x="80" y="635" class="m" font-size="13" font-weight="400">Waterproofing, sealing and treatment</text><rect x="815" y="245" width="330" height="92" rx="6" class="p"/><text x="840" y="280">IRON ARMAMENTS &amp; FITTINGS</text><text x="840" y="305" class="m" font-size="13" font-weight="400">Cannons, anchors, bolts + hardware</text><rect x="815" y="355" width="330" height="92" rx="6" class="p"/><text x="840" y="390">BALLAST &amp; PROVISIONS</text><text x="840" y="415" class="m" font-size="13" font-weight="400">Stone ballast and voyage stores</text><rect x="815" y="465" width="330" height="92" rx="6" class="p"/><text x="840" y="500">TRANSPORT &amp; SHIPYARD</text><text x="840" y="525" class="m" font-size="13" font-weight="400">Material transport and construction works</text><rect x="815" y="575" width="330" height="92" rx="6" class="p"/><text x="840" y="610">MAINTENANCE &amp; OPERATION</text><text x="840" y="635" class="m" font-size="13" font-weight="400">Repairs, upkeep and one cursed year</text></g><g class="l"><path d="M385 291H455M385 401H455M385 511H455M385 621H455M745 291H815M745 401H815M745 511H815M745 621H815"/></g></svg>