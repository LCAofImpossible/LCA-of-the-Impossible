  <text x="980" y="405" fill="#8fd0a9" font-size="20">120 m</text>
</g>
<g font-family="Arial,Helvetica,sans-serif">
  <rect x="70" y="185" width="200" height="395" rx="14" fill="#0d1b27" stroke="#6d5c36"/>
  <text x="94" y="222" fill="#d8b34f" font-size="17" font-weight="700">FROZEN GEOMETRY</text>
  <text x="94" y="264" fill="#9fa9a3" font-size="14">PLAN AREA</text><text x="94" y="291" fill="#fff" font-size="22" font-weight="700">36,000 m²</text>
  <text x="94" y="338" fill="#9fa9a3" font-size="14">WASTE DEPTH</text><text x="94" y="365" fill="#fff" font-size="22" font-weight="700">2.20 m</text>
  <text x="94" y="412" fill="#9fa9a3" font-size="14">INHERITED STOCK</text><text x="94" y="439" fill="#fff" font-size="22" font-weight="700">79,200 m³</text>
  <text x="94" y="486" fill="#9fa9a3" font-size="14">WET MASS</text><text x="94" y="513" fill="#fff" font-size="22" font-weight="700">51,480 t</text>
  <text x="94" y="550" fill="#9fa9a3" font-size="14">EARTHWORKS</text><text x="94" y="577" fill="#fff" font-size="22" font-weight="700">52,500 m³</text>
