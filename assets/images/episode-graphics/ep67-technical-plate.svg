    <path d="M115 -80 V0"/><path d="M495 -80 V0"/><path d="M115 300 V385"/><path d="M495 300 V385"/>
  </g>
  <g fill="#6fbc91">
    <polygon points="115,-92 102,-70 128,-70"/><polygon points="495,-92 482,-70 508,-70"/>
    <polygon points="305,400 292,378 318,378"/>
  </g>
  <path d="M115 385 H495" stroke="#6fbc91" stroke-width="8"/><path d="M305 385 V455" stroke="#6fbc91" stroke-width="8"/>
  <text x="305" y="290" text-anchor="middle" fill="#f5f0e6" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700">STABLE YARD</text>
</g>
<g stroke="#6fbc91" stroke-width="3" fill="none">
  <line x1="300" y1="595" x2="910" y2="595"/><line x1="300" y1="580" x2="300" y2="610"/><line x1="910" y1="580" x2="910" y2="610"/>
  <line x1="945" y1="250" x2="945" y2="550"/><line x1="930" y1="250" x2="960" y2="250"/><line x1="930" y1="550" x2="960" y2="550"/>
</g>
<g font-family="Arial,Helvetica,sans-serif" font-weight="700">
