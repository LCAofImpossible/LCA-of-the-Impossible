<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
<title id="title">Augean Stables technical plate</title>
<desc id="desc">Frozen engineering reconstruction: 300 by 120 metre stable plan, 2.20 metre waste depth, 79,200 cubic metres inherited stock, 51,480 tonne wet mass, 52,500 cubic metres earthworks, two river intakes, one outlet and an eight-hour 100 cubic metre per second release.</desc>
<rect width="1200" height="820" fill="#071019"/>
<rect x="24" y="24" width="1152" height="772" rx="18" fill="none" stroke="#a58b47" stroke-width="2"/>
<g font-family="Arial,Helvetica,sans-serif">
  <text x="70" y="82" fill="#d8b34f" font-size="22" font-weight="700" letter-spacing="4">EP67 // TECHNICAL PLATE</text>
  <text x="70" y="128" fill="#f5f0e6" font-size="42" font-weight="800">FROZEN GEOMETRY BEFORE THE WASH</text>
</g>
