  <text x="70" y="128" fill="#f5f0e6" font-size="42" font-weight="800">THE VESSEL IS THE MACHINE</text>
</g>
<g stroke="#6d5c36" stroke-width="1" opacity="0.65" fill="none">
  <circle cx="610" cy="445" r="272"/><circle cx="610" cy="445" r="205"/>
  <line x1="300" y1="445" x2="930" y2="445"/><line x1="610" y1="175" x2="610" y2="715"/>
</g>
