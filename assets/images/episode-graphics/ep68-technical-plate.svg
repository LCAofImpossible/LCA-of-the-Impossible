<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
<title id="title">Jars of the Danaids technical plate</title>
<desc id="desc">Frozen vessel reconstruction showing an ovoid three-handled hydria, 0.54 metre assumed height, 3.2 kilogram dry mass, 50-vessel set, three-year life and the 80 percent jar-loss relationship between 3,650 cubic metres per year of managed water and a 730 cubic metre target attempt.</desc>
<rect width="1200" height="820" fill="#071019"/>
<rect x="24" y="24" width="1152" height="772" rx="18" fill="none" stroke="#a58b47" stroke-width="2"/>
