  <g fill="#071019" stroke="#8fd0a9" stroke-width="2"><circle cx="126" cy="337" r="7"/><circle cx="157" cy="352" r="7"/><circle cx="200" cy="358" r="7"/><circle cx="243" cy="352" r="7"/><circle cx="274" cy="337" r="7"/></g>
  <g stroke="#6de7ff" stroke-width="4" fill="none"><path d="M126 346 V403"/><path d="M157 361 V419"/><path d="M200 367 V430"/><path d="M243 361 V419"/><path d="M274 346 V403"/></g>
</g>
<g stroke="#6fbc91" stroke-width="3" fill="none">
