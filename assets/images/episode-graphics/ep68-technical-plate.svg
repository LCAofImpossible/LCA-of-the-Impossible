  <text x="610" y="702" text-anchor="middle" fill="#8fd0a9" font-size="20">OVOID CERAMIC HYDRIA · THREE HANDLES</text>
</g>
<g font-family="Arial,Helvetica,sans-serif">
  <rect x="70" y="190" width="235" height="354" rx="14" fill="#0d1b27" stroke="#6d5c36"/>
  <text x="94" y="226" fill="#d8b34f" font-size="17" font-weight="700">FROZEN SET</text>
