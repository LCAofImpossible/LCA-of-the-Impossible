<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900"><style>text{font-family:Arial,sans-serif}.t{fill:#eef7fb}.g{fill:#d0a563}.m{fill:#9ab0bc}.l{fill:none;stroke:#d0a563;stroke-width:2}.p{fill:#0b1622;stroke:#d0a563;stroke-width:1.5}</style><rect width="1200" height="900" fill="#071019"/><rect x="28" y="28" width="1144" height="844" rx="8" class="l" opacity=".5"/><text x="70" y="90" class="t" font-size="48" font-weight="800">INVENTORY MAP</text><text x="70" y="130" class="g" font-size="18" font-weight="700">TOWER OF BABEL — MAIN LIFE-CYCLE INPUTS</text><text x="70" y="175" class="m" font-size="14">Functional unit: one completed 90 m tower operated for one year</text><g transform="translate(600 500)" class="l"><circle r="220" opacity=".25"/><path d="M-180 165H180L150 105H-150ZM-150 105H150L120 45H-120ZM-120 45H120L92-15H-92ZM-92-15H92L65-75H-65ZM-65-75H65L40-135H-40ZM-40-135H40L22-195H-22Z"/><path d="M-32 165L-12 105L-8 45L-5-15L-3-75L0-135M32 165L12 105L8 45L5-15L3-75L0-135"/></g><text x="600" y="735" text-anchor="middle" class="g" font-size="17">90 × 90 m BASE · 90 m HEIGHT · 7 LEVELS</text><g font-size="16" font-weight="700" class="t"><rect x="55" y="245" width="330" height="92" rx="6" class="p"/><text x="80" y="280">SUN-DRIED MUDBRICK CORE</text><text x="80" y="305" class="m" font-size="13" font-weight="400">Local clay, sand, water · manual production</text><rect x="55" y="355" width="330" height="92" rx="6" class="p"/><text x="80" y="390">FIRED-BRICK FACING</text><text x="80" y="415" class="m" font-size="13" font-weight="400">Clay + kiln fuel · dominant climate hotspot</text><rect x="55" y="465" width="330" height="92" rx="6" class="p"/><text x="80" y="500">BITUMEN MORTAR</text><text x="80" y="525" class="m" font-size="13" font-weight="400">Natural bitumen + sand</text><rect x="55" y="575" width="330" height="92" rx="6" class="p"/><text x="80" y="610">IMPORTED TIMBER</text><text x="80" y="635" class="m" font-size="13" font-weight="400">Cedar and structural wood</text><rect x="815" y="245" width="330" height="92" rx="6" class="p"/><text x="840" y="280">MINOR METAL FITTINGS</text><text x="840" y="305" class="m" font-size="13" font-weight="400">Tools, straps and fittings</text><rect x="815" y="355" width="330" height="92" rx="6" class="p"/><text x="840" y="390">TRANSPORT</text><text x="840" y="415" class="m" font-size="13" font-weight="400">Road + river movement of materials</text><rect x="815" y="465" width="330" height="92" rx="6" class="p"/><text x="840" y="500">CONSTRUCTION FIRES</text><text x="840" y="525" class="m" font-size="13" font-weight="400">Wood combustion for site activities</text><rect x="815" y="575" width="330" height="92" rx="6" class="p"/><text x="840" y="610">ANNUAL MAINTENANCE</text><text x="840" y="635" class="m" font-size="13" font-weight="400">Repair materials + one operating year</text></g><g class="l"><path d="M385 291H455M385 401H455M385 511H455M385 621H455M745 291H815M745 401H815M745 511H815M745 621H815"/></g></svg>