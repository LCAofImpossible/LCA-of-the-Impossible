  <text x="70" y="584" class="gold label">CONSTRUCTION MODEL</text>
  <text x="70" y="610" class="muted small">Material procurement + inbound freight · hand assembly adds no purchased energy</text>
  <text x="70" y="700" class="muted tiny">Sources: approved Episode #49 · Argonautes 2008; wood-mass reconstruction A-04 benchmarked against Olympias literature; construction logic also cites Mark 1991.</text>
