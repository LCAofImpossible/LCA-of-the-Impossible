<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">The Argo technical reconstruction plate</title>
  <desc id="desc">Blueprint-style technical plate for the Argo showing 28.5 metre overall length, 4.20 metre beam, 1.95 metre external height, 8 metre mast, fifty 4.75 metre oars, 55 square metre sail, 16.50 tonne wood reconstruction and 17.49 tonne total modeled materials.</desc>
