<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">Santa's Sleigh inventory map</title><desc id="desc">Main material, biological and logistics flows feeding one Christmas Eve sleigh mission.</desc>
<defs><style>.bg{fill:#071019}.panel{fill:#0d1b27;stroke:#234557;stroke-width:2}.line{stroke:#6de7ff;stroke-width:3;fill:none}.gold{stroke:#d0a563;stroke-width:2;fill:none}.txt{fill:#eef7fb;font-family:Arial,sans-serif}.muted{fill:#9ab0bc;font-family:Arial,sans-serif}.accent{fill:#6de7ff;font-family:Arial,sans-serif}.g{fill:#d0a563;font-family:Arial,sans-serif}.small{font-size:22px}.med{font-size:28px}.big{font-size:42px;font-weight:700}.label{font-size:20px;font-weight:700;letter-spacing:2px}</style><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6de7ff"/></marker></defs>
<rect class="bg" width="1200" height="760"/><rect x="28" y="28" width="1144" height="704" rx="18" class="panel"/>
<text x="70" y="88" class="accent label">INVENTORY MAP · EPISODE #54</text><text x="70" y="142" class="txt big">ONE CHRISTMAS EVE MISSION</text><text x="70" y="182" class="muted small">Reference flow: 1/12 sleigh system + one-night reindeer motive system + staging support</text>
<rect x="70" y="245" width="250" height="105" rx="12" class="panel"/><text x="92" y="282" class="g label">SLEIGH BODY</text><text x="92" y="316" class="txt med">160 kg wood</text><text x="92" y="340" class="muted small">12-mission allocation</text>
<rect x="70" y="380" width="250" height="105" rx="12" class="panel"/><text x="92" y="417" class="g label">METALS + FINISH</text><text x="92" y="451" class="txt med">48 kg + 5 kg</text><text x="92" y="475" class="muted small">runners, fittings, finish</text>
<rect x="70" y="515" width="250" height="105" rx="12" class="panel"/><text x="92" y="552" class="g label">HARNESS</text><text x="92" y="586" class="txt med">30 kg</text><text x="92" y="610" class="muted small">leather/textile proxy</text>
<rect x="880" y="245" width="250" height="105" rx="12" class="panel"/><text x="902" y="282" class="g label">REINDEER FORAGE</text><text x="902" y="316" class="txt med">48 kg</text><text x="902" y="340" class="muted small">8 × 6 kg/head/day</text>
<rect x="880" y="380" width="250" height="105" rx="12" class="panel"/><text x="902" y="417" class="g label">ANNUAL REPAIR</text><text x="902" y="451" class="txt med">6 kg</text><text x="902" y="475" class="muted small">maintenance flow</text>
<rect x="880" y="515" width="250" height="105" rx="12" class="panel"/><text x="902" y="552" class="g label">STAGING SUPPORT</text><text x="902" y="586" class="txt med">30 km van</text><text x="902" y="610" class="muted small">local logistics proxy</text>
<rect x="405" y="270" width="390" height="300" rx="24" class="panel"/><path d="M468 463 Q520 402 640 408 Q710 413 738 362" class="gold"/><path d="M470 474 Q580 505 735 471" class="gold"/><path d="M493 480 q-22 44 15 66 q38 20 62-17" class="gold"/><path d="M675 480 q-22 44 15 66 q38 20 62-17" class="gold"/><text x="600" y="325" text-anchor="middle" class="accent label">MISSION-READY SYSTEM</text><text x="600" y="365" text-anchor="middle" class="txt big">267 kg CO₂e</text><text x="600" y="395" text-anchor="middle" class="muted small">baseline per Christmas Eve mission</text><text x="600" y="525" text-anchor="middle" class="muted small">Gifts, chimneys and magic flight energy excluded</text>
<path d="M320 297 H405" class="line" marker-end="url(#arr)"/><path d="M320 432 H405" class="line" marker-end="url(#arr)"/><path d="M320 567 H405" class="line" marker-end="url(#arr)"/><path d="M880 297 H795" class="line" marker-end="url(#arr)"/><path d="M880 432 H795" class="line" marker-end="url(#arr)"/><path d="M880 567 H795" class="line" marker-end="url(#arr)"/>
<text x="70" y="688" class="muted small">Boundary rule: only physical materials, repair, forage and staging support enter the total. The model stops when the mission-ready sleigh leaves staging.</text>
</svg>