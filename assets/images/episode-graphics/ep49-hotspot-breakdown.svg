<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">The Argo hotspot breakdown</title>
  <desc id="desc">Published rounded contribution breakdown for the 10.66 tonne carbon footprint: sail and rigging proxy 50.2 percent, wood 41.7 percent, metal fittings 5.4 percent and inbound freight 2.6 percent. Stone anchors are included in the total but fall below the published rounded share labels.</desc>
  <defs>
    <style>
      .bg{fill:#071019}.panel{fill:#0d1b27;stroke:#234557;stroke-width:2}.white{fill:#eef7fb}.muted{fill:#9ab0bc}.cyan{fill:#6de7ff}.gold{fill:#d0a563}.title{font:700 36px Georgia,serif}.label{font:700 20px Arial,sans-serif}.value{font:700 28px Arial,sans-serif}.small{font:16px Arial,sans-serif}.tiny{font:14px Arial,sans-serif}.base{fill:#112232}.bar1{fill:#d0a563}.bar2{fill:#6de7ff}.bar3{fill:#4da9bd}.bar4{fill:#708896}
    </style>
  </defs>
  <rect width="1200" height="720" rx="20" class="bg"/>
  <rect x="28" y="28" width="1144" height="664" rx="16" fill="none" stroke="#234557" stroke-width="1.5"/>
  <text x="64" y="78" class="gold label">EPISODE #49 · HOTSPOT BREAKDOWN</text>
  <text x="64" y="126" class="white title">The voyage wasn't the heavy part</text>
  <text x="64" y="160" class="muted small">Published rounded baseline shares · one build + one expedition</text>

  <g transform="translate(64 205)">
    <rect width="1072" height="104" rx="14" class="panel"/>
    <text x="28" y="38" class="gold label">BASELINE TOTAL</text>
    <text x="28" y="80" class="white value">10.66 t CO₂e</text>
    <text x="245" y="78" class="muted small">per functional unit</text>
    <text x="1040" y="65" text-anchor="end" class="cyan label">MATERIAL PROCUREMENT DOMINATES</text>
  </g>

  <g transform="translate(64 350)">
    <text x="0" y="20" class="white label">Sail + rigging proxy</text><text x="1070" y="20" text-anchor="end" class="white value">50.2%</text>
    <rect x="0" y="38" width="1072" height="34" rx="7" class="base"/><rect x="0" y="38" width="538" height="34" rx="7" class="bar1"/>

    <text x="0" y="116" class="white label">Wood procurement</text><text x="1070" y="116" text-anchor="end" class="white value">41.7%</text>
    <rect x="0" y="134" width="1072" height="34" rx="7" class="base"/><rect x="0" y="134" width="447" height="34" rx="7" class="bar2"/>

    <text x="0" y="212" class="white label">Metal fittings</text><text x="1070" y="212" text-anchor="end" class="white value">5.4%</text>
    <rect x="0" y="230" width="1072" height="34" rx="7" class="base"/><rect x="0" y="230" width="58" height="34" rx="7" class="bar3"/>

    <text x="0" y="308" class="white label">Inbound freight</text><text x="1070" y="308" text-anchor="end" class="white value">2.6%</text>
    <rect x="0" y="326" width="1072" height="34" rx="7" class="base"/><rect x="0" y="326" width="28" height="34" rx="7" class="bar4"/>
  </g>

  <rect x="64" y="642" width="1072" height="34" rx="8" fill="#0b1622"/>
  <text x="82" y="664" class="muted tiny">Published labels total 99.9% after rounding. Stone anchors are included in the 10.658 t calculation but are below the published one-decimal contribution labels.</text>
</svg>