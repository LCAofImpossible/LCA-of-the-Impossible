<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">Pandora's Jar hotspot breakdown</title>
<desc id="desc">Contribution chart for the 26.0 kilogram carbon dioxide equivalent baseline, led by 6.6 kilograms from kiln energy and 6.4 kilograms from road freight; together they explain 49.9 percent of the result.</desc>
<defs><style>
.bg{fill:#071019}.panel{fill:#0d1b27;stroke:#234557;stroke-width:2}.track{fill:#112232}.bar{fill:#6de7ff}.gold{fill:#d0a563}
.head{fill:#eef7fb;font:700 34px Arial,sans-serif}.eyebrow{fill:#6de7ff;font:700 18px Arial,sans-serif;letter-spacing:3px}
.label{fill:#eef7fb;font:21px Arial,sans-serif}.value{fill:#eef7fb;font:700 21px Arial,sans-serif}.big{fill:#d0a563;font:700 50px Arial,sans-serif}
.small{fill:#9ab0bc;font:18px Arial,sans-serif}.note{fill:#c4f7ff;font:700 22px Arial,sans-serif}
</style></defs>
<rect width="1200" height="760" class="bg"/>
<text x="60" y="58" class="eyebrow">EPISODE #51 · HOTSPOT BREAKDOWN</text>
<text x="60" y="105" class="head">Heat fires it. Distance moves it.</text>
<rect x="60" y="145" width="1080" height="110" rx="16" class="panel"/>
<text x="90" y="198" class="big">26.0 kg CO₂e</text>
<text x="445" y="190" class="note">per sealed jar delivered and opened</text>
<text x="445" y="222" class="small">Kiln energy + freight: 49.9% of the baseline result</text>

<g transform="translate(60 300)">
<text x="0" y="22" class="label">Kiln energy</text><rect x="290" y="3" width="700" height="24" rx="4" class="track"/><rect x="290" y="3" width="700" height="24" rx="4" class="gold"/><text x="1010" y="23" class="value">6.6</text>
<text x="0" y="68" class="label">Road freight</text><rect x="290" y="49" width="700" height="24" rx="4" class="track"/><rect x="290" y="49" width="679" height="24" rx="4" class="gold"/><text x="1010" y="69" class="value">6.4</text>
<text x="0" y="114" class="label">Terracotta body</text><rect x="290" y="95" width="700" height="24" rx="4" class="track"/><rect x="290" y="95" width="562" height="24" rx="4" class="bar"/><text x="1010" y="115" class="value">5.3</text>
<text x="0" y="160" class="label">Metal fittings</text><rect x="290" y="141" width="700" height="24" rx="4" class="track"/><rect x="290" y="141" width="488" height="24" rx="4" class="bar"/><text x="1010" y="161" class="value">4.6</text>
<text x="0" y="206" class="label">Packaging</text><rect x="290" y="187" width="700" height="24" rx="4" class="track"/><rect x="290" y="187" width="233" height="24" rx="4" class="bar"/><text x="1010" y="207" class="value">2.2</text>
<text x="0" y="252" class="label">Workshop electricity</text><rect x="290" y="233" width="700" height="24" rx="4" class="track"/><rect x="290" y="233" width="74" height="24" rx="4" class="bar"/><text x="1010" y="253" class="value">0.7</text>
<text x="0" y="298" class="label">Wax / resin seal</text><rect x="290" y="279" width="700" height="24" rx="4" class="track"/><rect x="290" y="279" width="32" height="24" rx="4" class="bar"/><text x="1010" y="299" class="value">0.3</text>
</g>
<text x="60" y="665" class="note">The baseline hotspot is shared: process heat and logistics are almost equal.</text>
<text x="60" y="703" class="small">kg CO₂e per functional unit · Displayed contributions follow the approved episode rounding; no minor flow is visually enlarged.</text>
</svg>