<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title id="title">Jars of the Danaids hotspot breakdown</title>
<desc id="desc">Managed water supply contributes 51.2 percent, water treatment 45.7 percent, hydriae 0.9 percent, repair electricity 0.8 percent, road freight 0.8 percent, timber 0.5 percent and stone 0.1 percent of the approved baseline.</desc>
<rect width="1200" height="700" fill="#f2efe6"/>
<rect x="22" y="22" width="1156" height="656" rx="18" fill="none" stroke="#a58b47" stroke-width="2"/>
<g font-family="Arial,Helvetica,sans-serif">
  <text x="70" y="84" fill="#0b6b47" font-size="20" font-weight="700" letter-spacing="4">EP68 // HOTSPOT BREAKDOWN</text>
  <text x="70" y="134" fill="#071019" font-size="42" font-weight="800">THE LEAK DOMINATES</text>
  <text x="70" y="172" fill="#4d5b53" font-size="18">Approved baseline · 1.36 t CO₂e per reconstructed operating year</text>
</g>
<g font-family="Arial,Helvetica,sans-serif">
  <rect x="72" y="220" width="1056" height="94" rx="10" fill="#d9ddd8"/>
  <rect x="72" y="220" width="541" height="94" rx="10" fill="#0b6b47"/>
  <rect x="613" y="220" width="483" height="94" fill="#4f8c79"/>
  <rect x="1096" y="220" width="32" height="94" rx="10" fill="#b49a4b"/>
  <text x="98" y="277" fill="#fff" font-size="27" font-weight="800">51.2% WATER SUPPLY</text>
  <text x="1080" y="277" text-anchor="end" fill="#fff" font-size="27" font-weight="800">45.7% TREATMENT</text>
  <rect x="72" y="344" width="1056" height="64" rx="10" fill="#071019"/>
  <text x="96" y="385" fill="#d8b34f" font-size="19" font-weight="700">WATER HOTSPOT</text>
  <text x="318" y="385" fill="#fff" font-size="22" font-weight="800">96.9%</text>
  <text x="410" y="385" fill="#d9ddd8" font-size="18">managed water supply + treatment</text>
</g>
<g font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#071019">
  <g transform="translate(72 452)"><circle cx="12" cy="12" r="12" fill="#0b6b47"/><text x="42" y="19" font-weight="700">Managed water supply</text><text x="410" y="19" text-anchor="end" font-weight="700">51.2%</text></g>
  <g transform="translate(72 504)"><circle cx="12" cy="12" r="12" fill="#4f8c79"/><text x="42" y="19" font-weight="700">Water treatment</text><text x="410" y="19" text-anchor="end" font-weight="700">45.7%</text></g>
  <g transform="translate(72 556)"><circle cx="12" cy="12" r="12" fill="#b49a4b"/><text x="42" y="19" font-weight="700">Hydriae</text><text x="410" y="19" text-anchor="end" font-weight="700">0.9%</text></g>
  <g transform="translate(620 452)"><circle cx="12" cy="12" r="12" fill="#8fa59b"/><text x="42" y="19" font-weight="700">Repair electricity</text><text x="470" y="19" text-anchor="end" font-weight="700">0.8%</text></g>
  <g transform="translate(620 504)"><circle cx="12" cy="12" r="12" fill="#9d8e68"/><text x="42" y="19" font-weight="700">Road freight</text><text x="470" y="19" text-anchor="end" font-weight="700">0.8%</text></g>
  <g transform="translate(620 556)"><circle cx="12" cy="12" r="12" fill="#b9b6a8"/><text x="42" y="19" font-weight="700">Timber</text><text x="470" y="19" text-anchor="end" font-weight="700">0.5%</text></g>
  <g transform="translate(620 608)"><circle cx="12" cy="12" r="12" fill="#d9ddd8" stroke="#8b8f88"/><text x="42" y="19" font-weight="700">Stone</text><text x="470" y="19" text-anchor="end" font-weight="700">0.1%</text></g>
</g>
<text x="72" y="648" fill="#4d5b53" font-family="Arial,Helvetica,sans-serif" font-size="17">All non-water flows together account for 3.1% of the approved baseline.</text>
</svg>
