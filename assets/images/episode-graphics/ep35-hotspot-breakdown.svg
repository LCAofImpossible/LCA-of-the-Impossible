<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img">
<defs>
<style>
  .bg{fill:#071019}.panel{fill:#0b1622;stroke:#d0a563;stroke-width:1.5}
  .line{fill:none;stroke:#d0a563;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
  .goldline{fill:none;stroke:#d0a563;stroke-width:1.4;opacity:.75}
  .thin{fill:none;stroke:#d0a563;stroke-width:1;opacity:.5}
  .grid{stroke:#d0a563;stroke-width:1;opacity:.18;stroke-dasharray:3 7}
  .goldfill{fill:#d0a563}
  .title{fill:#eef7fb;font-family:Inter,Arial,sans-serif;font-weight:800;font-size:46px;letter-spacing:1px}
  .subtitle{fill:#d0a563;font-family:Inter,Arial,sans-serif;font-weight:700;font-size:18px;letter-spacing:1.7px}
  .cardtitle{fill:#eef7fb;font-family:Inter,Arial,sans-serif;font-weight:750;font-size:17px;letter-spacing:.6px}
  .small{fill:#9ab0bc;font-family:Inter,Arial,sans-serif;font-size:14px}
  .value{fill:#d0a563;font-family:Inter,Arial,sans-serif;font-weight:800;font-size:25px}
</style>
</defs>
<rect width="1200" height="900" class="bg"/>
<rect x="28" y="28" width="1144" height="844" rx="8" class="thin"/>
<path d="M28 70V28H70 M1130 28h42v42 M28 830v42h42 M1130 872h42v-42" class="line" opacity=".65"/>
<text x="70" y="88" class="title">HOTSPOT BREAKDOWN</text>
<text x="70" y="126" class="subtitle">THE FLYING DUTCHMAN — CONTRIBUTION TO TOTAL CO₂e</text>
<line x1="70" y1="150" x2="410" y2="150" class="goldline"/><circle cx="430" cy="150" r="4" class="goldfill"/>
<rect x="70" y="205" width="1060" height="570" rx="8" class="panel"/>
<line x1="410" y1="255" x2="410" y2="720" class="grid"/><text x="410" y="240" text-anchor="middle" class="small">0%</text>
<line x1="572.5" y1="255" x2="572.5" y2="720" class="grid"/><text x="572.5" y="240" text-anchor="middle" class="small">25%</text>
<line x1="735" y1="255" x2="735" y2="720" class="grid"/><text x="735" y="240" text-anchor="middle" class="small">50%</text>
<line x1="897.5" y1="255" x2="897.5" y2="720" class="grid"/><text x="897.5" y="240" text-anchor="middle" class="small">75%</text>
<line x1="1060" y1="255" x2="1060" y2="720" class="grid"/><text x="1060" y="240" text-anchor="middle" class="small">100%</text>
<text x="105" y="304" class="value">1</text><text x="150" y="303" class="cardtitle">CONSTRUCTION</text><rect x="410" y="280" width="633.1" height="28" fill="#d0a563" opacity=".95"/><text x="1061" y="303" class="value">97.4%</text>
<text x="105" y="362" class="value">2</text><text x="150" y="361" class="cardtitle">ANNUAL MAINTENANCE</text><rect x="410" y="338" width="4" height="28" fill="#d0a563" opacity=".7"/>
<text x="105" y="420" class="value">3</text><text x="150" y="419" class="cardtitle">OPERATION</text><rect x="410" y="396" width="3.2" height="28" fill="#d0a563" opacity=".7"/>
<text x="105" y="478" class="value">4</text><text x="150" y="477" class="cardtitle">TRANSPORT</text><rect x="410" y="454" width="2.7" height="28" fill="#d0a563" opacity=".7"/>
<text x="105" y="536" class="value">5</text><text x="150" y="535" class="cardtitle">PITCH / TAR</text><rect x="410" y="512" width="2.4" height="28" fill="#d0a563" opacity=".7"/>
<text x="105" y="594" class="value">6</text><text x="150" y="593" class="cardtitle">CORDAGE &amp; RIGGING</text><rect x="410" y="570" width="2" height="28" fill="#d0a563" opacity=".7"/>
<text x="105" y="652" class="value">7</text><text x="150" y="651" class="cardtitle">SAILS &amp; SAILCLOTH</text><rect x="410" y="628" width="1.8" height="28" fill="#d0a563" opacity=".7"/>
<text x="105" y="710" class="value">8</text><text x="150" y="709" class="cardtitle">IRON FITTINGS</text><rect x="410" y="686" width="1.7" height="28" fill="#d0a563" opacity=".7"/>
<rect x="690" y="600" width="330" height="95" rx="6" class="panel"/><text x="720" y="638" class="subtitle">ALL REMAINING CONTRIBUTORS</text><text x="720" y="674" class="value">COMBINED = 2.6%</text>
<text x="600" y="830" text-anchor="middle" class="subtitle">MAIN RESULT: 528.2 t CO₂e</text>
</svg>