<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Pegasus inventory map</title>
  <desc id="desc">Service-day inventory showing feed, stable utilities, tack, biological emissions and feed freight supporting one 300 kilometre courier mission.</desc>
  <rect width="1200" height="760" fill="#071019"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#eef7fb">
    <text x="70" y="72" font-size="22" letter-spacing="4" fill="#6de7ff">EPISODE #32 · INVENTORY MAP</text>
    <text x="70" y="116" font-size="38" font-weight="700">ONE PEGASUS SERVICE DAY</text>
    <text x="70" y="150" font-size="18" fill="#9ab0bc">Functional unit · one 300 km courier flight carrying one rider and one sealed message</text>
  </g>
  <g stroke="#234557" stroke-width="2" fill="#0d1b27">
    <rect x="60" y="220" width="240" height="120" rx="14"/>
    <rect x="60" y="380" width="240" height="120" rx="14"/>
    <rect x="60" y="540" width="240" height="120" rx="14"/>
    <rect x="460" y="285" width="280" height="290" rx="18" stroke="#d0a563"/>
    <rect x="900" y="235" width="240" height="120" rx="14"/>
    <rect x="900" y="405" width="240" height="120" rx="14"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="90" y="252" fill="#6de7ff" font-size="17" letter-spacing="2">FEED RATION</text>
    <text x="90" y="286" fill="#eef7fb" font-size="24" font-weight="700">Hay · 10.5 kg</text>
    <text x="90" y="318" fill="#eef7fb" font-size="24" font-weight="700">Oats · 2.5 kg</text>
    <text x="90" y="412" fill="#6de7ff" font-size="17" letter-spacing="2">STABLE CARE</text>
    <text x="90" y="446" fill="#eef7fb" font-size="23" font-weight="700">Electricity · 2.0 kWh</text>
    <text x="90" y="478" fill="#eef7fb" font-size="23" font-weight="700">Water · 0.060 m³</text>
    <text x="90" y="572" fill="#6de7ff" font-size="17" letter-spacing="2">SUPPORT FLOWS</text>
    <text x="90" y="606" fill="#eef7fb" font-size="23" font-weight="700">Tack + shoes · 0.058 kg</text>
    <text x="90" y="638" fill="#eef7fb" font-size="23" font-weight="700">Feed freight · 2.60 t·km</text>
    <text x="600" y="330" text-anchor="middle" fill="#d0a563" font-size="18" letter-spacing="3">REFERENCE FLOW</text>
    <text x="600" y="382" text-anchor="middle" fill="#eef7fb" font-size="36" font-weight="700">ONE PEGASUS</text>
    <text x="600" y="426" text-anchor="middle" fill="#eef7fb" font-size="36" font-weight="700">SERVICE DAY</text>
    <text x="600" y="474" text-anchor="middle" fill="#9ab0bc" font-size="20">650 kg canonical body</text>
    <text x="600" y="510" text-anchor="middle" fill="#9ab0bc" font-size="20">No lifetime credit</text>
    <text x="930" y="267" fill="#6de7ff" font-size="17" letter-spacing="2">BIOLOGY</text>
    <text x="930" y="302" fill="#eef7fb" font-size="22" font-weight="700">Enteric CH₄</text>
    <text x="930" y="332" fill="#eef7fb" font-size="22" font-weight="700">+ manure</text>
    <text x="930" y="437" fill="#6de7ff" font-size="17" letter-spacing="2">COMPLETED SERVICE</text>
    <text x="930" y="472" fill="#eef7fb" font-size="25" font-weight="700">300 km direct route</text>
    <text x="930" y="505" fill="#eef7fb" font-size="22">rider + sealed message</text>
  </g>
  <g stroke="#6de7ff" stroke-width="3" fill="none" marker-end="url(#arrow)">
    <path d="M300 280 H430"/>
    <path d="M300 440 H430"/>
    <path d="M300 600 H430"/>
    <path d="M740 360 H870"/>
    <path d="M740 500 H870"/>
  </g>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#6de7ff"/></marker>
  </defs>
  <rect x="60" y="690" width="1080" height="42" rx="10" fill="#0b1622" stroke="#234557"/>
  <text x="600" y="718" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#d0a563">CUT-OFF · rider lands and service is complete · divine intervention is not assigned an energy flow</text>
</svg>
