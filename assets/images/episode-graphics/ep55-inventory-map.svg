<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">The Garden of the Hesperides inventory map</title>
<desc id="desc">Nine annual inventory flows feeding one guarded presentation of three golden apples at the orchard gate.</desc>
<defs>
  <style>
    .bg{fill:#071019}.panel{fill:#0d1b27;stroke:#234557;stroke-width:2}.line{stroke:#6de7ff;stroke-width:3;fill:none}.line2{stroke:#d0a563;stroke-width:3;fill:none}.muted{fill:#9ab0bc;font:22px Arial,sans-serif}.label{fill:#eef7fb;font:700 24px Arial,sans-serif}.small{fill:#9ab0bc;font:18px Arial,sans-serif}.value{fill:#c4f7ff;font:700 22px Arial,sans-serif}.gold{fill:#d0a563}.green{fill:#6de7ff}.head{fill:#eef7fb;font:700 34px Arial,sans-serif}.eyebrow{fill:#6de7ff;font:700 18px Arial,sans-serif;letter-spacing:3px}
  </style>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#6de7ff"/></marker>
  <marker id="arrowGold" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#d0a563"/></marker>
</defs>
<rect width="1200" height="760" class="bg"/>
<text x="60" y="58" class="eyebrow">EPISODE #55 · INVENTORY MAP</text>
<text x="60" y="105" class="head">Nine flows. One annual guarded service.</text>
<text x="60" y="138" class="muted">The boundary ends at the Hesperidean orchard gate.</text>

<!-- left inputs -->
<g transform="translate(55 195)">
  <rect width="290" height="92" rx="12" class="panel"/><circle cx="28" cy="28" r="9" class="gold"/>
  <text x="52" y="34" class="label">Gold skin</text><text x="52" y="64" class="value">0.0116 kg Au</text><text x="52" y="84" class="small">10 µm surface layer</text>
</g>
<g transform="translate(55 307)">
  <rect width="290" height="92" rx="12" class="panel"/><circle cx="28" cy="28" r="9" class="green"/>
  <text x="52" y="34" class="label">Fruit body</text><text x="52" y="64" class="value">0.750 kg</text><text x="52" y="84" class="small">three apple cores</text>
</g>
<g transform="translate(55 419)">
  <rect width="290" height="92" rx="12" class="panel"/>
  <text x="24" y="34" class="label">Allocated structure</text><text x="24" y="64" class="value">trellis + stone works</text><text x="24" y="84" class="small">annual service-life allocation</text>
</g>
<g transform="translate(55 531)">
  <rect width="290" height="92" rx="12" class="panel"/>
  <text x="24" y="34" class="label">Garden compost</text><text x="24" y="64" class="value">50.0 kg</text><text x="24" y="84" class="small">annual soil support</text>
</g>

<!-- right inputs -->
<g transform="translate(855 195)"><rect width="290" height="92" rx="12" class="panel"/><text x="24" y="34" class="label">Metal upkeep</text><text x="24" y="64" class="value">5.0 kg</text><text x="24" y="84" class="small">tools + gate</text></g>
<g transform="translate(855 307)"><rect width="290" height="92" rx="12" class="panel"/><text x="24" y="34" class="label">Irrigation water</text><text x="24" y="64" class="value">12.0 m³</text><text x="24" y="84" class="small">dry-season supply</text></g>
<g transform="translate(855 419)"><rect width="290" height="92" rx="12" class="panel"/><text x="24" y="34" class="label">Electricity</text><text x="24" y="64" class="value">25.0 kWh</text><text x="24" y="84" class="small">pump + gate lighting</text></g>
<g transform="translate(855 531)"><rect width="290" height="92" rx="12" class="panel"/><text x="24" y="34" class="label">Inbound freight</text><text x="24" y="64" class="value">30.0 t·km</text><text x="24" y="84" class="small">0.05 t × 600 km</text></g>

<!-- centre -->
<rect x="430" y="270" width="340" height="285" rx="20" fill="#112232" stroke="#d0a563" stroke-width="3"/>
<text x="600" y="316" text-anchor="middle" class="eyebrow" fill="#d0a563">FUNCTIONAL UNIT</text>
<text x="600" y="365" text-anchor="middle" class="label">One annual guarded</text>
<text x="600" y="397" text-anchor="middle" class="label">presentation of three</text>
<text x="600" y="429" text-anchor="middle" class="label">golden apples</text>
<line x1="485" y1="456" x2="715" y2="456" stroke="#234557" stroke-width="2"/>
<text x="600" y="493" text-anchor="middle" class="small">western Mediterranean reconstruction</text>
<text x="600" y="522" text-anchor="middle" class="small">service ends at the orchard gate</text>

<path d="M345 241 C390 241 395 315 430 330" class="line2" marker-end="url(#arrowGold)"/>
<path d="M345 353 C390 353 400 370 430 380" class="line" marker-end="url(#arrow)"/>
<path d="M345 465 C390 465 400 430 430 425" class="line" marker-end="url(#arrow)"/>
<path d="M345 577 C390 577 400 490 430 478" class="line" marker-end="url(#arrow)"/>
<path d="M855 241 C810 241 805 315 770 330" class="line" marker-end="url(#arrow)"/>
<path d="M855 353 C810 353 800 370 770 380" class="line" marker-end="url(#arrow)"/>
<path d="M855 465 C810 465 800 430 770 425" class="line" marker-end="url(#arrow)"/>
<path d="M855 577 C810 577 800 490 770 478" class="line" marker-end="url(#arrow)"/>

<rect x="430" y="600" width="340" height="72" rx="12" class="panel"/>
<text x="600" y="629" text-anchor="middle" class="label">Declared outside boundary</text>
<text x="600" y="656" text-anchor="middle" class="small">Ladon metabolism · nymph labour · magic · land · eating</text>
<text x="60" y="716" class="small">Allocation: wall and trellis by service life · No avoided burden · Minor ritual objects &lt;1% cut off unless material to the finding.</text>
</svg>