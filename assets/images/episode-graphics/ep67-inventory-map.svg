<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
<title id="title">Augean Stables inventory map</title>
<desc id="desc">Six emitting campaign flows feed one river-assisted clearing campaign. Gravity-fed river water and excavated soil reused on site are shown separately as non-emitting physical flows.</desc>
<rect width="1200" height="820" fill="#f2efe6"/>
<rect x="22" y="22" width="1156" height="776" rx="18" fill="none" stroke="#a58b47" stroke-width="2"/>
<g font-family="Arial,Helvetica,sans-serif" fill="#071019">
  <text x="70" y="82" font-size="22" font-weight="700" letter-spacing="4">EP67 // INVENTORY MAP</text>
  <text x="70" y="128" font-size="42" font-weight="800">SIX FLOWS DEFINE THE CAMPAIGN</text>
  <text x="70" y="162" font-size="18" fill="#4d5b53">One clearing campaign · 8-hour wash · restoration complete</text>
</g>
<g stroke="#0b6b47" stroke-width="3" fill="none">
  <path d="M330 270 H500"/><path d="M330 382 H500"/><path d="M330 494 H500"/>
  <path d="M870 270 H700"/><path d="M870 382 H700"/><path d="M870 494 H700"/>
</g>
<g font-family="Arial,Helvetica,sans-serif">
  <rect x="500" y="235" width="200" height="330" rx="36" fill="#071019"/>
  <text x="600" y="310" text-anchor="middle" fill="#d8b34f" font-size="18" font-weight="700">AUGEAN STABLES</text>
  <text x="600" y="362" text-anchor="middle" fill="#fff" font-size="42" font-weight="800">1</text>
  <text x="600" y="398" text-anchor="middle" fill="#fff" font-size="20">CAMPAIGN</text>
  <text x="600" y="448" text-anchor="middle" fill="#8fd0a9" font-size="17">52,500 m³ earthworks</text>
  <text x="600" y="480" text-anchor="middle" fill="#8fd0a9" font-size="17">8-hour river wash</text>
  <text x="600" y="512" text-anchor="middle" fill="#8fd0a9" font-size="17">restored site</text>
</g>
<g font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#071019">
  <g><rect x="70" y="219" width="260" height="102" rx="12" fill="#fff" stroke="#b9b6a8"/><text x="92" y="251" fill="#0b6b47" font-weight="700">S1 · EARTHWORKS</text><text x="92" y="282" font-weight="700">Diesel</text><text x="92" y="307">40,550 L</text></g>
  <g><rect x="70" y="331" width="260" height="102" rx="12" fill="#fff" stroke="#b9b6a8"/><text x="92" y="363" fill="#0b6b47" font-weight="700">S2 · MOBILIZATION</text><text x="92" y="394" font-weight="700">Equipment transport</text><text x="92" y="419">192,000 t·km</text></g>
  <g><rect x="70" y="443" width="260" height="102" rx="12" fill="#fff" stroke="#b9b6a8"/><text x="92" y="475" fill="#0b6b47" font-weight="700">S5 · REPAIR</text><text x="92" y="506" font-weight="700">Concrete / stone</text><text x="92" y="531">120 t</text></g>
  <g><rect x="870" y="219" width="260" height="102" rx="12" fill="#fff" stroke="#b9b6a8"/><text x="892" y="251" fill="#0b6b47" font-weight="700">S4 · HARDWARE</text><text x="892" y="282" font-weight="700">Metal fittings</text><text x="892" y="307">2.40 t</text></g>
  <g><rect x="870" y="331" width="260" height="102" rx="12" fill="#fff" stroke="#b9b6a8"/><text x="892" y="363" fill="#0b6b47" font-weight="700">S3 · GATEWORK</text><text x="892" y="394" font-weight="700">Cypress timber proxy</text><text x="892" y="419">24.0 t</text></g>
  <g><rect x="870" y="443" width="260" height="102" rx="12" fill="#fff" stroke="#b9b6a8"/><text x="892" y="475" fill="#0b6b47" font-weight="700">S6 · REINSTATEMENT</text><text x="892" y="506" font-weight="700">Aggregates</text><text x="892" y="531">350 t</text></g>
</g>
<g font-family="Arial,Helvetica,sans-serif">
  <rect x="70" y="610" width="500" height="120" rx="14" fill="#e7ece5" stroke="#aeb9a9"/>
  <text x="96" y="646" fill="#0b6b47" font-size="17" font-weight="700">NON-EMITTING PHYSICAL FLOW</text>
  <text x="96" y="683" fill="#071019" font-size="26" font-weight="800">2.88 million m³ river water</text>
  <text x="96" y="711" fill="#4d5b53" font-size="16">Gravity-fed · no treated-water supply or pumping modelled.</text>
  <rect x="600" y="610" width="530" height="120" rx="14" fill="#071019"/>
  <text x="626" y="646" fill="#d8b34f" font-size="17" font-weight="700">ON-SITE REUSE</text>
  <text x="626" y="683" fill="#fff" font-size="26" font-weight="800">52,500 m³ excavated soil</text>
  <text x="626" y="711" fill="#d9ddd8" font-size="16">Reused on site · no off-site soil haul modelled.</text>
</g>
</svg>