<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
<title id="title">Minotaur Labyrinth technical reconstruction plate</title>
<desc id="desc">Schematic two-level maze showing plan footprint, network length, route to centre and indicative junction density.</desc>
<rect width="720" height="420" rx="24" fill="#071423"/>
<rect x="20" y="20" width="680" height="380" rx="18" fill="none" stroke="#6de7ff" stroke-opacity="0.22"/>
<text x="40" y="56" fill="#c4f7ff" font-size="16" font-family="Arial, Helvetica, sans-serif" letter-spacing="2">TECHNICAL PLATE · NOT ARCHAEOLOGICAL</text>
<text x="40" y="90" fill="#d0a563" font-size="30" font-weight="700" font-family="Arial, Helvetica, sans-serif">KNOSSOS-SCALE NAVIGATION SYSTEM</text>
<g transform="translate(44 132)" fill="none" stroke="#eef7fb" stroke-width="7" stroke-linecap="square">
  <path d="M0 0 H280 V54 H76 V174 H230 V116 H332 V240 H24 V62 H128"/>
  <path d="M356 0 H612 V214 H510 V74 H404 V254"/>
  <path d="M242 70 H516 V128 H350 V206 H472"/>
</g>
<g transform="translate(44 132)" fill="none" stroke="#d0a563" stroke-width="3">
  <path d="M8 236 H122 V168 H242 V108 H352 V166 H452 V112 H560"/>
</g>
<circle cx="604" cy="244" r="18" fill="#0d1b27" stroke="#d0a563" stroke-width="2"/>
<text x="598" y="250" fill="#d0a563" font-size="16" font-weight="700" font-family="Arial, Helvetica, sans-serif">M</text>
<text x="40" y="314" fill="#9ab0bc" font-size="12" font-family="Arial, Helvetica, sans-serif">3.0 km route to centre · 2.2 m average passage width · two modeled levels</text>
<rect x="40" y="330" width="146" height="48" rx="10" fill="#0d1b27" stroke="#234557"/>
<text x="54" y="350" fill="#6de7ff" font-size="11" font-weight="700" font-family="Arial, Helvetica, sans-serif">PLAN FOOTPRINT</text>
<text x="54" y="370" fill="#eef7fb" font-size="18" font-weight="700" font-family="Arial, Helvetica, sans-serif">22,000 m²</text>
<rect x="202" y="330" width="146" height="48" rx="10" fill="#0d1b27" stroke="#234557"/>
<text x="216" y="350" fill="#6de7ff" font-size="11" font-weight="700" font-family="Arial, Helvetica, sans-serif">GROSS FLOOR AREA</text>
<text x="216" y="370" fill="#eef7fb" font-size="18" font-weight="700" font-family="Arial, Helvetica, sans-serif">44,000 m²</text>
<rect x="364" y="330" width="146" height="48" rx="10" fill="#0d1b27" stroke="#234557"/>
<text x="378" y="350" fill="#6de7ff" font-size="11" font-weight="700" font-family="Arial, Helvetica, sans-serif">MODELED NETWORK</text>
<text x="378" y="370" fill="#eef7fb" font-size="18" font-weight="700" font-family="Arial, Helvetica, sans-serif">10.0 km</text>
<rect x="526" y="330" width="154" height="48" rx="10" fill="#0d1b27" stroke="#234557"/>
<text x="540" y="350" fill="#6de7ff" font-size="11" font-weight="700" font-family="Arial, Helvetica, sans-serif">INDICATIVE JUNCTIONS</text>
<text x="540" y="370" fill="#eef7fb" font-size="18" font-weight="700" font-family="Arial, Helvetica, sans-serif">556</text>
</svg>