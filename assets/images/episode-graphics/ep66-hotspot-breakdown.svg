<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
<title id="title">Cornucopia hotspot breakdown</title>
<desc id="desc">Food production contributes 99.1 percent, food-waste treatment 0.9 percent, and vessel, utilities and delivery together less than 0.01 percent of the approved 3.74 tonne carbon dioxide equivalent baseline.</desc>
<rect width="1200" height="640" fill="#f2efe6"/>
<rect x="22" y="22" width="1156" height="596" rx="18" fill="none" stroke="#a58b47" stroke-width="2"/>
<g font-family="Arial,Helvetica,sans-serif">
  <text x="70" y="84" fill="#0b6b47" font-size="20" font-weight="700" letter-spacing="4">EP66 // HOTSPOT BREAKDOWN</text>
  <text x="70" y="134" fill="#071019" font-size="42" font-weight="800">THE OUTPUT IS THE HOTSPOT</text>
  <text x="70" y="172" fill="#4d5b53" font-size="18">Approved baseline · 3.74 t CO₂e per 24-hour service</text>
</g>
<g font-family="Arial,Helvetica,sans-serif">
  <rect x="72" y="232" width="990" height="86" rx="10" fill="#d9ddd8"/>
  <rect x="72" y="232" width="981" height="86" rx="10" fill="#0b6b47"/>
  <rect x="1053" y="232" width="9" height="86" fill="#b49a4b"/>
  <text x="98" y="286" fill="#fff" font-size="28" font-weight="800">99.1% FOOD PRODUCTION</text>
  <text x="1080" y="286" fill="#071019" font-size="18" font-weight="700">0.9%</text>

  <g transform="translate(72 368)">
    <circle cx="12" cy="12" r="12" fill="#0b6b47"/><text x="42" y="19" fill="#071019" font-size="20" font-weight="700">Food production</text><text x="920" y="19" text-anchor="end" fill="#071019" font-size="20" font-weight="700">3,701.4 kg CO₂e · 99.1%</text>
    <circle cx="12" cy="70" r="12" fill="#b49a4b"/><text x="42" y="77" fill="#071019" font-size="20" font-weight="700">Food-waste treatment</text><text x="920" y="77" text-anchor="end" fill="#071019" font-size="20" font-weight="700">35.02 kg CO₂e · 0.9%</text>
    <circle cx="12" cy="128" r="12" fill="#aeb9a9"/><text x="42" y="135" fill="#071019" font-size="20" font-weight="700">Vessel + utilities + delivery</text><text x="920" y="135" text-anchor="end" fill="#071019" font-size="20" font-weight="700">&lt;0.01%</text>
  </g>
  <rect x="72" y="542" width="1056" height="56" rx="10" fill="#071019"/>
  <text x="96" y="578" fill="#d8b34f" font-size="18" font-weight="700">MARGINAL OUTPUT</text>
  <text x="294" y="578" fill="#fff" font-size="18">Each extra kilogram adds about 3.70 kg CO₂e before waste.</text>
</g>
</svg>
