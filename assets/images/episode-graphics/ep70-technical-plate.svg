<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
<title id="title">El Dorado technical plate</title>
<desc id="desc">Frozen raft reconstruction showing a 6.0 by 3.0 metre plan, 800 kilogram softwood raft mass, 50.5 kilogram primary-gold burden, gold density of 19.32 grams per cubic centimetre and a derived gold volume of 2.61 litres.</desc>
<rect width="1200" height="820" fill="#071019"/>
<rect x="24" y="24" width="1152" height="772" rx="18" fill="none" stroke="#a58b47" stroke-width="2"/>
<g font-family="Arial,Helvetica,sans-serif">
  <text x="70" y="82" fill="#d8b34f" font-size="22" font-weight="700" letter-spacing="4">EP70 // TECHNICAL PLATE</text>
  <text x="70" y="128" fill="#f5f0e6" font-size="42" font-weight="800">SMALL RAFT · HEAVY GOLD</text>
</g>
<g stroke="#6d5c36" stroke-width="1" opacity="0.65" fill="none">
  <circle cx="600" cy="430" r="276"/><circle cx="600" cy="430" r="214"/>
  <line x1="310" y1="430" x2="890" y2="430"/><line x1="600" y1="154" x2="600" y2="706"/>
</g>
<g transform="translate(392 272)">
  <rect x="0" y="0" width="416" height="260" rx="18" fill="#13241f" stroke="#d8b34f" stroke-width="4"/>
  <g stroke="#9d7a3e" stroke-width="18" stroke-linecap="round">
    <path d="M28 30 H388"/><path d="M28 66 H388"/><path d="M28 102 H388"/><path d="M28 138 H388"/><path d="M28 174 H388"/><path d="M28 210 H388"/><path d="M28 246 H388"/>
  </g>
  <g stroke="#c3b07a" stroke-width="5" fill="none"><path d="M72 10 V250"/><path d="M208 10 V250"/><path d="M344 10 V250"/></g>
  <circle cx="208" cy="98" r="25" fill="#d8b34f" stroke="#f2efe6" stroke-width="3"/>
  <path d="M208 123 V190 M170 150 H246" stroke="#f2efe6" stroke-width="6"/>
  <g fill="#d8b34f"><circle cx="148" cy="196" r="9"/><circle cx="178" cy="210" r="7"/><circle cx="238" cy="210" r="7"/><circle cx="268" cy="196" r="9"/></g>
</g>
<g stroke="#6fbc91" stroke-width="3" fill="none">
  <line x1="392" y1="574" x2="808" y2="574"/><line x1="392" y1="559" x2="392" y2="589"/><line x1="808" y1="559" x2="808" y2="589"/>
  <line x1="342" y1="272" x2="342" y2="532"/><line x1="327" y1="272" x2="357" y2="272"/><line x1="327" y1="532" x2="357" y2="532"/>
</g>
<g font-family="Arial,Helvetica,sans-serif" font-weight="700">
  <text x="600" y="611" text-anchor="middle" fill="#8fd0a9" font-size="20">6.0 m PLAN LENGTH</text>
  <text x="304" y="410" text-anchor="middle" transform="rotate(-90 304 410)" fill="#8fd0a9" font-size="20">3.0 m PLAN WIDTH</text>
</g>
<g font-family="Arial,Helvetica,sans-serif">
  <rect x="70" y="188" width="250" height="388" rx="14" fill="#0d1b27" stroke="#6d5c36"/>
  <text x="94" y="226" fill="#d8b34f" font-size="17" font-weight="700">RAFT BODY</text>
  <text x="94" y="276" fill="#9fa9a3" font-size="14">MATERIAL</text><text x="94" y="307" fill="#fff" font-size="24" font-weight="700">Softwood logs</text>
  <text x="94" y="356" fill="#9fa9a3" font-size="14">DRY MASS</text><text x="94" y="387" fill="#fff" font-size="24" font-weight="700">800 kg</text>
  <text x="94" y="436" fill="#9fa9a3" font-size="14">CONSTRUCTION</text><text x="94" y="467" fill="#fff" font-size="20" font-weight="700">Lashed platform</text>
  <text x="94" y="516" fill="#9fa9a3" font-size="14">SERVICE</text><text x="94" y="547" fill="#8fd0a9" font-size="18" font-weight="700">One launch</text>
  <rect x="880" y="188" width="250" height="388" rx="14" fill="#0d1b27" stroke="#6d5c36"/>
  <text x="904" y="226" fill="#d8b34f" font-size="17" font-weight="700">GOLD BURDEN</text>
  <text x="904" y="276" fill="#9fa9a3" font-size="14">PRIMARY GOLD</text><text x="904" y="307" fill="#fff" font-size="27" font-weight="700">50.5 kg</text>
  <text x="904" y="356" fill="#9fa9a3" font-size="14">DENSITY</text><text x="904" y="387" fill="#fff" font-size="24" font-weight="700">19.32 g/cm³</text>
  <path d="M904 423 H1106" stroke="#6fbc91" stroke-width="5"/><polygon points="1106,423 1088,413 1088,433" fill="#6fbc91"/>
  <text x="904" y="469" fill="#9fa9a3" font-size="14">GOLD VOLUME</text><text x="904" y="504" fill="#6de7ff" font-size="34" font-weight="800">2.61 litres</text>
  <text x="904" y="547" fill="#8fd0a9" font-size="16">mass drives the result</text>
</g>
<g font-family="Arial,Helvetica,sans-serif">
  <rect x="70" y="704" width="1060" height="68" rx="10" fill="#0d1b27" stroke="#6d5c36"/>
  <text x="94" y="746" fill="#f5f0e6" font-size="18">50.5 kg Au ÷ 19.32 g/cm³ = 2.61 litres</text>
  <text x="1106" y="746" text-anchor="end" fill="#8fd0a9" font-size="18">GEOMETRY CHECKS PLAUSIBILITY · MASS DRIVES IMPACT</text>
</g>
</svg>
