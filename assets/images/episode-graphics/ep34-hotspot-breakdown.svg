<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">Solar Chariot of Elios hotspot breakdown</title><desc id="desc">Gold contributes 98.8 percent of the 3,125 tonne carbon dioxide equivalent baseline. All other modeled flows contribute 1.2 percent combined.</desc>
<defs><style>.bg{fill:#071019}.panel{fill:#0d1b27;stroke:#234557;stroke-width:2}.gold{fill:#d0a563}.cyan{fill:#6de7ff}.txt{fill:#eef7fb;font:600 24px Arial,sans-serif}.big{fill:#eef7fb;font:700 72px Arial,sans-serif}.muted{fill:#9ab0bc;font:18px Arial,sans-serif}.ey{fill:#6de7ff;font:700 15px Arial;letter-spacing:2px}.line{stroke:#234557;stroke-width:2}</style></defs>
<rect class="bg" width="1200" height="620"/><text class="ey" x="60" y="58">EP34 · HOTSPOT BREAKDOWN · BASELINE</text><text class="txt" x="60" y="98">3,125 t CO₂e per operational year</text>
<rect class="panel" x="60" y="145" width="1080" height="115" rx="12"/><rect class="gold" x="85" y="180" width="1008" height="44" rx="8"/><rect class="cyan" x="1093" y="180" width="22" height="44" rx="8"/><text class="muted" x="85" y="246">Gold 98.8%</text><text class="muted" x="945" y="246">All other flows 1.2%</text>
<text class="big" x="60" y="370">98.8%</text><text class="txt" x="340" y="340">GOLD PLATING + RADIANT PANELS</text><text class="muted" x="340" y="375">120 kg gold · 3,086.5 t CO₂e reported contribution</text><text class="muted" x="340" y="410">A small mass dominates because the primary-gold proxy is extremely carbon-intensive.</text>
<line class="line" x1="60" y1="455" x2="1140" y2="455"/><text class="txt" x="60" y="500">Other reported contributions</text><text class="muted" x="60" y="540">Electricity · 18.5 t CO₂e</text><text class="muted" x="360" y="540">Primary metals · 16.2 t CO₂e reported</text><text class="muted" x="750" y="540">Harness · 2.0 t CO₂e</text><text class="muted" x="60" y="575">Freight &amp; wood · &lt;1 t CO₂e combined</text><text class="muted" x="570" y="575">Interpretation · mass is visible; carbon intensity decides the answer.</text>
</svg>
