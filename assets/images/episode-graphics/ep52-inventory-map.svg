<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">Hermes Sandals inventory map</title><desc id="desc">Main material, utility and freight inputs flow into one pair of delivered winged sandals; divine propulsion and end of life are excluded.</desc>
<style>
.bg{fill:#071019}.panel{fill:#0d1b27;stroke:#234557;stroke-width:2}.line{stroke:#6de7ff;stroke-width:3;fill:none}.dash{stroke:#9ab0bc;stroke-width:2;stroke-dasharray:8 8;fill:none}.gold{stroke:#d0a563;fill:#112232;stroke-width:2}.txt{font-family:Arial,sans-serif;fill:#eef7fb}.muted{font-family:Arial,sans-serif;fill:#9ab0bc}.ey{font-family:Arial,sans-serif;fill:#6de7ff;font-size:18;font-weight:bold;letter-spacing:2px}.h{font-family:Arial,sans-serif;fill:#eef7fb;font-size:30;font-weight:bold}.v{font-family:Arial,sans-serif;fill:#c4f7ff;font-size:22;font-weight:bold}.small{font-size:17}.ex{fill:#0b1622;stroke:#d0a563;stroke-width:2}</style>
<rect class="bg" width="1200" height="760"/><text class="ey" x="55" y="58">INVENTORY MAP · EPISODE #52</text><text class="h" x="55" y="100">What enters one delivered pair</text>
<rect class="panel" x="55" y="145" width="280" height="118" rx="12"/><text class="txt v" x="80" y="182">Leather body</text><text class="muted small" x="80" y="215">0.440 kg</text><text class="muted small" x="80" y="241">DEFRA clothing proxy</text>
<rect class="gold" x="55" y="285" width="280" height="118" rx="12"/><text class="txt v" x="80" y="322">Gold leaf</text><text class="muted small" x="80" y="355">0.002 kg</text><text class="muted small" x="80" y="381">External primary-gold proxy</text>
<rect class="panel" x="55" y="425" width="280" height="118" rx="12"/><text class="txt v" x="80" y="462">Feather / textile</text><text class="muted small" x="80" y="495">0.060 kg</text><text class="muted small" x="80" y="521">Wing vanes</text>
<rect class="panel" x="55" y="565" width="280" height="118" rx="12"/><text class="txt v" x="80" y="602">Bronze / brass</text><text class="muted small" x="80" y="635">0.180 kg</text><text class="muted small" x="80" y="661">Frames + buckles</text>
<rect class="panel" x="865" y="145" width="280" height="118" rx="12"/><text class="txt v" x="890" y="182">Workshop</text><text class="muted small" x="890" y="215">4.0 kWh electricity</text><text class="muted small" x="890" y="241">0.02 m³ water</text>
<rect class="panel" x="865" y="305" width="280" height="118" rx="12"/><text class="txt v" x="890" y="342">Packaging</text><text class="muted small" x="890" y="375">0.180 kg</text><text class="muted small" x="890" y="401">Wood + paper</text>
<rect class="panel" x="865" y="465" width="280" height="138" rx="12"/><text class="txt v" x="890" y="502">Freight</text><text class="muted small" x="890" y="535">Road: 0.103 t·km</text><text class="muted small" x="890" y="563">Sea: 0.690 t·km</text><text class="muted small" x="890" y="591">Total: 0.793 t·km</text>
<path class="line" d="M335 204 H485"/><path class="line" d="M335 344 H485"/><path class="line" d="M335 484 H485"/><path class="line" d="M335 624 H485"/><path class="line" d="M865 204 H715"/><path class="line" d="M865 364 H715"/><path class="line" d="M865 534 H715"/>
<rect class="gold" x="485" y="250" width="230" height="250" rx="18"/><text class="ey" x="520" y="300">REFERENCE FLOW</text><text class="txt h" x="520" y="354">ONE PAIR</text><text class="muted small" x="520" y="390">0.682 kg product</text><text class="muted small" x="520" y="420">0.862 kg shipped</text><text class="muted small" x="520" y="450">cradle-to-delivered-gate</text><text class="txt small" x="520" y="480">63.5 kg CO₂e</text>
<rect class="ex" x="420" y="625" width="360" height="80" rx="10"/><text class="ey" x="448" y="657">EXPLICITLY OUTSIDE THE MODEL</text><text class="muted small" x="448" y="685">Divine propulsion · maintenance · end-of-life · avoided travel</text><path class="dash" d="M600 500 V625"/>
