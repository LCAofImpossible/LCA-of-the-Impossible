<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">Santa's Sleigh hotspot breakdown</title><desc id="desc">Contribution breakdown of the 267 kilogram carbon dioxide equivalent baseline, dominated by reindeer forage at 177.7 kilograms or 67 percent.</desc>
<defs><style>.bg{fill:#071019}.p{fill:#0d1b27;stroke:#234557;stroke-width:2}.bar{fill:#234557}.hot{fill:#6de7ff}.gold{fill:#d0a563}.txt{fill:#eef7fb;font-family:Arial,sans-serif}.m{fill:#9ab0bc;font-family:Arial,sans-serif}.a{fill:#6de7ff;font-family:Arial,sans-serif}.g{fill:#d0a563;font-family:Arial,sans-serif}.l{font-size:20px;font-weight:700;letter-spacing:2px}.s{font-size:22px}.md{font-size:28px}.b{font-size:50px;font-weight:700}</style></defs>
<rect class="bg" width="1200" height="760"/><rect x="35" y="35" width="1130" height="690" rx="18" class="p"/><text x="75" y="95" class="a l">HOTSPOT BREAKDOWN · BASELINE</text><text x="75" y="155" class="txt b">267 kg CO₂e</text><text x="390" y="155" class="m md">per Christmas Eve mission</text>
<g transform="translate(75,215)"><text x="0" y="25" class="txt md">Biological motive system</text><rect x="380" y="2" width="620" height="34" rx="8" class="bar"/><rect x="380" y="2" width="620" height="34" rx="8" class="hot"/><text x="1030" y="28" class="txt md">177.7</text><text x="0" y="100" class="txt md">Harness</text><rect x="380" y="77" width="620" height="34" rx="8" class="bar"/><rect x="380" y="77" width="195" height="34" rx="8" class="gold"/><text x="1030" y="103" class="txt md">55.8</text><text x="0" y="175" class="txt md">Sleigh structure</text><rect x="380" y="152" width="620" height="34" rx="8" class="bar"/><rect x="380" y="152" width="52" height="34" rx="8" class="gold"/><text x="1030" y="178" class="txt md">15.0</text><text x="0" y="250" class="txt md">Maintenance</text><rect x="380" y="227" width="620" height="34" rx="8" class="bar"/><rect x="380" y="227" width="30" height="34" rx="8" class="gold"/><text x="1030" y="253" class="txt md">8.6</text><text x="0" y="325" class="txt md">Logistics</text><rect x="380" y="302" width="620" height="34" rx="8" class="bar"/><rect x="380" y="302" width="29" height="34" rx="8" class="gold"/><text x="1030" y="328" class="txt md">8.4</text><text x="0" y="400" class="txt md">Finishes</text><rect x="380" y="377" width="620" height="34" rx="8" class="bar"/><rect x="380" y="377" width="5" height="34" rx="3" class="gold"/><text x="1030" y="403" class="txt md">1.3</text></g>
<rect x="75" y="645" width="1050" height="55" rx="10" fill="#112232"/><text x="100" y="681" class="a md">HOTSPOT · Reindeer forage = 67% of the baseline footprint.</text>
</svg>