<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">DeLorean Time Machine technical reconstruction plate</title>
  <desc id="desc">A side-view engineering schematic showing the approved 4.267 metre length, 1.988 metre width, 1.140 metre height, 1,233 kilogram full-tank factory mass, 1,194.5 kilogram production mass and 136 mile-per-hour factory top speed.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071019"/><stop offset="1" stop-color="#0b1622"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#234557" stroke-width="1" opacity=".34"/></pattern>
    <marker id="dim" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0 4L8 0V8Z" fill="#6de7ff"/></marker>
  </defs>
  <rect width="1200" height="760" rx="20" fill="url(#bg)"/>
  <rect width="1200" height="760" rx="20" fill="url(#grid)"/>
  <rect x="28" y="28" width="1144" height="704" rx="14" fill="none" stroke="#d0a563" stroke-width="2"/>
  <text x="70" y="82" fill="#6de7ff" font-family="Arial, sans-serif" font-size="18" letter-spacing="4">S01 / EP03 / TECHNICAL PLATE</text>
  <text x="70" y="132" fill="#eef7fb" font-family="Georgia, serif" font-size="40">The real car anchors the impossible.</text>
  <text x="70" y="168" fill="#9ab0bc" font-family="Arial, sans-serif" font-size="17">1985 configuration · donor vehicle plus plutonium-era retrofit</text>

  <g transform="translate(62 215)" fill="none" stroke-linejoin="round">
    <path d="M65 253L104 176L248 151L330 89H471L543 147L651 166L704 246H683L660 204H139L119 246H65Z" fill="#0d1b27" stroke="#eef7fb" stroke-width="4"/>
    <path d="M267 151L344 99H458L520 151" fill="#112232" stroke="#6de7ff" stroke-width="3"/>
    <path d="M346 99L359 151M458 99L441 151" stroke="#234557" stroke-width="2"/>
    <path d="M535 151L575 119L647 138L670 178" fill="#112232" stroke="#d0a563" stroke-width="3"/>
    <path d="M564 129L584 87M590 132L620 100M614 139L649 118" stroke="#d0a563" stroke-width="3"/>
    <path d="M157 203H638M241 152L211 203M528 153L552 203" stroke="#234557" stroke-width="2"/>
    <circle cx="186" cy="233" r="53" fill="#071019" stroke="#eef7fb" stroke-width="4"/>
    <circle cx="186" cy="233" r="31" stroke="#d0a563" stroke-width="3"/>
    <circle cx="592" cy="233" r="53" fill="#071019" stroke="#eef7fb" stroke-width="4"/>
    <circle cx="592" cy="233" r="31" stroke="#d0a563" stroke-width="3"/>
    <path d="M120 263H662" stroke="#234557" stroke-width="2" stroke-dasharray="7 8"/>

    <path d="M74 347H696" stroke="#6de7ff" stroke-width="2" marker-start="url(#dim)" marker-end="url(#dim)"/>
    <path d="M74 318V362M696 318V362" stroke="#6de7ff" stroke-width="2"/>
    <text x="385" y="383" text-anchor="middle" fill="#6de7ff" stroke="none" font-family="Arial, sans-serif" font-size="22">4.267 m LENGTH</text>

    <path d="M745 92V263" stroke="#6de7ff" stroke-width="2" marker-start="url(#dim)" marker-end="url(#dim)"/>
    <path d="M710 92H760M710 263H760" stroke="#6de7ff" stroke-width="2"/>
    <text x="720" y="168" text-anchor="end" fill="#6de7ff" stroke="none" font-family="Arial, sans-serif" font-size="21">1.140 m</text>
    <text x="720" y="194" text-anchor="end" fill="#9ab0bc" stroke="none" font-family="Arial, sans-serif" font-size="14">HEIGHT</text>
  </g>

  <g transform="translate(855 212)" font-family="Arial, sans-serif">
    <rect width="275" height="300" rx="14" fill="#112232" stroke="#234557" stroke-width="2"/>
    <text x="22" y="38" fill="#6de7ff" font-size="15" letter-spacing="1.8">FACTORY DATUM</text>
    <line x1="22" y1="58" x2="253" y2="58" stroke="#234557"/>
    <text x="22" y="94" fill="#9ab0bc" font-size="15">WIDTH</text><text x="253" y="94" text-anchor="end" fill="#eef7fb" font-size="20" font-weight="700">1.988 m</text>
    <text x="22" y="136" fill="#9ab0bc" font-size="15">FULL-TANK MASS</text><text x="253" y="136" text-anchor="end" fill="#eef7fb" font-size="20" font-weight="700">1,233 kg</text>
    <text x="22" y="178" fill="#9ab0bc" font-size="15">PROD. MASS</text><text x="253" y="178" text-anchor="end" fill="#eef7fb" font-size="20" font-weight="700">1,194.5 kg</text>
    <text x="22" y="220" fill="#9ab0bc" font-size="15">TOP SPEED</text><text x="253" y="220" text-anchor="end" fill="#eef7fb" font-size="20" font-weight="700">136 mph</text>
    <text x="22" y="264" fill="#d0a563" font-size="14" letter-spacing="1.4">FUEL ADJUSTMENT</text>
    <text x="22" y="287" fill="#9ab0bc" font-size="13">1,233 − (51.6 L × 0.746269 kg/L)</text>
  </g>

  <g transform="translate(70 600)" font-family="Arial, sans-serif">
    <rect width="250" height="86" rx="10" fill="#112232" stroke="#234557"/>
    <text x="18" y="29" fill="#9ab0bc" font-size="14" letter-spacing="1.5">DONOR MATERIALS</text>
    <text x="18" y="63" fill="#eef7fb" font-size="27" font-weight="700">1,194.5 kg</text>
    <rect x="270" width="250" height="86" rx="10" fill="#112232" stroke="#234557"/>
    <text x="288" y="29" fill="#9ab0bc" font-size="14" letter-spacing="1.5">RETROFIT HARDWARE</text>
    <text x="288" y="63" fill="#eef7fb" font-size="27" font-weight="700">150 kg</text>
    <rect x="540" width="250" height="86" rx="10" fill="#112232" stroke="#234557"/>
    <text x="558" y="29" fill="#9ab0bc" font-size="14" letter-spacing="1.5">VEHICLE ASSEMBLY</text>
    <text x="558" y="63" fill="#eef7fb" font-size="27" font-weight="700">1,143 kWh-eq</text>
    <rect x="810" width="250" height="86" rx="10" fill="#112232" stroke="#2a9fc4" stroke-width="2"/>
    <text x="828" y="29" fill="#6de7ff" font-size="14" letter-spacing="1.5">WORKSHOP FINISH</text>
    <text x="828" y="63" fill="#eef7fb" font-size="27" font-weight="700">50 kWh</text>
  </g>
</svg>
