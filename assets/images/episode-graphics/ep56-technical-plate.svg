<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Hydra of Lerna technical reconstruction plate</title>
  <desc id="desc">Blueprint-style reconstruction showing the 11 metre Hydra body, nine heads, 3.2 tonne baseline mass, semi-aquatic body plan and five-step neutralisation sequence.</desc>
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L8 3z" fill="#6de7ff"/></marker>
    <style>
      .bg{fill:#071019}.grid{stroke:#112232;stroke-width:1}.line{fill:none;stroke:#6de7ff;stroke-width:2}.goldline{fill:none;stroke:#d0a563;stroke-width:2}.dim{fill:none;stroke:#9ab0bc;stroke-width:1.5;marker-start:url(#arr);marker-end:url(#arr)}.head{fill:#0d1b27;stroke:#6de7ff;stroke-width:2}.imm{fill:#112232;stroke:#d0a563;stroke-width:3}.white{fill:#eef7fb}.muted{fill:#9ab0bc}.cyan{fill:#6de7ff}.gold{fill:#d0a563}.title{font:700 34px Georgia,serif}.label{font:700 18px Arial,sans-serif;letter-spacing:1px}.small{font:16px Arial,sans-serif}.tiny{font:14px Arial,sans-serif}.value{font:700 26px Arial,sans-serif}
    </style>
  </defs>
  <rect width="1200" height="760" rx="20" class="bg"/>
  <g opacity=".7">
    <path d="M60 170H1140M60 250H1140M60 330H1140M60 410H1140M60 490H1140M60 570H1140" class="grid"/>
    <path d="M140 140V650M300 140V650M460 140V650M620 140V650M780 140V650M940 140V650M1100 140V650" class="grid"/>
  </g>
  <rect x="28" y="28" width="1144" height="704" rx="16" fill="none" stroke="#234557" stroke-width="1.5"/>
  <text x="64" y="76" class="gold label">EPISODE #56 · TECHNICAL PLATE</text>
  <text x="64" y="118" class="white title">Nine heads. One reconstructed body plan.</text>

  <g transform="translate(345 160)">
    <path d="M110 380 C80 320 80 245 110 190 C155 105 315 95 395 165 C450 213 463 311 420 375 C385 429 319 449 240 438 C181 430 136 413 110 380Z" fill="#0d1b27" stroke="#6de7ff" stroke-width="3"/>
    <path d="M395 340 C470 352 525 390 542 430 C475 423 423 410 376 385" class="line"/>
    <path d="M130 345 C80 360 48 389 30 422 C75 415 113 401 150 378" class="line"/>

    <path d="M165 210 C125 170 110 124 127 79" class="line"/><ellipse cx="128" cy="68" rx="24" ry="16" class="head"/>
    <path d="M205 175 C173 124 176 82 198 49" class="line"/><ellipse cx="200" cy="39" rx="24" ry="16" class="head"/>
    <path d="M245 158 C229 98 244 56 270 29" class="line"/><ellipse cx="274" cy="21" rx="24" ry="16" class="head"/>
    <path d="M285 153 C285 93 304 50 330 25" class="goldline"/><ellipse cx="333" cy="18" rx="27" ry="18" class="imm"/>
    <path d="M325 160 C343 99 376 65 404 49" class="line"/><ellipse cx="412" cy="43" rx="24" ry="16" class="head"/>
    <path d="M360 177 C395 126 433 96 466 88" class="line"/><ellipse cx="477" cy="87" rx="24" ry="16" class="head"/>
    <path d="M384 211 C430 172 475 154 509 159" class="line"/><ellipse cx="520" cy="163" rx="24" ry="16" class="head"/>
    <path d="M151 249 C105 231 68 236 43 257" class="line"/><ellipse cx="31" cy="264" rx="24" ry="16" class="head"/>
    <path d="M408 249 C456 231 499 235 532 260" class="line"/><ellipse cx="544" cy="267" rx="24" ry="16" class="head"/>

    <path d="M150 375 C178 357 203 351 224 354M348 355 C374 350 396 359 420 378" class="line"/>
    <path d="M214 420 L194 456M358 422 L379 458" class="line"/>
  </g>

  <line x1="330" y1="640" x2="925" y2="640" class="dim"/>
  <line x1="330" y1="620" x2="330" y2="654" class="line"/><line x1="925" y1="620" x2="925" y2="654" class="line"/>
  <text x="627" y="629" text-anchor="middle" class="cyan label">11 m RECONSTRUCTED BODY LENGTH</text>

  <g transform="translate(70 190)">
    <rect width="245" height="300" rx="12" fill="#0b1622" stroke="#234557" stroke-width="2"/>
    <text x="20" y="34" class="gold label">BASELINE</text>
    <text x="20" y="80" class="white value">3.2 t</text><text x="20" y="104" class="muted small">mass proxy</text>
    <text x="20" y="150" class="white value">9 heads</text><text x="20" y="174" class="muted small">8 mortal + 1 immortal</text>
    <text x="20" y="220" class="white small">Semi-aquatic reptilian</text><text x="20" y="244" class="muted tiny">body type</text>
    <text x="20" y="278" class="cyan small">Living biomass excluded</text>
  </g>

  <g transform="translate(925 190)">
    <rect width="205" height="300" rx="12" fill="#0b1622" stroke="#234557" stroke-width="2"/>
    <text x="20" y="34" class="gold label">CONTAINMENT</text>
    <text x="20" y="78" class="white value">Lime</text>
    <text x="20" y="116" class="white value">LDPE</text>
    <text x="20" y="154" class="white value">Boulder</text>
    <path d="M20 184H185" stroke="#234557" stroke-width="1.5"/>
    <text x="20" y="217" class="muted tiny">Cut-off:</text>
    <text x="20" y="242" class="white small">immortal head sealed</text>
    <text x="20" y="266" class="white small">and pit closed</text>
  </g>

  <text x="70" y="544" class="gold label">FIELD-CONTROL SEQUENCE</text>
  <g transform="translate(70 565)">
    <g><rect width="190" height="55" rx="9" fill="#0d1b27" stroke="#6de7ff"/><text x="18" y="34" class="white small">01 · Locate</text></g>
    <g transform="translate(205)"><rect width="190" height="55" rx="9" fill="#0d1b27" stroke="#6de7ff"/><text x="18" y="34" class="white small">02 · Immobilise</text></g>
    <g transform="translate(410)"><rect width="190" height="55" rx="9" fill="#0d1b27" stroke="#d0a563"/><text x="18" y="34" class="white small">03 · Sever</text></g>
    <g transform="translate(615)"><rect width="190" height="55" rx="9" fill="#0d1b27" stroke="#d0a563"/><text x="18" y="34" class="white small">04 · Cauterise</text></g>
    <g transform="translate(820)"><rect width="190" height="55" rx="9" fill="#0d1b27" stroke="#d0a563"/><text x="18" y="34" class="white small">05 · Contain</text></g>
  </g>
  <text x="70" y="700" class="muted tiny">Geometry and process logic reproduced from the approved Episode #56 reconstruction; drawing is schematic, not anatomical evidence.</text>
</svg>
