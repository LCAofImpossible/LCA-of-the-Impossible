<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">Trojan Horse hotspot contribution breakdown</title>
<desc id="desc">Primary timber contributes 45.2 percent, hemp rope textile proxy 31.9 percent, metal fasteners 13.7 percent, wood combustion 6.5 percent, resin finish 1.7 percent and freight 0.9 percent of the 8.4 tonne carbon dioxide equivalent main result.</desc>
<style>
.bg{fill:#071019}.panel{fill:#0d1b27;stroke:#234557;stroke-width:2}.bar{fill:#183346}.b1{fill:#d0a563}.b2{fill:#42b883}.b3{fill:#6d93a7}.b4{fill:#486d80}.b5{fill:#31566a}.b6{fill:#234557}
