<text x="70" y="78" fill="#d0a563" font-family="Georgia,serif" font-size="22" letter-spacing="4">EPISODE #45 · TECHNICAL PLATE</text>
<text x="70" y="126" fill="#eef7fb" font-family="Arial,sans-serif" font-size="34" font-weight="700">GEOMETRY BEFORE GOLD</text>
