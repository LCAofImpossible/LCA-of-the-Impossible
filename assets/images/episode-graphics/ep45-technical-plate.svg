  <text x="190" y="0" fill="#c4f7ff" stroke="none" font-family="Arial,sans-serif" font-size="18" text-anchor="middle">8.0 cm rim diameter</text>
  <path d="M304 98L270 116" stroke="#6de7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="320" y="92" fill="#c4f7ff" stroke="none" font-family="Arial,sans-serif" font-size="18">1.2 mm wall proxy</text>
</g>
<g font-family="Arial,sans-serif" transform="translate(790 185)">
  <text x="0" y="0" fill="#6de7ff" font-size="16" font-weight="700">RECONSTRUCTED MASS</text>
