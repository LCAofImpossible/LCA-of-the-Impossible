  <path d="M70 20H310C303 86 281 151 249 199C230 228 211 246 204 277V350C204 372 223 389 246 389H267V425H113V389H134C157 389 176 372 176 350V277C169 246 150 228 131 199C99 151 77 86 70 20Z"/>
