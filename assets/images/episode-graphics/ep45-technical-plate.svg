<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">Episode 45 King Midas technical plate</title>
<desc id="desc">Hollow goblet reconstruction with an 8 centimetre rim diameter, 1.2 millimetre wall proxy, 32.2 cubic centimetres gold volume, 19.32 grams per cubic centimetre density and 0.622 kilogram gold mass.</desc>
