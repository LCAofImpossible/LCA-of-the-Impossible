  <g transform="translate(0 135)"><rect width="330" height="84" rx="8" fill="#0d1b27" stroke="#234557"/><text x="20" y="30" fill="#9ab0bc" font-size="14">DENSITY</text><text x="20" y="61" fill="#eef7fb" font-size="24">19.32 g/cm³</text></g>
  <g transform="translate(0 235)"><rect width="330" height="84" rx="8" fill="#112232" stroke="#d0a563"/><text x="20" y="30" fill="#d0a563" font-size="14">GOLD MASS</text><text x="20" y="61" fill="#eef7fb" font-size="28" font-weight="700">0.622 kg Au</text></g>
  <g transform="translate(0 335)"><rect width="330" height="84" rx="8" fill="#0d1b27" stroke="#234557"/><text x="20" y="30" fill="#9ab0bc" font-size="14">SHAPE</text><text x="20" y="61" fill="#eef7fb" font-size="24">hollow goblet</text></g>
</g>
<g font-family="Arial,sans-serif"><text x="70" y="675" fill="#9ab0bc" font-size="17">Baseline freezes a hollow material volume. Surface-skin and solid-object readings remain sensitivities, not hidden alternatives.</text></g>
