<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
<title id="title">Minotaur Labyrinth inventory map</title>
<desc id="desc">Diagram showing construction, 30-year maintenance and Ariadne's thread as a separate intervention.</desc>
<rect width="720" height="420" rx="24" fill="#071423"/>
<rect x="20" y="20" width="680" height="380" rx="18" fill="none" stroke="#6de7ff" stroke-opacity="0.22"/>
<text x="40" y="58" fill="#c4f7ff" font-size="16" font-family="Arial, Helvetica, sans-serif" letter-spacing="2">INVENTORY MAP · EPISODE #40</text>
<text x="40" y="92" fill="#d0a563" font-size="32" font-weight="700" font-family="Arial, Helvetica, sans-serif">THE MINOTAUR'S LABYRINTH</text>
<text x="40" y="118" fill="#9ab0bc" font-size="15" font-family="Arial, Helvetica, sans-serif">Construction + 30 years material maintenance · thread reported separately</text>
<rect x="40" y="150" width="196" height="108" rx="14" fill="#0d1b27" stroke="#d0a563" stroke-opacity="0.52"/>
<text x="58" y="178" fill="#d0a563" font-size="14" font-weight="700" font-family="Arial, Helvetica, sans-serif">01 · CONSTRUCTION</text>
<text x="58" y="205" fill="#eef7fb" font-size="14" font-family="Arial, Helvetica, sans-serif">180,787 t worked stone</text>
<text x="58" y="227" fill="#eef7fb" font-size="14" font-family="Arial, Helvetica, sans-serif">+ brick, wood, metal, finishes</text>
<text x="58" y="249" fill="#9ab0bc" font-size="13" font-family="Arial, Helvetica, sans-serif">17.190 kt CO₂e · 92.4%</text>
<rect x="262" y="150" width="196" height="108" rx="14" fill="#0d1b27" stroke="#6de7ff" stroke-opacity="0.52"/>
<text x="280" y="178" fill="#6de7ff" font-size="14" font-weight="700" font-family="Arial, Helvetica, sans-serif">02 · MAINTENANCE</text>
<text x="280" y="205" fill="#eef7fb" font-size="14" font-family="Arial, Helvetica, sans-serif">30-year material replacement</text>
<text x="280" y="227" fill="#eef7fb" font-size="14" font-family="Arial, Helvetica, sans-serif">plaster is largest recurring flow</text>
<text x="280" y="249" fill="#9ab0bc" font-size="13" font-family="Arial, Helvetica, sans-serif">1.406 kt CO₂e · 7.6%</text>
<rect x="484" y="150" width="196" height="108" rx="14" fill="#0d1b27" stroke="#c4f7ff" stroke-opacity="0.45"/>
<text x="502" y="178" fill="#c4f7ff" font-size="14" font-weight="700" font-family="Arial, Helvetica, sans-serif">03 · THREAD · SEPARATE</text>
<text x="502" y="205" fill="#eef7fb" font-size="14" font-family="Arial, Helvetica, sans-serif">3,000 m · 24 kg</text>
<text x="502" y="227" fill="#eef7fb" font-size="14" font-family="Arial, Helvetica, sans-serif">external reference path</text>
<text x="502" y="249" fill="#9ab0bc" font-size="13" font-family="Arial, Helvetica, sans-serif">0.54 t CO₂e · not in headline</text>
<line x1="236" y1="204" x2="262" y2="204" stroke="#6de7ff" stroke-width="2"/>
<path d="M250 199 l10 5 -10 5" fill="none" stroke="#6de7ff" stroke-width="2"/>
<line x1="458" y1="204" x2="484" y2="204" stroke="#6de7ff" stroke-width="2" stroke-dasharray="5 5"/>
<rect x="40" y="286" width="640" height="92" rx="14" fill="#081b2b" stroke="#d0a563" stroke-opacity="0.28"/>
<text x="58" y="314" fill="#d0a563" font-size="14" font-weight="700" font-family="Arial, Helvetica, sans-serif">FUNCTIONAL UNIT</text>
<text x="58" y="340" fill="#eef7fb" font-size="15" font-family="Arial, Helvetica, sans-serif">One two-level Labyrinth · 22,000 m² plan · 44,000 m² gross floor area · 30 years</text>
<text x="58" y="362" fill="#9ab0bc" font-size="14" font-family="Arial, Helvetica, sans-serif">176,000 m³ excavation disclosed but not carbonized · 100% DEFRA coverage of quantified main GWP</text>
</svg>