<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
<title id="title">Minotaur Labyrinth hotspot breakdown</title>
<desc id="desc">Contribution chart showing initial construction at 92.4 percent, material maintenance at 7.6 percent, and worked stone as 75.1 percent of lifecycle GWP.</desc>
