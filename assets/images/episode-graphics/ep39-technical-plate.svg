<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
<title id="title">Atlantis technical reconstruction plate</title>
<desc id="desc">Concentric plan diagram showing the central island, three water rings, two land rings, sea canal, outer radius and working urban-capacity assumptions.</desc>
<rect width="720" height="420" rx="24" fill="#071423"/>
<rect x="20" y="20" width="680" height="380" rx="18" fill="none" stroke="#6de7ff" stroke-opacity="0.22"/>
<text x="40" y="58" fill="#c4f7ff" font-size="16" font-family="Arial, Helvetica, sans-serif" letter-spacing="2">TECHNICAL PLATE · EPISODE #39</text>
<text x="40" y="92" fill="#d0a563" font-size="32" font-weight="700" font-family="Arial, Helvetica, sans-serif">CONCENTRIC ROYAL-HARBOR CORE</text>
<text x="40" y="118" fill="#9ab0bc" font-size="15" font-family="Arial, Helvetica, sans-serif">Working conversion: 1 stade = 185 m · 1 plethron = 30.83 m</text>
<g transform="translate(250 255)">
  <circle r="120" fill="none" stroke="#d0a563" stroke-width="13"/>
  <circle r="92" fill="none" stroke="#2aa79e" stroke-width="17"/>
  <circle r="63" fill="none" stroke="#d0a563" stroke-width="15"/>
  <circle r="39" fill="none" stroke="#2aa79e" stroke-width="13"/>
  <circle r="20" fill="#d0a563" fill-opacity="0.82" stroke="#eef7fb" stroke-opacity="0.28"/>
  <line x1="0" y1="120" x2="0" y2="170" stroke="#52d9d1" stroke-width="8"/>
  <line x1="-150" y1="0" x2="150" y2="0" stroke="#6de7ff" stroke-opacity="0.15"/>
  <line x1="0" y1="-150" x2="0" y2="170" stroke="#6de7ff" stroke-opacity="0.15"/>
</g>
<line x1="250" y1="135" x2="390" y2="135" stroke="#c4f7ff" stroke-width="1.5"/>
<path d="M250 135 l8 -4 v8 z M390 135 l-8 -4 v8 z" fill="#c4f7ff"/>
<text x="283" y="129" fill="#c4f7ff" font-size="13" font-family="Arial, Helvetica, sans-serif">OUTER RADIUS 2.50 km</text>
<rect x="430" y="150" width="250" height="224" rx="14" fill="#0d1b27" stroke="#d0a563" stroke-opacity="0.42"/>
<text x="450" y="178" fill="#d0a563" font-size="14" font-weight="700" font-family="Arial, Helvetica, sans-serif">WORKING CITY</text>
<text x="450" y="205" fill="#eef7fb" font-size="14" font-family="Arial, Helvetica, sans-serif">Buildable land</text>
<text x="648" y="205" fill="#52d9d1" font-size="14" text-anchor="end" font-family="Arial, Helvetica, sans-serif">8.41 km²</text>
<text x="450" y="231" fill="#eef7fb" font-size="14" font-family="Arial, Helvetica, sans-serif">Coverage × floors</text>
<text x="648" y="231" fill="#52d9d1" font-size="14" text-anchor="end" font-family="Arial, Helvetica, sans-serif">40% × 2.25</text>
<text x="450" y="257" fill="#eef7fb" font-size="14" font-family="Arial, Helvetica, sans-serif">Gross floor area</text>
<text x="648" y="257" fill="#52d9d1" font-size="14" text-anchor="end" font-family="Arial, Helvetica, sans-serif">7.57 Mm²</text>
<text x="450" y="283" fill="#eef7fb" font-size="14" font-family="Arial, Helvetica, sans-serif">Operational residents</text>
<text x="648" y="283" fill="#52d9d1" font-size="14" text-anchor="end" font-family="Arial, Helvetica, sans-serif">500,000</text>
<line x1="450" y1="301" x2="660" y2="301" stroke="#6de7ff" stroke-opacity="0.18"/>
<text x="450" y="326" fill="#d0a563" font-size="14" font-weight="700" font-family="Arial, Helvetica, sans-serif">CANAL TO SEA</text>
<text x="450" y="350" fill="#eef7fb" font-size="14" font-family="Arial, Helvetica, sans-serif">50 stades · 3 plethra · 100 ft deep</text>
<text x="450" y="370" fill="#9ab0bc" font-size="12" font-family="Arial, Helvetica, sans-serif">26.4 Mm³ excavation · disclosed, not carbonized</text>
<text x="74" y="352" fill="#9ab0bc" font-size="12" font-family="Arial, Helvetica, sans-serif">Central island + two land rings</text>
<text x="74" y="371" fill="#9ab0bc" font-size="12" font-family="Arial, Helvetica, sans-serif">Three water rings · wall circuits 27.3 km</text>
</svg>