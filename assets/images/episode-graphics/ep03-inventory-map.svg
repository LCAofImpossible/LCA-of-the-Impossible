<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">DeLorean Time Machine life-cycle inventory map</title>
  <desc id="desc">Donor vehicle materials and vehicle assembly combine with time-machine retrofit hardware and workshop electricity to produce one complete 1985-configuration DeLorean Time Machine ready for its first jump.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071019"/><stop offset="1" stop-color="#0d1b27"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#234557" stroke-width="1" opacity=".34"/></pattern>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5 0 10Z" fill="#6de7ff"/></marker>
  </defs>
  <rect width="1200" height="760" rx="20" fill="url(#bg)"/>
  <rect width="1200" height="760" rx="20" fill="url(#grid)"/>
  <rect x="28" y="28" width="1144" height="704" rx="14" fill="none" stroke="#d0a563" stroke-width="2"/>
  <text x="70" y="82" fill="#6de7ff" font-family="Arial, sans-serif" font-size="18" letter-spacing="4">S01 / EP03 / INVENTORY MAP</text>
  <text x="70" y="132" fill="#eef7fb" font-family="Georgia, serif" font-size="40">A factory makes the car. A workshop breaks time.</text>
  <text x="70" y="168" fill="#9ab0bc" font-family="Arial, sans-serif" font-size="17">Production to first-jump readiness · operation reported separately</text>

  <g font-family="Arial, sans-serif">
    <g transform="translate(70 220)">
      <rect width="292" height="146" rx="12" fill="#112232" stroke="#2a9fc4" stroke-width="2"/>
      <text x="20" y="34" fill="#6de7ff" font-size="14" letter-spacing="1.7">01 · DONOR PRODUCTION</text>
      <text x="20" y="73" fill="#eef7fb" font-size="27" font-weight="700">1,194.5 kg</text>
      <text x="20" y="103" fill="#9ab0bc" font-size="16">fuel-adjusted vehicle materials</text>
      <text x="20" y="128" fill="#d0a563" font-size="14">BASE VEHICLE</text>
    </g>
    <g transform="translate(70 405)">
      <rect width="292" height="126" rx="12" fill="#112232" stroke="#234557" stroke-width="2"/>
      <text x="20" y="34" fill="#6de7ff" font-size="14" letter-spacing="1.7">02 · VEHICLE ASSEMBLY</text>
      <text x="20" y="72" fill="#eef7fb" font-size="27" font-weight="700">1,143 kWh-eq</text>
      <text x="20" y="101" fill="#9ab0bc" font-size="16">modern assembly-energy proxy</text>
    </g>

    <path d="M382 293H465" stroke="#6de7ff" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M382 468H425Q451 468 451 442V391Q451 365 474 365" fill="none" stroke="#6de7ff" stroke-width="3" marker-end="url(#arrow)"/>

    <g transform="translate(470 218)">
      <circle cx="160" cy="178" r="154" fill="#071019" stroke="#d0a563" stroke-width="3"/>
      <circle cx="160" cy="178" r="124" fill="none" stroke="#234557" stroke-width="2" stroke-dasharray="7 9"/>
      <path d="M61 190L86 137H201L241 158L267 207H250L238 184H94L82 207H54Z" fill="#0d1b27" stroke="#eef7fb" stroke-width="3" stroke-linejoin="round"/>
      <path d="M104 137L134 96H195L221 137" fill="#112232" stroke="#6de7ff" stroke-width="3"/>
      <circle cx="105" cy="207" r="28" fill="#071019" stroke="#d0a563" stroke-width="3"/>
      <circle cx="222" cy="207" r="28" fill="#071019" stroke="#d0a563" stroke-width="3"/>
      <path d="M205 108L248 83M214 119L264 105M229 130L271 127" stroke="#d0a563" stroke-width="3"/>
      <text x="160" y="292" text-anchor="middle" fill="#eef7fb" font-size="22" font-weight="700">ONE COMPLETE MACHINE</text>
      <text x="160" y="318" text-anchor="middle" fill="#6de7ff" font-size="17">1985 configuration</text>
      <text x="160" y="342" text-anchor="middle" fill="#9ab0bc" font-size="15">ready for first jump</text>
    </g>

    <path d="M796 293H879" stroke="#6de7ff" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M796 468H839Q865 468 865 442V391Q865 365 888 365" fill="none" stroke="#6de7ff" stroke-width="3" marker-end="url(#arrow)"/>

    <g transform="translate(858 220)">
      <rect width="272" height="146" rx="12" fill="#112232" stroke="#2a9fc4" stroke-width="2"/>
      <text x="20" y="34" fill="#6de7ff" font-size="14" letter-spacing="1.7">03 · TIME RETROFIT</text>
      <text x="20" y="73" fill="#eef7fb" font-size="27" font-weight="700">150 kg</text>
      <text x="20" y="103" fill="#9ab0bc" font-size="16">hardware installed and wired</text>
      <text x="20" y="128" fill="#d0a563" font-size="12">80 kg REACTOR + SHIELDING INCLUDED</text>
    </g>
    <g transform="translate(858 405)">
      <rect width="272" height="126" rx="12" fill="#112232" stroke="#234557" stroke-width="2"/>
      <text x="20" y="34" fill="#6de7ff" font-size="14" letter-spacing="1.7">04 · WORKSHOP FINISH</text>
      <text x="20" y="72" fill="#eef7fb" font-size="27" font-weight="700">50 kWh</text>
      <text x="20" y="101" fill="#9ab0bc" font-size="16">assembly electricity</text>
    </g>
  </g>

  <g transform="translate(70 600)" font-family="Arial, sans-serif">
    <rect width="1060" height="88" rx="12" fill="#071019" stroke="#d0a563" stroke-width="2"/>
    <text x="24" y="27" fill="#d0a563" font-size="13" letter-spacing="1.8">EXPLICIT CUT-OFF</text>
    <text x="24" y="51" fill="#eef7fb" font-size="14">TWIN PINES MALL · HILL VALLEY ROADS + BUILDINGS</text>
    <text x="24" y="72" fill="#eef7fb" font-size="14">PLUTONIUM FUEL CYCLE</text>
    <text x="1036" y="31" text-anchor="end" fill="#6de7ff" font-size="13" letter-spacing="1.4">OPERATION SEPARATE</text>
    <text x="1036" y="58" text-anchor="end" fill="#9ab0bc" font-size="14">1.21 GW requires pulse duration</text>
  </g>
</svg>
